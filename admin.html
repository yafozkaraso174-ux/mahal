<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محلّي — لوحة المالك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
.owner-nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:60px;align-items:center;z-index:15}.owner-nav button{background:none;border:0;color:var(--muted);font:700 13px Cairo;min-height:44px}.owner-nav .on{color:var(--purple)}.wrap{padding-bottom:100px!important}.owner-tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:12px;margin-top:12px}.owner-tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 12px Cairo;padding:9px 2px;min-height:44px}.owner-tabs .on{background:var(--purple-soft);color:var(--purple);border-radius:9px}.owner-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.owner-shop{display:block;width:100%;text-align:right;color:var(--ink);font:inherit;cursor:pointer}.owner-shop h3{font-size:15px}.owner-shop p,.card p{font-size:12px;color:var(--muted);line-height:1.9;margin-top:9px}hr{border:0;border-top:1px solid var(--line);margin:12px 0}.trow b{overflow-wrap:anywhere;text-align:left}.trow{gap:12px}.owner-money{font-size:30px;font-weight:900;color:var(--purple)}.owner-alert{background:var(--amber-soft);color:var(--amber);padding:10px;border-radius:12px;font-size:12px;margin-top:10px}@media(max-width:440px){.owner-add-grid{grid-template-columns:1fr!important}}.owner-check{display:block;font-size:12px;line-height:1.8;margin-top:12px}button:disabled{opacity:.55}#themeBtn{left:100px}

:root{--bg:#F2ECDD;--card:#FFF;--line:#E4D8BE;--ink:#1B1812;--muted:#7A6F5C;
--green:#0B6B3D;--green2:#12A150;--green-soft:#D9EFE2;--amber:#E8960C;--amber-soft:#FCEED3;
--red:#D63B2F;--red-soft:#FBE3E0;--blue:#1D5BB5;--blue-soft:#E3EDFA;--deep:#0A3D27;--purple:#6C3BD6;--purple-soft:#EEE7FB}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.appbar{background:linear-gradient(135deg,var(--purple),#3D1F7A);padding:16px;display:flex;align-items:center;gap:10px;color:#fff;position:sticky;top:0;z-index:10}
.appbar .t{font-size:18px;font-weight:800;flex:1}
.appbar .t small{display:block;font-size:11.5px;font-weight:700;opacity:.85}
.iconbtn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);border:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 8px rgba(90,70,30,.06)}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0}
.k{color:var(--muted);font-weight:700}
.btn{display:block;width:100%;text-align:center;border:none;border-radius:14px;padding:13px;font-weight:800;font-size:14.5px;margin-top:10px;cursor:pointer;font-family:inherit}
.btn-p{background:linear-gradient(135deg,#8B5CF6,var(--purple));color:#fff;box-shadow:0 3px 10px rgba(108,59,214,.3)}
.btn-o{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn-g{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff}
.btn-r{background:var(--red-soft);color:var(--red);border:1.5px solid #F0C4BF}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.chip-g{background:var(--green-soft);color:var(--green)}
.chip-r{background:var(--red-soft);color:var(--red)}
.chip-a{background:var(--amber-soft);color:var(--amber)}
.shop{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
.shop:last-child{border-bottom:none}
.shop .nm{flex:1}
.shop .nm b{font-size:14.5px;display:block}
.shop .nm span{font-size:11.5px;color:var(--muted);font-weight:700}
.av{width:42px;height:42px;border-radius:13px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.row2{display:flex;gap:8px}
.row2 .mini{flex:1;border-radius:14px;padding:10px;text-align:center;border:1.5px solid var(--line);background:var(--card)}
.mini .v{font-size:18px;font-weight:900}
.mini .l{font-size:11px;color:var(--muted);font-weight:700}
.mini.g{background:var(--green-soft)}.mini.r{background:var(--red-soft)}.mini.a{background:var(--amber-soft)}.mini.p{background:var(--purple-soft)}
.note{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center;margin-top:10px;line-height:1.7}
.seg{display:flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-top:8px}
.seg div{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:8px;border-radius:9px;color:var(--muted);cursor:pointer}
.seg .on{background:var(--purple);color:#fff}
.field{margin-top:10px}
.lbl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.inp{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:14px;font-weight:700;color:var(--ink);font-family:inherit;outline:none}
.inp:focus{border-color:var(--purple)}
.inp.ltr{direction:ltr;text-align:left}
.prog{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green2),var(--green))}
.prog i.warn{background:linear-gradient(90deg,var(--amber),#C77800)}
.prog i.out{background:var(--red)}
.days{font-size:12px;font-weight:800}
.wa{background:#DCF3E5;border:1.5px solid #A8DDBF;border-radius:14px;padding:10px;font-size:12.5px;font-weight:700;line-height:1.9;margin-top:10px}
.usr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1.5px solid var(--line);font-size:13px;font-weight:700}
.usr:last-child{border-bottom:none}
.usr .r{margin-right:auto;font-size:11px;color:var(--muted);font-weight:800}
.stop-ic{width:74px;height:74px;border-radius:24px;background:var(--red-soft);display:flex;align-items:center;justify-content:center;font-size:34px;margin:18px auto 10px}
.overlay{position:fixed;inset:0;background:rgba(20,14,4,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px}
.sheet h3{font-size:16px;font-weight:900;text-align:center;margin:6px 0 4px}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#1B1812;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:800;z-index:99;display:none}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#8B5CF6,var(--purple));display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 6px 18px rgba(108,59,214,.35)}
.cred{background:var(--bg);border:1.5px dashed var(--purple);border-radius:12px;padding:10px;font-size:13px;font-weight:700;direction:ltr;text-align:left;margin-top:10px;line-height:1.8;user-select:all}

/* ===== الوضع الداكن (الافتراضي فاتح) ===== */
html[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--card:#18263b;--line:#2a3c57;--ink:#e9eef8;--muted:#9fb0c6;--green:#17a77d;--green2:#12a37a;--green-soft:#123a35;--amber:#f0aa2c;--amber-soft:#3b3015;--red:#f27067;--red-soft:#3d2128;--blue:#6aa8ff;--blue-soft:#162f4d;--deep:#0c3b2f;--purple:#a58bf5;--purple-soft:#2a2150}
html[data-theme=dark] body{background:#060b14}
html[data-theme=dark] #app{box-shadow:0 0 40px rgba(0,0,0,.5)}
html[data-theme=dark] [style*="color:#9A6A14"],html[data-theme=dark] .prd .stk.low{color:#e8b64a!important}
html[data-theme=dark] .qty,html[data-theme=dark] .citem .qty{background:#0f1a2b}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#0f1a2b;color:var(--ink);border-color:var(--line)}
html[data-theme=dark] ::placeholder{color:#7487a0}
html[data-theme=dark] .wa{background:#12332b;border-color:#1f5a49}
html[data-theme=dark] .btn-r{border-color:#5a2b33}
html[data-theme=dark] .sheet,html[data-theme=dark] .modal{background:#111d2e}
html[data-theme=dark] .toast{background:#e9eef8;color:#0b1220}
html[data-theme=dark] .photo-pick{border-color:#3a4f6d}
#themeBtn{position:fixed;left:96px;top:calc(12px + env(safe-area-inset-top));z-index:900;width:34px;height:34px;border-radius:50%;border:1px solid rgba(128,128,128,.4);background:rgba(20,30,45,.55);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);padding:0}
@media print{#themeBtn{display:none!important}}

@media(min-width:768px){.wrap{max-width:1000px}#shops{display:block}}
@media(min-width:1100px){.wrap{max-width:1200px}}
</style><script id="theme-early">try{var t=localStorage.getItem('mahal_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script></head><body>

<div id="view-login" class="login">
<div class="logo">🛠️</div>
<h2 style="margin-top:14px;font-weight:900">محلّي — لوحة المالك</h2>
<p style="color:var(--muted);font-size:12.5px;font-weight:700;margin:4px 0 14px">الدخول لصاحب المنصة بس</p>
<div class="card" style="width:100%;max-width:340px">
<div class="field"><div class="lbl">الإيميل</div><input class="inp ltr" id="lg-email" autocomplete="username"></div>
<div class="field"><div class="lbl">الباسورد</div><input class="inp ltr" id="lg-pass" type="password" autocomplete="current-password"></div>
<button class="btn btn-p" onclick="doLogin()">دخول</button>
<div class="note" id="lg-err" style="color:var(--red)"></div>
</div></div>

<div id="view-main" class="hidden">
<div class="appbar"><div class="t" id="bar-title">محلّي — لوحة المالك<small>إدارة المحلات المشتركة</small></div>
<button class="iconbtn" onclick="loadAll()" title="تحديث">↻</button>
<button class="iconbtn" onclick="logout()" title="خروج">⏻</button></div>
<div class="wrap" id="main-wrap"></div>
</div>

<div class="overlay hidden" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const APPURL=location.origin+location.pathname.replace(/[^/]*$/,"").replace(/\/$/,"");
const SUPA={url:'https://ofqhrpkgxxbdrhuujgxt.supabase.co',anon:'sb_publishable_CH8nhDJQlV-5xsKYoCZRVg_mUoLsTQw'};
let token=localStorage.getItem('mahal_admin_token')||'';
let tenants=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'}):'—';
const daysLeft=t=>{if(!t.sub_end)return null;const t1=new Date(t.sub_end+'T00:00:00');const t0=new Date();t0.setHours(0,0,0,0);return Math.round((t1-t0)/86400000);};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
async function api(path,opts){opts=opts||{};opts.headers=Object.assign({'apikey':SUPA.anon,'Authorization':'Bearer '+(token||SUPA.anon),'Content-Type':'application/json'},opts.headers||{});
 const r=await fetch(SUPA.url+'/rest/v1/'+path,opts);
 if(r.status===401){logout();throw 'انتهت الجلسة';}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
 if(!r.ok)throw (j&&j.message)||('خطأ '+r.status);return j;}
async function rpc(name,body){const r=await fetch(SUPA.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':SUPA.anon,'Authorization':'Bearer '+(token||SUPA.anon),'Content-Type':'application/json'},body:JSON.stringify(body||{})});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
 if(!r.ok){const e=new Error((j&&j.message)||('خطأ '+r.status));e.definitive=['P0001','23505','23514','22P02','22007','22008','22003'].includes(j?.code);throw e;}return j;}

async function doLogin(){
 const email=$('#lg-email').value.trim(),pass=$('#lg-pass').value;
 $('#lg-err').textContent='';
 if(!email||!pass){$('#lg-err').textContent='اكتب الإيميل والباسورد';return;}
 try{
  const r=await fetch(SUPA.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPA.anon,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
  const j=await r.json();
  if(!r.ok){$('#lg-err').textContent='بيانات الدخول مش صح';return;}
  token=j.access_token;localStorage.setItem('mahal_admin_token',token);
  boot();
 }catch(e){$('#lg-err').textContent='حصلت مشكلة في الاتصال';}
}
function logout(){token='';localStorage.removeItem('mahal_admin_token');$('#view-main').classList.add('hidden');$('#view-login').classList.remove('hidden');}

async function boot(){
 $('#view-login').classList.add('hidden');$('#view-main').classList.remove('hidden');
 try{
  // Admin access is enforced again on every server action.
  const admin=await api('platform_admins?select=user_id&limit=1');
  if(!admin||!admin.length){$('#main-wrap').innerHTML='<div class="card" style="text-align:center;margin-top:30px"><div class="stop-ic">🔒</div><b>الحساب ده مش أدمن المنصة</b><div class="note">سجّل بحساب مالك المنصة</div></div>';return;}
  loadAll();
 }catch(e){$('#main-wrap').innerHTML='<div class="note">'+esc(String(e))+'</div>';}
}

function closeSheet(){$('#ov').classList.add('hidden');}
/* @owner-dashboard */
/* Owner dashboard. All mutations are explicit online server actions. */
let ownerData={today:'',shops:[],entries:[]},ownerFilter='',ownerSearch='',paymentShop='',paymentMonth='',ownerBusy=false,ownerPending=null;
const ownerMoney=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
const ownerMethods={cash:'نقدي',insta:'إنستاباي',vf:'فودافون كاش',bank:'تحويل بنكي'};
const ownerId=()=>crypto.randomUUID();
function ownerPendingKey(){try{return 'mahal_owner_pending_'+JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;}catch(e){return 'mahal_owner_pending_local';}}
function ownerToday(){return ownerData.today||new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function ownerDateAdd(d,m){const [y,mo,day]=d.split('-').map(Number),target=new Date(Date.UTC(y,mo-1+m,1)),last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();target.setUTCDate(Math.min(day,last));return target.toISOString().slice(0,10);}
function ownerEnd(t,m){return ownerDateAdd(t.sub_end&&t.sub_end>ownerToday()?t.sub_end:ownerToday(),m);}
function ownerDays(t){return t.sub_end?Math.round((Date.parse(t.sub_end)-Date.parse(ownerToday()))/86400000):null;}
function ownerStatus(t){const d=ownerDays(t);return t.status!=='active'?['موقوف يدويًا','r']:d!==null&&d<0?['اشتراك منتهي','r']:d!==null&&d<=7?['تجديد قريب','a']:['شغّال','g'];}
function ownerBadge(t){const s=ownerStatus(t);return `<span class="chip chip-${s[1]}">${s[0]}</span>`;}
function ownerKV(k,v){return `<div class="trow"><span class="k">${esc(k)}</span><b>${esc(v)}</b></div>`;}
function ownerField(label,id,value='',type='text'){return `<div class="field"><label class="lbl" for="${id}">${esc(label)}</label><input class="inp" type="${type}" id="${id}" value="${esc(value)}"></div>`;}
function ownerNav(active='shops'){return `<nav class="owner-nav"><button class="${active==='shops'?'on':''}" onclick="renderHome()">▦ المحلات</button><button class="${active==='payments'?'on':''}" onclick="renderPayments()">▤ الدفعات</button></nav>`;}
function ownerShell(title,html,nav='shops'){$('#bar-title').innerHTML=esc(title)+'<small>لوحة مالك المنصة</small>';$('#main-wrap').innerHTML=html+ownerNav(nav);}
function ownerLast(t){return ownerData.entries.find(e=>e.tenant_id===t.id&&e.kind==='payment'&&!ownerData.entries.some(c=>c.original_id===e.id));}
async function loadAll(){if(ownerBusy)return;ownerShell('المحلات','<div class="note">بيحمّل…</div>');try{ownerData=await rpc('admin_dashboard');tenants=ownerData.shops;renderHome();ownerRestore();}catch(e){ownerShell('المحلات',`<div class="card"><p>تعذر تحميل لوحة المحلات. اتصال الإنترنت مطلوب، وقد تحتاج ترقية قاعدة البيانات قبل استخدام النسخة دي.</p><div class="note">${esc(String(e))}</div><button class="btn btn-o" onclick="loadAll()">حاول تاني</button></div>`);}}
function renderHome(){const run=tenants.filter(t=>t.status==='active'&&(ownerDays(t)===null||ownerDays(t)>=0)).length,warn=tenants.filter(t=>ownerStatus(t)[1]==='a').length;const list=tenants.filter(t=>(!ownerSearch||(t.name+' '+t.owner_name+' '+t.phone).includes(ownerSearch))&&(!ownerFilter||(ownerFilter==='run'?t.status==='active'&&(ownerDays(t)===null||ownerDays(t)>=0):ownerFilter==='suspended'?t.status!=='active':ownerDays(t)!==null&&ownerDays(t)<0)));
ownerShell('المحلات',`<div class="row2"><div class="mini p"><div class="v">${ownerMoney(tenants.length)}</div><div class="l">إجمالي المحلات</div></div><div class="mini g"><div class="v">${ownerMoney(run)}</div><div class="l">شغّالة</div></div><div class="mini a"><div class="v">${ownerMoney(warn)}</div><div class="l">تجديد قريب</div></div></div><button class="btn btn-p" onclick="renderAdd()">＋ إضافة محل جديد</button><div class="field"><input id="owner-search" class="inp" aria-label="ابحث باسم المحل أو صاحبه" placeholder="ابحث باسم المحل أو صاحبه" value="${esc(ownerSearch)}" onchange="ownerSearch=this.value.trim();renderHome()"></div><div class="owner-tabs">${[['','الكل'],['run','شغّال'],['suspended','موقوف'],['expired','منتهي']].map(([k,v])=>`<button class="${ownerFilter===k?'on':''}" onclick="ownerFilter='${k}';renderHome()">${v}</button>`).join('')}</div>${list.map(t=>{const d=ownerDays(t),last=ownerLast(t);return `<button class="card owner-shop" onclick="renderDetail(${tenants.indexOf(t)})"><div class="owner-row"><h3>${esc(t.name)}</h3>${ownerBadge(t)}</div><p>${esc(t.shop_type==='mobile'?'موبايلات':'محل عام')} · ${esc(t.owner_name||'بدون اسم صاحب')}</p><hr>${ownerKV('نهاية الاشتراك',t.sub_end?fmtD(t.sub_end):'مفتوح بدون نهاية')}<p>${d===null?'اشتراك بدون نهاية':d<0?'انتهى من '+ownerMoney(-d)+' يوم':'باقي '+ownerMoney(d)+' يوم'}${last?' · آخر دفعة '+ownerMoney(last.amount)+' ج':''}</p></button>`;}).join('')||'<div class="card note">مفيش محلات مطابقة</div>'}`);}
function renderDetail(i){const t=tenants[i],last=ownerLast(t);ownerShell(t.name,`<div class="card"><div class="owner-row"><h3>حالة المحل</h3>${ownerBadge(t)}</div>${ownerKV('صاحب المحل',t.owner_name||'—')}${ownerKV('حساب الدخول',t.owner_email||'—')}${ownerKV('نوع المحل',t.shop_type==='mobile'?'موبايلات':'محل عام')}<hr>${ownerKV('نهاية الاشتراك',t.sub_end?fmtD(t.sub_end):'مفتوح بدون نهاية')}${ownerKV('المتبقي',ownerDays(t)===null?'بدون نهاية':ownerDays(t)<0?'منتهي':ownerMoney(ownerDays(t))+' يوم')}<button class="btn btn-g" onclick="renderRenew(${i})">تجديد الاشتراك وتسجيل دفعة</button></div><div class="card"><h3>حساب الاشتراك</h3>${ownerKV('السعر المتفق عليه',t.monthly_price==null?'غير مسجل':ownerMoney(t.monthly_price)+' ج / شهر')}${ownerKV('آخر دفعة مسجلة',last?ownerMoney(last.amount)+' ج · '+fmtD(last.received_on):'مفيش دفعات مسجلة')}<button class="btn btn-o" onclick="ownerPrice(${i})">تعديل السعر المتفق عليه</button><button class="btn btn-g" onclick="ownerReceipt(${i})">تسجيل دفعة بدون تجديد</button><button class="btn btn-o" onclick="paymentShop='${t.id}';renderPayments()">عرض سجل الدفعات</button></div><div class="card"><h3>إدارة المحل</h3><p>تشغيل المحل وتجديد الاشتراك خطوتين مختلفتين.</p><button class="btn ${t.status==='active'?'btn-r':'btn-g'}" onclick="ownerStatusSheet(${i})">${t.status==='active'?'إيقاف المحل مؤقتًا':'تشغيل المحل'}</button></div><button class="btn btn-o" onclick="renderHome()">رجوع للمحلات</button>`);}
let ownerRenewIndex=0,ownerRenewMonths=1;
function renderRenew(i){ownerRenewIndex=i;ownerRenewMonths=1;const t=tenants[i];ownerShell('تجديد الاشتراك',`<div class="card"><h3>${esc(t.name)}</h3>${ownerKV('ينتهي حاليًا',t.sub_end?fmtD(t.sub_end):'مفتوح بدون نهاية')}<div class="field"><label class="lbl" for="owner-months">المدة المضافة</label><select id="owner-months" class="inp" onchange="ownerRenewMonths=+this.value;$('#owner-new-end').textContent=fmtD(ownerEnd(tenants[ownerRenewIndex],ownerRenewMonths));$('#owner-amount').value=tenants[ownerRenewIndex].monthly_price==null?'':(tenants[ownerRenewIndex].monthly_price*ownerRenewMonths)"><option value="1">شهر</option><option value="3">٣ شهور</option><option value="6">٦ شهور</option><option value="12">سنة</option></select></div><div class="trow"><span class="k">بعد التجديد ينتهي</span><b id="owner-new-end">${fmtD(ownerEnd(t,1))}</b></div><p>من نهاية الاشتراك الساري، أو من النهارده لو منتهي.</p>${t.sub_end?'':`<label class="owner-check"><input type="checkbox" id="owner-finite"> أوافق على تحويل الاشتراك المفتوح لاشتراك بتاريخ نهاية</label>`}<p>لو المحل موقوف يدويًا، التجديد مش هيشغّله تلقائيًا.</p></div><h3>تسجيل دفعة مستلمة</h3><p>تسجيل مبلغ استلمته بالفعل، مش تحصيل فلوس من صاحب المحل.</p>${ownerField('المبلغ المستلم بالجنيه','owner-amount',t.monthly_price??'','number')}<div class="field"><label class="lbl" for="owner-method">طريقة الاستلام</label><select id="owner-method" class="inp">${Object.entries(ownerMethods).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>${ownerField('تاريخ الاستلام','owner-date',ownerToday(),'date')}${ownerField('رقم المرجع (اختياري)','owner-reference')}${ownerField('ملاحظة (اختياري)','owner-note')}<button class="btn btn-g" onclick="ownerRenew(true)">مراجعة التجديد والدفعة</button><button class="btn btn-o" onclick="ownerRenew(false)">تجديد بدون دفعة مستلمة</button><button class="btn btn-o" onclick="renderDetail(${i})">رجوع</button>`);}
function ownerRenew(paid){const t=tenants[ownerRenewIndex],a=Number($('#owner-amount').value),d=$('#owner-date').value;if(!t.sub_end&&!$('#owner-finite').checked){toast('أكد تحويل الاشتراك المفتوح الأول');return;}if(paid&&(!$('#owner-amount').value||!Number.isFinite(a)||a<=0||Math.abs(Math.round(a*100)-a*100)>0.00001||!d||d>ownerToday())){toast('راجع المبلغ وتاريخ الاستلام');return;}const p={id:ownerId(),tenantId:t.id,action:'renew',expectedEnd:t.sub_end,months:ownerRenewMonths,expectedNewEnd:ownerEnd(t,ownerRenewMonths),startFinite:!t.sub_end,noPayment:!paid};if(paid)Object.assign(p,{amount:a,receivedOn:d,method:$('#owner-method').value,reference:$('#owner-reference').value.trim(),note:$('#owner-note').value.trim()});ownerReview(p,'تأكيد التجديد',`${ownerKV('المحل',t.name)}${ownerKV('نهاية الاشتراك الجديدة',fmtD(ownerEnd(t,ownerRenewMonths)))}${ownerKV('دفعة مستلمة',paid?ownerMoney(a)+' ج':'بدون دفعة')}<p>الحفظ مرة واحدة للتجديد والدفعة مع بعض. الإيقاف اليدوي لا يتغير.</p>`);}
function ownerStatusSheet(i){const t=tenants[i],stop=t.status==='active';if(!stop&&t.sub_end&&t.sub_end<ownerToday()){toast('جدّد الاشتراك المنتهي الأول');return;}$('#sheet').innerHTML=`<h3>${stop?'إيقاف':'تشغيل'} ${esc(t.name)}؟</h3><div class="card">${ownerKV('الاشتراك',t.sub_end?fmtD(t.sub_end):'مفتوح')}<p>البيانات محفوظة. ${stop?'الإيقاف يمنع الدخول والمزامنة والمتجر عند الاتصال. الأجهزة المفصولة ممكن تفضل تعرض النسخة المحلية لحد ما تتصل.':'التشغيل لا يغيّر تاريخ نهاية الاشتراك.'}</p>${ownerField('السبب (للسجل فقط)','owner-reason')}<button class="btn ${stop?'btn-r':'btn-g'}" onclick="ownerStatusConfirm(${i})">تأكيد ${stop?'الإيقاف':'التشغيل'}</button><button class="btn btn-o" onclick="closeSheet()">رجوع بدون تغيير</button></div>`;$('#ov').classList.remove('hidden');}
function ownerStatusConfirm(i){const t=tenants[i],reason=$('#owner-reason').value.trim();if(!reason){toast('اكتب السبب');return;}ownerReview({id:ownerId(),tenantId:t.id,action:'status',status:t.status==='active'?'suspended':'active',expectedStatus:t.status,reason},'مراجعة حالة المحل',ownerKV('المحل',t.name)+ownerKV('الحالة الجديدة',t.status==='active'?'موقوف':'شغّال')+ownerKV('السبب',reason));}
function ownerReview(p,title,body){if(ownerPending?.sent&&ownerPending.id!==p.id){toast('أكد الطلب السابق الأول');return;}ownerPending=p;$('#sheet').innerHTML=`<h3>${esc(title)}</h3><div class="card">${body}<div id="owner-action-error" class="note"></div><button class="btn btn-p" id="owner-submit" onclick="ownerSubmit()">تأكيد الحفظ</button><button class="btn btn-o" id="owner-cancel" onclick="ownerCancel()">إلغاء</button></div>`;$('#ov').classList.remove('hidden');}
function ownerCancel(){if(ownerBusy||ownerPending?.sent){toast('نتيجة العملية لسه مش مؤكدة. أعد المحاولة بنفس الطلب.');return;}ownerPending=null;localStorage.removeItem(ownerPendingKey());closeSheet();}
async function ownerSubmit(){if(ownerBusy||!ownerPending)return;if(!navigator.onLine){$('#owner-action-error').textContent='مفيش اتصال. العملية مش محفوظة. اتصل وأعد نفس الطلب.';return;}ownerBusy=true;$('#owner-submit').disabled=true;$('#owner-cancel').disabled=true;try{ownerPending.sent=true;localStorage.setItem(ownerPendingKey(),JSON.stringify(ownerPending));const p={...ownerPending};delete p.sent;await rpc(p.action==='add'?'admin_attach_shop':'admin_subscription_action',{p});ownerPending=null;localStorage.removeItem(ownerPendingKey());$('#ov').classList.add('hidden');toast('اتحفظت ✓');ownerBusy=false;await loadAll();}catch(e){if(e.definitive){ownerPending=null;localStorage.removeItem(ownerPendingKey());$('#owner-action-error').textContent='لم يتم الحفظ: '+String(e)+'. اقفل الرسالة وحدّث البيانات قبل طلب جديد.';$('#owner-cancel').disabled=false;$('#owner-cancel').textContent='إغلاق';return;}$('#owner-action-error').textContent='تعذر تأكيد النتيجة: '+String(e)+'. أعد نفس الطلب، مش هيتكرر الحفظ.';$('#owner-submit').disabled=false;}finally{ownerBusy=false;}}
function renderPayments(){if(!paymentMonth)paymentMonth=ownerToday().slice(0,7);const corrected=new Set(ownerData.entries.filter(e=>e.kind==='correction').map(e=>e.original_id)),list=ownerData.entries.filter(e=>e.kind==='payment'&&(!paymentShop||e.tenant_id===paymentShop)&&(!paymentMonth||e.received_on.startsWith(paymentMonth))),sum=list.filter(e=>!corrected.has(e.id)).reduce((n,e)=>n+Number(e.amount),0);ownerShell('دفعات الاشتراكات',`<div class="row2"><input class="inp" type="month" aria-label="شهر الدفعات" value="${esc(paymentMonth)}" onchange="paymentMonth=this.value;renderPayments()"><select class="inp" aria-label="فلتر المحل" onchange="paymentShop=this.value;renderPayments()"><option value="">كل المحلات</option>${tenants.map(t=>`<option value="${t.id}" ${t.id===paymentShop?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="card"><div class="k">المسجل كمستلم في الشهر، بعد التصحيحات</div><div class="owner-money">${ownerMoney(sum)} <small>جنيه</small></div><p>${ownerMoney(list.filter(e=>!corrected.has(e.id)).length)} دفعات</p></div>${list.map(e=>{const t=tenants.find(t=>t.id===e.tenant_id),c=ownerData.entries.find(c=>c.original_id===e.id);return `<div class="card"><div class="owner-row"><h3>${esc(t?.name||'محل')}</h3><b style="color:var(--green)">${ownerMoney(e.amount)} ج</b></div><p>${fmtD(e.received_on)} · ${ownerMethods[e.method]||esc(e.method)}</p>${ownerKV('رقم التسجيل',e.id.slice(0,8))}${e.reference?ownerKV('المرجع',e.reference):''}${e.note?`<p>${esc(e.note)}</p>`:''}${ownerKV('مسجل بواسطة','مالك المنصة')}${c?`<div class="owner-alert">مُلغاة بتصحيح، الأصل محفوظ<br>السبب: ${esc(c.note)}<br>التصحيح ما غيّرش مدة الاشتراك</div>`:`<button class="btn btn-o" onclick="ownerCorrection('${e.id}')">تصحيح دفعة مسجلة بالخطأ</button>`}</div>`;}).join('')||'<div class="note">مفيش دفعات في الفترة دي</div>'}<p>التصحيح يحتفظ بالأصل والسبب. مدة الاشتراك لا تتغير تلقائيًا.</p>`,'payments');}
function ownerCorrection(id){const e=ownerData.entries.find(e=>e.id===id);$('#sheet').innerHTML=`<h3>تصحيح دفعة مسجلة بالخطأ</h3><p>الدفعة الأصلية ${ownerMoney(e.amount)} ج هتفضل في السجل، وهتُستبعد من الإجمالي. مدة الاشتراك مش هتتغير. لو المبلغ الصحيح مختلف، سجّل الدفعة الصحيحة منفصلة.</p>${ownerField('سبب التصحيح','owner-correction')}<button class="btn btn-r" onclick="ownerCorrectionConfirm('${id}')">مراجعة التصحيح</button><button class="btn btn-o" onclick="closeSheet()">إلغاء</button>`;$('#ov').classList.remove('hidden');}
function ownerCorrectionConfirm(id){const e=ownerData.entries.find(e=>e.id===id),reason=$('#owner-correction').value.trim();if(!reason){toast('اكتب سبب التصحيح');return;}ownerReview({id:ownerId(),action:'correct',tenantId:e.tenant_id,originalId:id,reason},'تأكيد تصحيح الدفعة',ownerKV('المبلغ المستبعد',ownerMoney(e.amount)+' ج')+ownerKV('السبب',reason));}
function ownerPrice(i){const t=tenants[i];$('#sheet').innerHTML=`<h3>السعر المتفق عليه، ${esc(t.name)}</h3>${ownerField('بالجنيه لكل شهر','owner-price',t.monthly_price??'','number')}<p>تسجيل الاتفاق فقط. مش هيغيّر دفعات سابقة ولا هيحصّل أي مبلغ.</p><button class="btn btn-p" onclick="ownerPriceConfirm(${i})">مراجعة</button>`;$('#ov').classList.remove('hidden');}

function ownerReceiptConfirm(i){const a=Number($('#owner-amount').value),d=$('#owner-date').value;if(!Number.isFinite(a)||a<=0||!d||d>ownerToday()){toast('راجع المبلغ والتاريخ');return;}ownerReview({id:ownerId(),tenantId:tenants[i].id,action:'receipt',amount:a,receivedOn:d,method:$('#owner-method').value,reference:$('#owner-reference').value.trim(),note:$('#owner-note').value.trim()},'تأكيد دفعة بدون تجديد',ownerKV('المبلغ',ownerMoney(a)+' ج')+'<p>مدة الاشتراك لا تتغير</p>');}

function ownerAddReview(){const name=$('#ad-name').value.trim(),email=$('#ad-email').value.trim().toLowerCase(),price=Number($('#ad-price').value);if(!name||!email.includes('@')||$('#ad-price').value===''||!Number.isFinite(price)||price<0){toast('راجع الاسم والإيميل والسعر');return;}const p={id:ownerId(),action:'add',name,email,owner:$('#ad-owner').value.trim(),phone:$('#ad-phone').value.trim(),shopType:$('#ad-type').value,months:Number($('#ad-months').value),expectedDate:ownerToday(),price};ownerReview(p,'تأكيد إضافة محل لحساب موجود',ownerKV('المحل',name)+ownerKV('الإيميل',email)+ownerKV('النوع',p.shopType==='mobile'?'موبايلات':'محل عام')+ownerKV('مدة الاشتراك',ownerMoney(p.months)+' شهر')+ownerKV('نهاية الاشتراك',fmtD(ownerDateAdd(ownerToday(),p.months)))+ownerKV('السعر الشهري',ownerMoney(price)+' ج')+'<p>حساب مستقل وبيانات فاضية. مفيش دفعة أو رسالة تلقائية.</p>');}
