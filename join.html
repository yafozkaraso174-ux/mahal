<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>محلّي، تفعيل المحل</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e9eef8;font:14px Cairo,sans-serif}header{padding:25px 20px;background:linear-gradient(120deg,#7653bd,#3d267d);border-radius:0 0 26px 26px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 12px}main{max-width:480px;margin:auto;padding:20px 16px}.card{border:1px solid #2a3c57;background:#18263b;padding:20px;border-radius:20px}p{color:#acbbd0;line-height:1.9}label{display:block;color:#acbbd0;font-size:12px;font-weight:700;margin-top:15px}input,button{width:100%;min-height:48px;font:700 14px Cairo;border-radius:12px;margin-top:8px}input{border:1px solid #2a3c57;background:#101b2c;color:#e9eef8;padding:12px;min-width:0}button{border:0;background:#12a17c;color:white;padding:12px;cursor:pointer}.out{background:#101b2c;border:1px solid #344764}.note{font-size:12px;padding:12px;background:#101b2c;border-radius:12px;color:#a9b8cd;line-height:1.9;margin-top:14px}.err{color:#ff9a91}button:disabled{opacity:.55}.ltr{direction:ltr;text-align:left}.kv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}.kv span{color:#a9b8cd}.kv b{overflow-wrap:anywhere}</style></head><body><header><small>محلّي</small><h1>فعّل محلك</h1></header><main id="root"><p>بيتحقق من الدعوة…</p></main><script>
const SUPA={url:'https://ofqhrpkgxxbdrhuujgxt.supabase.co',anon:'sb_publishable_CH8nhDJQlV-5xsKYoCZRVg_mUoLsTQw'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let inviteToken=location.hash.slice(1),invite=null,accessToken='',loginMode=false,busy=false;
const clean=/^[a-f0-9]{64}$/.test(inviteToken);history.replaceState(null,'',location.pathname); // bearer token is not sent in referrers or left in URL history.
async function request(path,body,auth=false){const r=await fetch(SUPA.url+path,{method:'POST',headers:{apikey:SUPA.anon,Authorization:'Bearer '+(auth?accessToken:SUPA.anon),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.message||j.msg||j.error_description||'تعذر إتمام الطلب');return j;}
function invalid(){inviteToken='';$('#root').innerHTML='<div class="card"><h2>الرابط غير متاح</h2><p>ممكن يكون انتهى أو اتلغى أو اتستخدم. لو فعّلت حسابك قبل كده، افتح التطبيق وسجّل دخول. غير كده اطلب رابط جديد من مالك المنصة.</p><button class="out" onclick="location.href=\'index.html\'">فتح التطبيق</button></div>';}
function form(){if(!invite)return;$('#root').innerHTML=`<div class="card"><h2>${esc(invite.name)}</h2><div class="kv"><span>الإيميل المدعو</span><b dir="ltr">${esc(invite.email)}</b></div><div class="kv"><span>الاشتراك بعد التفعيل</span><b>${invite.months} شهر</b></div><p>${loginMode?'سجّل دخول بحسابك بنفس الإيميل لقبول الدعوة.':'صاحب الحساب يختار الباسورد بنفسه. مش بيظهر في لوحة مالك المنصة ولا في رسالة.'}</p><label for="password">${loginMode?'الباسورد':'اختار باسورد، ١٢ حرف على الأقل'}</label><input id="password" type="password" autocomplete="${loginMode?'current-password':'new-password'}" minlength="12">${loginMode?'':'<label for="confirm">تأكيد الباسورد</label><input id="confirm" type="password" autocomplete="new-password">'}<div class="note">الحساب مرتبط بالمحل والإيميل المحددين. مدة الاشتراك تبدأ عند نجاح التفعيل. ${loginMode?'':'لو مطلوب تأكيد الإيميل، هتوصلك رسالة تأكيد من خدمة تسجيل الحساب بطلبك ده.'}</div><div class="note err" id="error" role="status"></div><button id="submit" onclick="submitJoin()">${loginMode?'تسجيل الدخول وقبول الدعوة':'إنشاء حسابي وتفعيل المحل'}</button><button class="out" onclick="loginMode=!loginMode;form()">${loginMode?'إنشاء حساب جديد بنفس الإيميل':'عندي حساب بنفس الإيميل، تسجيل دخول'}</button></div>`;}
async function submitJoin(){if(busy)return;if(accessToken){busy=true;try{await accept();}catch(e){$('#error').textContent='تعذر تأكيد التفعيل. اضغط تاني بنفس الطلب: '+String(e.message||e);}finally{busy=false;}return;}const pass=$('#password').value;if(!pass||(!loginMode&&(pass.length<12||pass!==$('#confirm').value))){$('#error').textContent='راجع الباسورد وتأكيده، ١٢ حرف على الأقل للحساب الجديد.';return;}busy=true;$('#submit').disabled=true;try{const j=await request(loginMode?'/auth/v1/token?grant_type=password':'/auth/v1/signup',{email:invite.email,password:pass});$('#password').value='';if($('#confirm'))$('#confirm').value='';accessToken=j.access_token||j.session?.access_token||'';if(!accessToken){loginMode=true;form();$('#error').textContent='راجع بريدك لتأكيد الإيميل. بعد التأكيد، افتح نفس رابط الدعوة وسجّل دخول بنفس الإيميل. لو كان الحساب موجود بالفعل، سجّل دخول.';return;}await accept();}catch(e){$('#error').textContent=String(e.message||e);}finally{busy=false;if($('#submit'))$('#submit').disabled=false;}}
async function accept(){await request('/rest/v1/rpc/accept_shop_invite',{p_token:inviteToken},true);inviteToken='';accessToken='';$('#root').innerHTML='<div class="card"><h2>محلك اتفعّل بنجاح ✓</h2><p>حسابك اتربط بالمحل واشتراكك بدأ. سجّل دخولك في التطبيق بنفس الإيميل والباسورد اللي اخترته.</p><button onclick="location.href=\'index.html\'">فتح التطبيق</button></div>';}
(async()=>{if(!clean){invalid();return;}try{invite=await request('/rest/v1/rpc/shop_invite_info',{p_token:inviteToken});if(!invite?.valid){invalid();return;}form();}catch(e){$('#root').innerHTML='<div class="card"><h2>تعذر التحقق من الدعوة</h2><p>راجع اتصالك وافتح نفس الرابط تاني. مفيش حساب اتعمل أو دعوة اتقبلت.</p></div>';}})();
</script></body></html>
