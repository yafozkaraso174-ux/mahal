<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B3D">
<title>محلي — إدارة المحل</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F2ECDD;--card:#FFF;--line:#E4D8BE;--ink:#1B1812;--muted:#7A6F5C;
--green:#0B6B3D;--green2:#12A150;--green-soft:#D9EFE2;--amber:#E8960C;--amber-soft:#FCEED3;
--red:#D63B2F;--red-soft:#FBE3E0;--blue:#1D5BB5;--blue-soft:#E3EDFA;--deep:#0A3D27;
}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Noto Sans Arabic',system-ui,sans-serif;background:#D8CFBC;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:92px;box-shadow:0 0 40px rgba(0,0,0,.08)}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.appbar{padding:18px 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--green),var(--deep));color:#fff;border-radius:0 0 22px 22px;margin:0 0 4px}
.appbar .hello{font-size:13px;color:rgba(255,255,255,.8)}
.appbar .shop{font-size:19px;font-weight:900;margin-top:1px;color:#fff}
.appbar .back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:rgba(255,255,255,.85);padding:6px 0}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:none}
.content{padding:6px 16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-size:20px;font-weight:900;margin-top:4px}
.stat .val small{font-size:12px;font-weight:600;color:var(--muted)}
.stat .sub{font-size:10.5px;margin-top:3px;color:var(--muted)}
.stat.hero{background:linear-gradient(135deg,var(--green),var(--deep));border-color:var(--deep)}
.stat.hero .lbl,.stat.hero .sub{color:#CDE7DA}
.stat.hero .val{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec-title{font-size:14px;font-weight:800;margin:16px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.sec-title .more{font-size:12px;color:var(--green);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;text-align:center;display:block}
.act .ic{width:36px;height:36px;margin:0 auto 5px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.act .tx{font-size:11px;font-weight:800}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;width:100%;text-align:right}
button.row{cursor:pointer}
.row .ic{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.row .mid{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.row .end{text-align:left;flex-shrink:0}
.row .amt{font-size:14px;font-weight:800}
.row .amt small{font-size:10.5px;font-weight:600;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:3px}
.b-red{background:var(--red-soft);color:var(--red)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:#9A6A14}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.alert{background:var(--amber-soft);border:1px solid #F0D9AC;border-radius:14px;padding:10px 13px;display:flex;gap:10px;align-items:center;margin-top:10px}
.alert .tx{font-size:12px;font-weight:600;color:#7A5A15;line-height:1.6}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:74px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:9px;z-index:20}
.nav-it{text-align:center;width:58px;color:var(--muted)}
.nav-it .ic{display:flex;align-items:center;justify-content:center;height:24px}
.nav-it .tx{font-size:10px;font-weight:800;margin-top:2px}
.nav-it.on{color:var(--green)}
.fab{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;margin:-26px auto 0;box-shadow:0 6px 14px rgba(11,107,61,.4)}
.fab-wrap{text-align:center;width:58px}
.fab-wrap .tx{font-size:10px;font-weight:800;color:var(--green);margin-top:3px}
.field{margin-bottom:13px}
.field .lbl{font-size:12.5px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.seg{display:flex;flex-wrap:wrap;background:#EDE7DA;border-radius:12px;padding:3px}
.scan-frame{position:relative;border-radius:16px;overflow:hidden;background:#0A3D27}
.scan-frame video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.seg button{flex:1 1 auto;min-width:0;white-space:nowrap;text-align:center;padding:9px 8px;font-size:13px;font-weight:800;color:var(--muted);border-radius:9px}
.seg button.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.item-row .qty{display:flex;align-items:center;gap:9px;background:#F1ECE1;border-radius:10px;padding:5px 9px}
.item-row .qty .n{font-size:14px;font-weight:800;min-width:18px;text-align:center}
.item-row .qty button{font-size:16px;color:var(--green);font-weight:800;width:22px;height:22px}
.add-item{border:1.5px dashed #CFC5B0;border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:800;color:var(--green);width:100%;margin-bottom:8px}
.total-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0}
.trow .k{color:var(--muted);font-weight:600}
.trow.grand{border-top:1px dashed var(--line);margin-top:6px;padding-top:11px;font-size:16px;font-weight:800}
.trow .paid{color:var(--green);font-weight:800}
.trow .due{color:var(--red);font-weight:800}
.trow input{width:110px;background:#F7F3EA;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:800;text-align:left;outline:none}
.cost-in{width:74px;background:#F7F3EA;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:13px;font-weight:800;text-align:center;outline:none;color:var(--ink);font-family:inherit}
.cost-in:focus{border-color:var(--green)}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px;z-index:15}
.btn{flex:1;border-radius:16px;padding:14px 0;text-align:center;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;box-shadow:0 3px 10px rgba(11,107,61,.28)}
.btn-s{background:var(--card);border:1px solid var(--line);flex:0 0 140px}
.btn-danger{background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px;font-weight:800;width:100%;margin-top:8px}
.cust-head{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;text-align:center}
.cust-head .av{width:50px;height:50px;border-radius:18px;background:var(--blue-soft);color:var(--blue);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.cust-head .nm{font-size:16.5px;font-weight:800}
.cust-head .ph{font-size:12px;color:var(--muted);margin-top:3px;direction:ltr}
.bal{margin-top:11px;border-radius:14px;padding:10px;text-align:center}
.bal.owed{background:var(--red-soft);border:1px solid #EFC9C5}
.bal.owed .k{color:var(--red)}
.bal.owed .v{color:var(--red)}
.bal.clear{background:var(--green-soft);border:1px solid #C6E2D2}
.bal.clear .k{color:var(--green)}
.bal.clear .v{color:var(--green)}
.bal .k{font-size:12px;font-weight:700}
.bal .v{font-size:25px;font-weight:800;margin-top:1px}
.bal .v small{font-size:13px;font-weight:600}
.cbtns{display:flex;gap:8px;margin-top:11px}
.cbtn{flex:1;border-radius:12px;padding:11px 4px;text-align:center;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.overlay{position:fixed;inset:0;background:rgba(35,32,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet .st{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center}
.sheet .x{position:absolute;left:16px;top:14px;color:var(--muted)}
.sheet-wrap{position:relative}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;font-weight:600}
.empty .big{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.set-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;margin-bottom:8px;width:100%;text-align:right;font-size:13.5px;font-weight:800}
.set-row .s{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.store-link-card{display:grid;grid-template-columns:20px minmax(0,1fr)}
.store-link-card .store-link-info{min-width:0}
.store-link-card .store-link-url{display:block;direction:ltr;text-align:right;overflow-wrap:anywhere}
.store-link-card .store-link-actions{grid-column:1/-1;display:flex;gap:8px}
.store-link-card .store-link-actions .cbtn{min-width:0;background:var(--bg)}

.lockwrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px;width:100%;max-width:340px;text-align:center}
.lockcard .lk{width:56px;height:56px;border-radius:20px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.lockcard h2{font-size:18px;font-weight:800}
.lockcard p{font-size:12.5px;color:var(--muted);margin:5px 0 16px;font-weight:600}
.lockcard input{width:100%;background:#F7F3EA;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:20px;font-weight:800;text-align:center;letter-spacing:6px;outline:none;color:var(--ink)}
.lockcard input:focus{border-color:var(--green)}
.user-pick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#F7F3EA;font-weight:800;font-size:15px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-family:inherit}
.user-pick.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord .onm{font-size:14px;font-weight:800}
.ord .otm{font-size:11px;color:var(--muted);font-weight:600}
.ord .oitems{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-top:10px}
.ord .oitem{display:flex;align-items:baseline;gap:7px;font-size:12.5px;font-weight:600;padding:3.5px 0}
.ord .oitem+.oitem{border-top:1px dashed var(--line)}
.ord .oitem .q{color:var(--green);font-weight:800;flex-shrink:0}
.ord .oitem .nm{flex:1;min-width:0}
.ord .oitem .pr{color:var(--muted);font-weight:700;font-size:11.5px;flex-shrink:0}
.ord .ometa{margin:7px 0 1px}
.odelv{font-size:12px;color:var(--muted);font-weight:700;margin-top:7px}
.ochip{display:inline-block;background:var(--green-soft);color:var(--green);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:800;margin-inline-end:5px}
.oaddr{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--muted);font-weight:600;margin-top:9px;line-height:1.7}
.ord .oaddr .i{width:15px;height:15px;margin-top:2px}
.ord .ofoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ord .oamt{font-size:17px;font-weight:800}
.ord .oamt small{font-size:11px;color:var(--muted);font-weight:600}
.ord .oph{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--blue);text-decoration:none;direction:ltr}
.ord .obt{display:flex;gap:8px;margin-top:10px}
.ord .obt>*{flex:1;border-radius:10px;padding:9px 0;font-size:12px;font-weight:800}
.ord .ob-ed{background:var(--blue-soft);color:var(--blue)}
.ord .ob-del{flex:0 0 42px;background:var(--card);border:1px solid var(--line);color:var(--red);display:flex;align-items:center;justify-content:center}
.ord .ob-ok{background:var(--green);color:#fff}
.ord .ob-no{background:var(--red-soft);color:var(--red)}
.ord .ob-wa{background:var(--green-soft);color:var(--green);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:4px}
.ord.done{opacity:.6}
.pimg{width:38px;height:38px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--green-soft)}
.crop-frame{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:#17150F;touch-action:none;user-select:none}
.crop-frame img{position:absolute;max-width:none;pointer-events:none}
.photo-pick{width:100%;aspect-ratio:1;border-radius:16px;border:1.5px dashed #CFC5B0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;overflow:hidden;position:relative}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .ov{position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(35,32,26,.75);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px}
#print-area{display:none}
/* شاشات كبيرة (لابتوب/ديسكتوب): البرنامج يوسّع مع عرض الصفحة */
@media(min-width:768px){
#app{max-width:1000px;padding-bottom:110px}
.navbar{max-width:1000px}
.cta{max-width:1000px}
.sheet{max-width:620px}
.content{padding:6px 24px 0}
.grid2{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1300px){
#app{max-width:1200px}
.navbar{max-width:1200px}
.cta{max-width:1200px}
}

/* شبكة كروت الأصناف */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.pcard{position:relative;display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;transition:.15s;color:var(--ink)}
.pcard:active{transform:scale(.98)}
.pcard .art{height:112px;background:#eef2ee;display:grid;place-items:center;position:relative;overflow:hidden;color:#8a9a92}
.pcard .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pcard .art .ph{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(145deg,#eef2ee,#e1e8e3)}
.pcard .art .ph svg{width:44px;height:44px;opacity:.55}
.pcard .unit{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.92);color:#4b5b54;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700}
.pcard .stk{position:absolute;top:7px;left:7px;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:800;background:rgba(255,255,255,.92);color:#2b6b4d}
.pcard .stk.low{background:#fde3e1;color:#b3261e}
.pcard .stk.out{background:#b3261e;color:#fff}
.pcard .info{padding:10px 11px 11px}
.pcard .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ds{font-size:10.5px;color:var(--muted);margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pcard .pr b{color:var(--green);font-size:15px;font-weight:900}
.pcard .pr b small{font-size:10px;font-weight:700}
.pcard .plus{width:30px;height:30px;border-radius:9px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.pcard .plus svg{width:18px;height:18px}
.pcard.dis{opacity:.55}
html[data-theme=dark] .pcard .art{background:#e9eef0}
html[data-theme=dark] .pcard .art .ph{background:linear-gradient(145deg,#2a3c57,#1d2c44);color:#9fb0c6}
html[data-theme=dark] .pcard .art .ph svg{opacity:.7}
html[data-theme=dark] .pcard .plus{background:#123a35;color:#4fe0b5}
html[data-theme=dark] .pcard .unit,html[data-theme=dark] .pcard .stk{background:rgba(15,26,43,.88);color:#cfe0f4}
html[data-theme=dark] .pcard .stk.low{background:#4a1f1d;color:#ffb4ab}
html[data-theme=dark] .pcard .stk.out{background:#b3261e;color:#fff}
@media(min-width:520px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:768px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pcard .art{height:124px}}
@media(min-width:1300px){.pgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* وحدة الموبايلات */
.mbb{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;margin-top:2px}
.mb-g{background:var(--green-soft);color:var(--green)}.mb-a{background:var(--amber-soft);color:#9A6A14}.mb-r{background:var(--red-soft);color:var(--red)}.mb-b{background:var(--blue-soft);color:var(--blue)}.mb-m{background:var(--line);color:var(--muted)}
html[data-theme=dark] .mb-a{color:#e8b64a}

async function applyOp(op){
 if(op.type==='invoice'){const r=await rpc('save_invoice',{p:op.payload});
  if(r&&r.num){const inv=DB.invoices.find(i=>i.id===op.payload.id);if(inv&&inv.num!==r.num){inv.num=r.num;save();}}
  return;}
 if(op.type==='purchase'){await rpc('save_purchase',{p:op.payload});return;}
 if(op.type==='payment'){await rpc('record_payment',{p:op.payload});return;}
 if(op.type==='return'){const r=await rpc('save_return',{p:op.payload});
  if(r&&r.num){const rt=DB.returns.find(x=>x.id===op.payload.id);if(rt&&rt.num!==r.num){rt.num=r.num;save();}}
  return;}
 if(op.type==='expense'){await rpc('save_expense',{p:op.payload});return;}
 if(op.type==='drawer'){await rpc('save_drawer_entry',{p:op.payload});return;}
 if(op.type==='closeDay'){await rpc('close_day',{p:op.payload});return;}
 if(op.type==='service'){await rpc('save_service_txn',{p:op.payload});return;}
 if(op.type==='upsert'){await SB.req(op.table,{method:'POST',headers:{'Content-Type':'application/json','Prefer':(op.prefer||'resolution=merge-duplicates')},body:JSON.stringify([op.row])});
  if(op.table==='products'){const lp=DB.products.find(x=>x.id===op.rowId);if(lp&&lp.photo&&lp.photoVer){const ups=JSON.parse(localStorage.getItem(tenantKey('mahal_photo_up'))||'{}');if(ups[lp.id]!==lp.photoVer){const blob=await PHOTOS.get(lp.id);if(blob){await SB.uploadPhoto(lp.id,blob);ups[lp.id]=lp.photoVer;localStorage.setItem(tenantKey('mahal_photo_up'),JSON.stringify(ups));}}}}
  return;}
 if(op.type==='softdel'){await SB.req(op.table+'?id=eq.'+encodeURIComponent(op.rowId),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({deleted:true})});return;}
 if(op.type==='harddel'){await SB.req(op.table+'?id=eq.'+encodeURIComponent(op.rowId),{method:'DELETE',headers:{'Prefer':'return=minimal'}});return;}
}
async function rpc(name,body){await SB.ensureSession();SB.load();
 const base=(SB.cfg.url||SB_DEF.url).replace(/\/$/,''),anon=SB.cfg.anon||SB_DEF.anon;
 const r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':anon,'Authorization':'Bearer '+(SB.token||anon),'Content-Type':'application/json','x-mahal-generation':String(curUser?.generation||1)},body:JSON.stringify(body)});
 if(!r.ok){let m='rpc-failed:'+r.status;try{const j=await r.json();if(j&&j.message)m=j.message;}catch(e){}
  throw new Error(m);}
 const t=await r.text();return t?JSON.parse(t):null;}
async function pullDelta(full){if(!SB.ready()||!authGet()||!curUser)return;
 await SB.ensureSession();const s2=sync2Get();let changed=false;
 const fresh=entOrder().every(k=>!s2[k]);
 if(fresh){entOrder().forEach(k=>{DB[k]=[];});full=true;changed=true;}
 for(const key of entOrder()){const e=ENT[key];
  if(e.perms&&!curUser.owner&&!e.perms.some(p=>can(p)))continue;
  let since=full?'1970-01-01T00:00:00Z':(s2[key]||'1970-01-01T00:00:00Z');let maxTs=since;
  for(let page=0;page<20;page++){
   const rows=await SB.req(e.table+'?'+e.ts+'=gt.'+encodeURIComponent(since)+'&order='+e.ts+'.asc&limit=1000');
   if(!rows||!rows.length)break;
   for(const r of rows){if(outboxHas(e.table,r.id))continue;
    const arr=DB[key];const ix=arr.findIndex(x=>x.id===r.id);
    if(r.deleted){if(ix>=0){arr.splice(ix,1);changed=true;}}
    else{const loc=e.unmap(r,ix>=0?arr[ix]:null);if(ix>=0)arr[ix]=loc;else arr.push(loc);changed=true;}
    const t=r[e.ts];if(t&&t>maxTs)maxTs=t;}
   if(rows.length<1000)break;since=maxTs;}
  s2[key]=maxTs;}
 if(fresh){try{const n=await rpc('next_invoice_num',{});if(n&&n>DB.nextNum){DB.nextNum=n;changed=true;}}catch(e){}}
 sync2Set(s2);if(changed){applyingRemote=true;localStorage.setItem(KEY,JSON.stringify(DB));applyingRemote=false;}
 return changed;}

async function migrateToTables(){if(!curUser||!curUser.owner||DB.settings.migratedV2||!navigator.onLine||!SB.ready())return;
 try{await SB.ensureSession();
  const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};
  const up=async(table,rows,prefer)=>{for(const c of chunk(rows,200)){if(c.length)await SB.req(table,{method:'POST',headers:{'Content-Type':'application/json','Prefer':prefer},body:JSON.stringify(c)});}};
  await up('products',DB.products.map(ENT.products.map),'resolution=merge-duplicates');

  await up('movements',DB.movements.map(ENT.movements.map),'resolution=ignore-duplicates');
  const maxNum=DB.invoices.reduce((m,i)=>Math.max(m,i.num||0),1000);

  DB.settings.migratedV2=true;save();await pushCloudBackup(true);
  const s2=sync2Get();const now=new Date().toISOString();entOrder().forEach(k=>{if(!s2[k])s2[k]=now;});sync2Set(s2);

 }catch(e){const s=syncGet();s.lastErr='ترحيل فشل: '+((e&&e.message)||e);syncSet(s);}}

 const s=syncGet();s.lastPush=now;if(!s.decided)s.decided=true;delete s.lastErr;syncSet(s);
 if(changedAt&&localStorage.getItem(DIRTY_KEY)===changedAt)localStorage.removeItem(DIRTY_KEY);
 localStorage.setItem(tenantKey('mahal_last_backup'),now);

const prod=id=>DB.products.find(p=>p.id===id);
const prodByBarcode=code=>{const c=String(code||'').trim();return c?DB.products.find(p=>!p.deleted&&p.barcode&&p.barcode===c):undefined;};
const cust=id=>DB.customers.find(c=>c.id===id);
const supp=id=>DB.suppliers.find(s=>s.id===id);
function custBalance(cid){let b=0;DB.invoices.filter(i=>i.customerId===cid).forEach(i=>b+=i.total-i.paid);DB.payments.filter(p=>p.partyType==='c'&&p.partyId===cid&&p.kind==='in').forEach(p=>b-=p.amount);return Math.round(b*100)/100;}
function suppBalance(sid){let b=0;DB.purchases.filter(i=>i.supplierId===sid).forEach(i=>b+=i.total-i.paid);DB.payments.filter(p=>p.partyType==='s'&&p.partyId===sid&&p.kind==='out').forEach(p=>b-=p.amount);return Math.round(b*100)/100;}
function totals(){let salesToday=0,profitMonth=0,receivables=0,payables=0,expMonth=0,feeMonth=0;
DB.invoices.forEach(inv=>{if(isToday(inv.date))salesToday+=inv.total;
 if(sameMonth(inv.date))inv.items.forEach(it=>profitMonth+=(it.price-it.cost)*it.qty);});
DB.expenses.forEach(x=>{if(sameMonth(x.date))expMonth+=x.amount;});
DB.serviceTxns.forEach(x=>{if(sameMonth(x.date))feeMonth+=x.fee||0;});
DB.returns.forEach(r=>{if(sameMonth(r.date))r.items.forEach(it=>profitMonth-=(it.price-(it.cost||0))*it.qty);});
DB.customers.forEach(c=>{const b=custBalance(c.id);if(b>0)receivables+=b;});
DB.suppliers.forEach(s=>{const b=suppBalance(s.id);if(b>0)payables+=b;});
return{salesToday,profitMonth,receivables,payables,expMonth,feeMonth,netMonth:Math.round((profitMonth+feeMonth-expMonth)*100)/100};}
function activity(){const a=[];
DB.invoices.forEach(i=>a.push({createdActorName:i.createdActorName,date:i.date,kind:'inv',text:'فاتورة لـ'+(cust(i.customerId)?.name||'زبون محذوف'),amt:i.total,left:i.total-i.paid,ref:i.id}));
DB.payments.filter(p=>p.kind==='in').forEach(p=>a.push({createdActorName:p.createdActorName,date:p.date,kind:'pay',text:(p.amount<0?'خصم من رصيد ':'دفعة من ')+(cust(p.partyId)?.name||'زبون محذوف'),amt:p.amount,ref:p.id}));
DB.payments.filter(p=>p.kind==='out').forEach(p=>a.push({createdActorName:p.createdActorName,date:p.date,kind:'payout',text:'دفعة لـ'+(supp(p.partyId)?.name||'مورد محذوف'),amt:p.amount,ref:p.id}));
DB.purchases.forEach(pu=>a.push({date:pu.date,kind:'pur',text:'توريد من '+(supp(pu.supplierId)?.name||'مورد محذوف'),amt:pu.total,left:pu.total-pu.paid,ref:pu.id}));
return a.sort((x,y)=>new Date(y.date)-new Date(x.date));}

/* ============ day close report (كشف اليوم) ============ */
function dayCloseCalc(day){const ref=day?new Date(day):new Date();const isD=iso=>new Date(iso).toDateString()===ref.toDateString();
let sales=0,count=0,cash=0,invCash=0,payCash=0,transfer=0,debt=0,exp=0,expCash=0,profit=0,fees=0;const byProd={};
DB.invoices.forEach(i=>{if(!isD(i.date))return;count++;sales+=i.total;
 const paidNow=Math.max((i.paid||0)-(i.creditUsed||0),0);
 if(i.payMethod==='تحويل')transfer+=paidNow;else{cash+=paidNow;invCash+=paidNow;}
 debt+=Math.max(i.total-i.paid,0);
 i.items.forEach(it=>{profit+=(it.price-(it.cost||0))*it.qty;const k=it.name;if(!byProd[k])byProd[k]={qty:0,unit:it.unit||''};byProd[k].qty+=it.qty;});});
DB.payments.forEach(p=>{if(!isD(p.date)||p.kind!=='in'||(p.amount<=0&&!p.correctionOf))return;
 if(p.method==='تحويل')transfer+=p.amount;else if(p.method!=='رصيد'){cash+=p.amount;payCash+=p.amount;}});
DB.expenses.forEach(x=>{if(!isD(x.date))return;exp+=x.amount;if(x.method!=='تحويل')expCash+=x.amount;});
DB.serviceTxns.forEach(x=>{if(!isD(x.date))return;fees+=x.fee||0;});
let ret=0;
DB.returns.forEach(r=>{if(!isD(r.date))return;ret+=r.total;
 if(r.refundMethod==='كاش')cash-=r.total;else if(r.refundMethod==='تحويل')transfer-=r.total;
 (r.items||[]).forEach(it=>{profit-=(it.price-(it.cost||0))*it.qty;});});
let top=null;Object.keys(byProd).forEach(k=>{if(!top||byProd[k].qty>top.qty)top={name:k,qty:byProd[k].qty,unit:byProd[k].unit};});
return{day:ref.toDateString(),sales,count,cash,invCash,payCash,transfer,debt,exp,expCash,profit,fees,ret,net:Math.round((profit+fees-exp)*100)/100,top};}

lines.push('صافي ربح تقريبي: '+fmt(dc.net)+' ج');

return lines.join('\n');}

const STATS_PERIODS=[['today','النهارده'],['week','الأسبوع ده'],['month','الشهر ده'],['lastmonth','الشهر اللي فات'],['custom','من - إلى']];
function statsRange(kind,from,to){const now=new Date();
 const d0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
 const d1=d=>{const x=new Date(d);x.setHours(23,59,59,999);return x;};
 if(kind==='week'){const f=d0(now);f.setDate(f.getDate()-((f.getDay()+1)%7));return{f,t:d1(now)};}
 if(kind==='month'){const f=d0(now);f.setDate(1);return{f,t:d1(now)};}
 if(kind==='lastmonth'){const f=d0(now);f.setDate(1);f.setMonth(f.getMonth()-1);const t=new Date(f);t.setMonth(t.getMonth()+1);t.setDate(0);return{f,t:d1(t)};}
 if(kind==='custom'){return{f:from?d0(from+'T00:00:00'):d0(now),t:to?d1(to+'T00:00:00'):d1(now)};}
 return{f:d0(now),t:d1(now)};}
function statsCalc(kind,from,to){const {f,t}=statsRange(kind,from,to);
 const inR=iso=>{const d=new Date(iso);return d>=f&&d<=t;};
 const invs=DB.invoices.filter(i=>inR(i.date));
 const sales=Math.round(invs.reduce((s,i)=>s+i.total,0)*100)/100;
 const count=invs.length;const avg=count?Math.round(sales/count*100)/100:0;
 let profit=0;const qtyBy={},revBy={},nameBy={},unitBy={};
 invs.forEach(i=>i.items.forEach(it=>{profit+=(it.price-(it.cost||0))*it.qty;const k=it.productId||it.name;
  qtyBy[k]=(qtyBy[k]||0)+it.qty;revBy[k]=(revBy[k]||0)+it.qty*it.price;nameBy[k]=it.name;unitBy[k]=it.unit;}));
 DB.returns.forEach(r=>{if(inR(r.date))r.items.forEach(it=>{profit-=(it.price-(it.cost||0))*it.qty;const k=it.productId||it.name;
  qtyBy[k]=(qtyBy[k]||0)-it.qty;revBy[k]=(revBy[k]||0)-it.qty*it.price;});});
 profit=Math.round(profit*100)/100;
 const fees=Math.round(DB.serviceTxns.filter(x=>inR(x.date)).reduce((s,x)=>s+(x.fee||0),0)*100)/100;
 const exps=Math.round(DB.expenses.filter(x=>inR(x.date)).reduce((s,x)=>s+(x.amount||0),0)*100)/100;
 const net=Math.round((profit+fees-exps)*100)/100;
 const byC={};invs.forEach(i=>{if(!i.customerId)return;const c=byC[i.customerId]||(byC[i.customerId]={count:0,total:0});c.count++;c.total+=i.total;});
 let topCust=null;Object.keys(byC).forEach(id=>{const v=byC[id];if(!topCust||v.total>topCust.total)topCust={id,count:v.count,total:Math.round(v.total*100)/100};});
 if(topCust){const c=cust(topCust.id);topCust.name=c?c.name:'زبون محذوف';}
 const purs=DB.purchases.filter(p=>inR(p.date));
 const byS={};purs.forEach(p=>{if(!p.supplierId)return;const s=byS[p.supplierId]||(byS[p.supplierId]={count:0,total:0});s.count++;s.total+=p.total;});
 let topSupp=null;Object.keys(byS).forEach(id=>{const v=byS[id];if(!topSupp||v.total>topSupp.total)topSupp={id,count:v.count,total:Math.round(v.total*100)/100};});
 if(topSupp){const s=supp(topSupp.id);topSupp.name=s?s.name:'مورد محذوف';}
 const sellers=Object.keys(qtyBy).filter(k=>qtyBy[k]>0).map(k=>({name:nameBy[k],unit:unitBy[k]||'',qty:Math.round(qtyBy[k]*100)/100,rev:Math.round(revBy[k]*100)/100})).sort((a,b)=>b.qty-a.qty||b.rev-a.rev).slice(0,3);
 const slow=DB.products.filter(p=>!p.deleted).map(p=>({name:p.name,unit:p.unit,sold:Math.round((qtyBy[p.id]||0)*100)/100})).sort((a,b)=>a.sold-b.sold).slice(0,3).map(x=>({...x,badge:x.sold<=0?'راكد':'بطيء'}));
 return{f,t,sales,count,avg,profit,fees,expenses:exps,net,topCust,topSupp,sellers,slow};}

function drawerDayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function drawerCalc(day){const ref=day?new Date(day):new Date();const isD=iso=>new Date(iso).toDateString()===ref.toDateString();
const todayKey=drawerDayKey(ref);
const closes=[...DB.dayCloses].sort((a,b)=>(a.day<b.day?1:-1)||(new Date(b.closedAt||0)-new Date(a.closedAt||0)));
const prior=closes.find(c=>c.day<todayKey);
const opening=prior?prior.actual:0;
const dc=dayCloseCalc(day);
let svcIn=0,svcOut=0;
DB.serviceTxns.forEach(x=>{if(!isD(x.date)||x.kind==='تسوية')return;
 if(x.kind==='استقبال')svcOut+=Math.max((x.amount||0)-(x.fee||0),0);else svcIn+=(x.amount||0)+(x.fee||0);});
let manIn=0,manOut=0;
DB.drawer.forEach(e=>{if(!isD(e.date))return;if(e.kind==='out')manOut+=e.amount;else manIn+=e.amount;});
const expected=Math.round((opening+dc.cash-dc.expCash+svcIn-svcOut+manIn-manOut)*100)/100;
return{day:todayKey,opening,dc,svcIn,svcOut,manIn,manOut,expected,closedToday:closes.find(c=>c.day===todayKey)||null};}

function svcServiceUI(){const s=$('#sv-service button.on')?.dataset.v||'';

const prov=SVC_NET_PROVIDERS[s];
if(nw){nw.style.display=prov?'block':'none';

function svcHint(){const k=$('#sv-kind button.on')?.dataset.v||'إرسال';const a=num($('#sv-amt')?.value),f=num($('#sv-fee')?.value);const el=$('#sv-hint');if(!el)return;
if(a<=0){el.textContent='';return;}
el.textContent=k==='استقبال'?('العميل بيبعت '+fmt(a)+' ج على الشبكة — هتديله كاش '+fmt(Math.max(a-f,0))+' ج من الدرج، والفلوت بيزيد '+fmt(a)+' ج'):('العميل بيدفع '+fmt(a+f)+' ج كاش بيدخلوا الدرج — والفلوت بينقص '+fmt(a)+' ج');}
function saveService(){const kind=$('#sv-kind button.on')?.dataset.v||'إرسال';const service=$('#sv-service button.on')?.dataset.v||'أخرى';
const amount=num($('#sv-amt')?.value),fee=num($('#sv-fee')?.value);
if(amount<=0){toast('اكتب المبلغ');return;}
if(fee<0){toast('العمولة مش ممكن تكون بالسالب');return;}
const network=SVC_NET_PROVIDERS[service]?($('#sv-net button.on')?.dataset.v||SVC_NET_PROVIDERS[service][0]):(service==='كارت كهرباء'?($('#sv-util button.on')?.dataset.v||'كهرباء'):'');
const x={id:uid(),date:new Date().toISOString(),kind,service,network,amount,fee,customerName:($('#sv-cust')?.value||'').trim(),customerPhone:($('#sv-phone')?.value||'').trim(),note:($('#sv-note')?.value||'').trim()};
DB.serviceTxns.push(x);save();enqueue({type:'service',table:'service_txns',rowId:x.id,payload:x});
closeSheet();render();toast('العملية اتسجلت ✓');}

async function saveProduct(pid,fromPur){const name=$('#fp-name').value.trim();if(!name){toast('اكتب اسم الصنف');return;}
presetBarcode=null;
const st=$('#fp-stock');
const data={name,cat:$('#fp-cat').value,unit:$('#fp-unit').value.trim()||'قطعة',wPrice:num($('#fp-w').value),rPrice:num($('#fp-r').value),cost:num($('#fp-cost').value),stock:st?num(st.value):0,lowAt:num($('#fp-low').value),barcode:($('#fp-barcode')?.value||'').trim()};
const ph=pendingPhoto;pendingPhoto=null;
try{
if(pid){const p=prod(pid);const md=st?(p.unitConfig?cmRound(num(st.value)-p.stock,3):Math.round((num(st.value)-p.stock)*100)/100):0;if(st&&md!==0){const mid=uid();logMove(pid,'edit',md,p.stock,num(st.value),'تعديل يدوي',mid);enqueue({type:'upsert',table:'movements',rowId:mid,prefer:'resolution=ignore-duplicates',row:ENT.movements.map(DB.movements[DB.movements.length-1])});}Object.assign(p,data);
 if(ph==='REMOVE'){await PHOTOS.del(pid).catch(()=>{});p.photo=0;p.photoVer=Date.now();if(photoURLs[pid]){URL.revokeObjectURL(photoURLs[pid]);delete photoURLs[pid];}SB.deletePhoto(pid);}
 else if(ph&&ph.blob){await PHOTOS.set(pid,ph.blob);p.photo=1;p.photoVer=Date.now();photoObjUrl(pid,ph.blob);}
 save();enqueue({type:'upsert',table:'products',rowId:pid,row:ENT.products.map(p)});closeSheet();render();toast('اتحفظ ✓');return;}
const np={id:uid(),...data};DB.products.push(np);if(np.stock>0){const mid0=uid();logMove(np.id,'open',np.stock,0,np.stock,'رصيد أول',mid0);enqueue({type:'upsert',table:'movements',rowId:mid0,prefer:'resolution=ignore-duplicates',row:ENT.movements.map(DB.movements[DB.movements.length-1])});}
if(ph&&ph.blob){await PHOTOS.set(np.id,ph.blob);np.photo=1;np.photoVer=Date.now();photoObjUrl(np.id,ph.blob);}
save();enqueue({type:'upsert',table:'products',rowId:np.id,row:ENT.products.map(np)});closeSheet();
if(fromPur&&purDraft){purDraft.items.push({productId:np.id,name:np.name,unit:np.unit,qty:1,cost:np.cost});}
render();toast(fromPur?'الصنف اتضاف للتوريد ✓':'الصنف اتضاف ✓');
}catch(e){toast('حصلت مشكلة في حفظ الصورة — البيانات اتسجلت من غيرها');save();closeSheet();render();}}

function saveParty(type,pid,fromInvoice){const isC=type==='c';const name=$('#ft-name').value.trim();if(!name){toast('اكتب الاسم');return;}

else{id=uid();const obj=isC?{id,name,phone,type:$('#ft-seg button.on')?.dataset.v||'w'}:{id,name,phone};(isC?DB.customers:DB.suppliers).push(obj);}

{const row0=(isC?DB.customers:DB.suppliers).find(x=>x.id===id);if(row0)enqueue({type:'upsert',table:isC?'customers':'suppliers',rowId:id,row:(isC?ENT.customers:ENT.suppliers).map(row0)});}

render();toast('اتحفظ ✓');}

function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='نسخة-احتياطية-'+todayStr()+'.json';a.click();toast('النسخة نزلت ✓');}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.settings)throw 0;if(!d.drafts)d.drafts=[];if(!d.nextNum)d.nextNum=1001;if(!Array.isArray(d.users))d.users=[];if(!Array.isArray(d.movements))d.movements=[];DB=d;save();curUser=null;sessionStorage.removeItem('mahal_cur');render();toast('النسخة رجعت ✓ — سجّل دخول من جديد');}catch(e){toast('الملف ده مش نسخة صحيحة');}};
r.readAsText(f);}

function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadCSV(name,rows){const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+todayStr()+'.csv';a.click();toast('الملف نزل ✓ — يفتح في Excel');}
function exportProducts(){if(!DB.products.length){toast('مفيش أصناف');return;}
downloadCSV('المخزون',[['الصنف','الفئة','الوحدة','سعر الجملة','سعر القطاعي','التكلفة (آخر شراء)','الكمية'],...DB.products.map(p=>[p.name,p.cat,p.unit,p.wPrice,p.rPrice,p.cost,p.stock])]);}
function exportInvoices(){if(!DB.invoices.length){toast('لسه مفيش فواتير');return;}
const rows=[...DB.invoices].sort((a,b)=>a.num-b.num).map(i=>{const c=cust(i.customerId);const profit=i.items.reduce((s,it)=>s+(it.price-it.cost)*it.qty,0);
return[i.num,i.date.slice(0,10),c?c.name:'(زبون محذوف)',i.priceType==='w'?'جملة':'قطاعي',i.total,i.paid,i.total-i.paid,Math.round(profit*100)/100];});
downloadCSV('الفواتير',[['رقم الفاتورة','التاريخ','الزبون','النوع','الإجمالي','المدفوع','الباقي','الربح'],...rows]);}
function exportPurchases(){if(!DB.purchases.length){toast('لسه مفيش توريدات');return;}
const rows=[...DB.purchases].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(pu=>{const s=supp(pu.supplierId);
return[pu.date.slice(0,10),s?s.name:'(مورد محذوف)',pu.items.map(it=>it.name+' × '+fmt(it.qty)+' '+it.unit).join(' + '),pu.total,pu.paid,pu.total-pu.paid];});
downloadCSV('التوريدات',[['التاريخ','المورد','الأصناف','الإجمالي','المدفوع','الباقي'],...rows]);}
function exportParties(){const rows=[['الاسم','النوع','التليفون','الرصيد']];
DB.customers.forEach(c=>{const b=custBalance(c.id);rows.push([c.name,'زبون '+(c.type==='w'?'جملة':'قطاعي'),c.phone||'',b>0?'عليه '+b:(b<0?'له رصيد '+(-b):'خالص')]);});
DB.suppliers.forEach(s=>{const b=suppBalance(s.id);rows.push([s.name,'مورد',s.phone||'',b>0?'له '+b:'خالص']);});
if(rows.length===1){toast('مفيش زباين ولا موردين');return;}
downloadCSV('الأرصدة',rows);}

let scanCtx=null,zxingReader=null,zxingP=null,lastScanCode='',lastScanAt=0,presetBarcode=null;
function loadZXing(){if(typeof ZXing!=='undefined')return Promise.resolve(true);
 if(zxingP)return zxingP;
 zxingP=new Promise(res=>{const s=document.createElement('script');s.src='./vendor/zxing.min.js';s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);setTimeout(()=>res(typeof ZXing!=='undefined'),10000);});return zxingP;}
let jbP=null;
function loadJsBarcode(){if(typeof JsBarcode!=='undefined')return Promise.resolve(true);
 if(jbP)return jbP;
 jbP=new Promise(res=>{const s=document.createElement('script');s.src='./vendor/jsbarcode.min.js';s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);setTimeout(()=>res(typeof JsBarcode!=='undefined'),10000);});return jbP;}
function scanStageHTML(){return `<div class="scan-frame"><video id="scan-video" muted playsinline></video></div><div class="note" style="text-align:center;margin-top:8px">وجّه الكاميرا على الباركود — ولو عندك قارئ USB أو بلوتوث امسح بيه على طول من غير الشاشة دي</div>`;}
function openScanSheet(ctx){scanCtx=ctx||{mode:'product'};
 sheet('امسح باركود',`<div id="scan-stage">${scanStageHTML()}</div>`,()=>stopScan());
 startCamera();}
async function startCamera(){const ok=await loadZXing();const stage=$('#scan-stage');if(!stage)return;
 if(!ok||typeof ZXing==='undefined'){stage.innerHTML=`<div class="empty"><div class="big">الكاميرا محتاجة نت أول مرة</div>افتح الشاشة دي والنت شغال مرة واحدة عشان مكتبة المسح تتخزن — بعدها هتشتغل أوفلاين عادي</div>`;return;}
 try{
  zxingReader=new ZXing.BrowserMultiFormatReader();
  await zxingReader.decodeFromConstraints({video:{facingMode:'environment'}},'scan-video',(res,err)=>{if(res)onScanDecoded(res.getText());});
 }catch(e){const st=$('#scan-stage');if(st)st.innerHTML=`<div class="empty"><div class="big">الكاميرا مش شغالة</div>اسمح للمتصفح باستخدام الكاميرا من إعدادات الموقع وجرّب تاني</div>`;}}
function stopScan(){if(zxingReader){try{zxingReader.reset();}catch(e){}zxingReader=null;}}
function onScanDecoded(code){code=String(code||'').trim();if(!code)return;
 if(code===lastScanCode&&Date.now()-lastScanAt<2000)return;
 lastScanCode=code;lastScanAt=Date.now();
 if(scanCtx&&scanCtx.mode==='field'){const fid=scanCtx.fieldId;stopScan();closeTopSheet();const el=document.getElementById(fid);if(el){el.value=code;toast('الباركود اتسجل ✓');}return;}
 scanResultCard(code);}
function scanResultCard(code){stopScan();lastScanCode=code;const stage=$('#scan-stage');if(!stage)return;
 const p=prodByBarcode(code);beep(!p);
 if(p){const price=(scanCtx&&scanCtx.mode==='invoice'&&invDraft&&invDraft.priceType==='w')?p.wPrice:p.rPrice;
  stage.innerHTML=`<div class="total-card" style="text-align:center;margin-bottom:10px"><div style="font-size:38px">✅</div><div style="font-weight:900;font-size:16px;margin-top:4px">اتلاقى: ${esc(p.name)}</div><div class="s" style="margin-top:3px">${fmt(price)} ج · المتاح ${fmt(p.stock)} ${esc(p.unit)}</div></div>
  ${scanCtx&&scanCtx.mode==='invoice'&&invDraft?`<button class="btn btn-p" style="width:100%" onclick="scanAddToInvoice('${p.id}')">＋ ضيفه للفاتورة ✓</button>`:`<button class="btn btn-p" style="width:100%" onclick="closeSheet();openProductSheet('${p.id}')">افتح الصنف</button>`}
  <button class="btn" style="background:var(--card);border:1px solid var(--line);width:100%;margin-top:8px" onclick="scanAgain()">امسح تاني 🔄</button>`;}
 else{stage.innerHTML=`<div class="total-card" style="text-align:center;margin-bottom:10px"><div style="font-size:38px">❓</div><div style="font-weight:900;font-size:16px;margin-top:4px">الباركود ده مش متسجل</div><div class="s" style="margin-top:3px;direction:ltr">${esc(code)}</div></div>
  <button class="btn btn-p" style="width:100%" onclick="scanNewProduct()">＋ سجّله كصنف جديد</button>
  <button class="btn" style="background:var(--card);border:1px solid var(--line);width:100%;margin-top:8px" onclick="scanLinkSheet()">اربطه بصنف موجود</button>
  <button class="btn" style="background:var(--card);border:1px solid var(--line);width:100%;margin-top:8px" onclick="scanAgain()">امسح تاني 🔄</button>`;}}
function scanAgain(){const stage=$('#scan-stage');if(!stage)return;stage.innerHTML=scanStageHTML();lastScanCode='';startCamera();}
function scanAddToInvoice(pid){const p=prod(pid);if(!p||!invDraft)return;
 if(p.stock<=0){toast('"'+p.name+'" خلص من المخزون');return;}
 const ex=invDraft.items.find(it=>it.productId===pid);
 if(ex){if(ex.qty+1>p.stock){toast('المتاح من "'+p.name+'" '+fmt(p.stock)+' بس');return;}ex.qty+=1;}
 else{invDraft.items.push({productId:pid,name:p.name,unit:p.unit,qty:1,price:invDraft.priceType==='w'?p.wPrice:p.rPrice,cost:p.cost});}
 render();const stage=$('#scan-stage');
 if(stage){stage.innerHTML=`<div class="total-card" style="text-align:center;margin-bottom:10px"><div style="font-size:38px">🛒</div><div style="font-weight:900;font-size:16px;margin-top:4px">"${esc(p.name)}" اتضاف للفاتورة ✓</div></div>
 <button class="btn btn-p" style="width:100%" onclick="closeSheet()">خلاص كده ✓</button>
 <button class="btn" style="background:var(--card);border:1px solid var(--line);width:100%;margin-top:8px" onclick="scanAgain()">امسح اللي بعده 🔄</button>`;}}

function scanLinkSheet(){sheet('اربط الباركود بصنف',`<div class="search" style="margin-top:0">${ic('search',18)}<input placeholder="دوّر…" oninput="$('#sl-list').innerHTML=scanLinkListHTML(this.value)"></div><div id="sl-list">${scanLinkListHTML('')}</div>`);}

function installCalc(o){const price=o.price,down=Math.min(Math.max(0,o.down),price);const rem=Math.round((price-down)*100)/100;
 let fee=o.feeMode==='total'?Math.max(0,Math.round((o.feeTotal-rem)*100)/100):Math.round(rem*o.feePct)/100;if(o.feeMode==='total'&&!(o.feeTotal>0))fee=0;
 const total=Math.round((rem+fee)*100)/100;const n=Math.max(1,o.months|0);const base=Math.floor(total/n*100)/100;
 const sched=[];let acc=0;for(let i=1;i<=n;i++){const a=i===n?Math.round((total-acc)*100)/100:base;acc+=a;sched.push({n:i,due:dueDateOf(o.from,i,o.payDay),amt:a,paidAmt:0,paidAt:null});}
 return {down,rem,fee,total,monthly:base,sched,invTotal:Math.round((price+fee)*100)/100};}
function instPaid(c){return c.schedule.reduce((s,x)=>s+x.paidAmt,0);}
function instLeft(c){return Math.round((c.total-instPaid(c))*100)/100;}
function instNext(c){return c.schedule.find(x=>x.paidAmt<x.amt-0.005);}
function instLate(c){const t=Date.now();return c.schedule.filter(x=>x.paidAmt<x.amt-0.005&&new Date(x.due)<t);}

 if(!luhnOk(imei)&&!confirm('الـ IMEI ده شكله غلط (فشل فحص الأرقام). تحفظه برضه؟'))return;
 const price=num(g('price')),cost=num(g('cost'));if(price<=0){toast('اكتب سعر البيع');return;}
 const old=id?DB.devices.find(x=>x.id===id):null;
 const d=Object.assign({},old||{id:uid(),status:'in',createdAt:_nowIso()},{brand:g('brand'),model:g('model'),storage:g('storage'),color:g('color'),imei,cond,battery:cond==='used'?num(g('battery')):0,sellerName:g('seller'),sellerNid:g('sellerId'),sellerPhone:g('sellerPhone'),cost,price,warrantyMonths:Math.max(0,Math.round(num(g('warr')))),supplierId:$('#dv-sup')?.value||''});
 const p=mobModelProduct(d);
 if(!old){const b=p.stock;p.stock=b+1;d.productId=p.id;logMove(p.id,'in',1,b,p.stock,'استلام جهاز '+imei,uid());enqueue({type:'upsert',table:'movements',rowId:DB.movements[DB.movements.length-1].id,prefer:'resolution=ignore-duplicates',row:ENT.movements.map(DB.movements[DB.movements.length-1])});}

 enqueue({type:'upsert',table:'products',rowId:p.id,row:ENT.products.map(p)});
 mobSave('devices',d);closeSheet();render();toast(old?'اتحفظ ✓':'الجهاز اتضاف للمخزن ✓');}

 else{const p=prod(id);if(i>=0){if(mobCart[i].qty+1>p.stock){toast('المتاح '+fmt(p.stock)+' بس');return;}mobCart[i].qty++;}else mobCart.push({k,id,qty:1});}

 const control=(kind,title,help)=>{const a=w[kind];const change=k=>`mobWarrSet(${i},'${kind}','${k}',this.value)`;return `<div class="mb-warr-choice"><div style="font-weight:900;margin-bottom:8px">${title}</div><select aria-label="${title}: المدة" onchange="${change('period')}">${[['','اختار المدة'],['0','بدون ضمان'],['1','شهر'],['3','٣ شهور'],['6','٦ شهور'],['12','سنة (١٢ شهر)'],['days','مدة بالأيام']].map(([v,l])=>`<option value="${v}"${a.period===v?' selected':''}>${l}</option>`).join('')}</select>${a.period==='days'?`<div class="field" style="margin:8px 0"><div class="lbl">عدد الأيام</div><input aria-label="${title}: عدد الأيام" type="number" min="1" max="3650" inputmode="numeric" value="${esc(a.days)}" oninput="${change('days')}"></div>`:''}${a.period&&a.period!=='0'?`<div class="field" style="margin:8px 0"><div class="lbl">بداية الضمان</div><input aria-label="${title}: بداية الضمان" type="date" value="${esc(a.start)}" onchange="${change('start')}"></div>${kind==='shop'?`<textarea aria-label="${title}: تفاصيل" rows="3" maxlength="160" placeholder="${help}" oninput="${change('label')}">${esc(a.label)}</textarea>`:`<input aria-label="${title}: تفاصيل" value="${esc(a.label)}" maxlength="160" placeholder="${help}" oninput="${change('label')}">`}`:''}</div>`;};
 return `<div class="mb-warr-box"><div style="font-size:13px;font-weight:900;margin-bottom:8px;overflow-wrap:anywhere">${esc(devName(d))}<div class="mbimei" style="font-weight:500;font-size:11px">IMEI: ${esc(d.imei)}</div></div><div class="mb-warr-cols">${control('manufacturer','ضمان الشركة المصنعة','الشركة / الوكيل (اختياري)')}${control('shop','ضمان المحل','شروط ضمان المحل (اختياري)')}</div></div>`;

function mobWarrantySnapshot(x){const draft=mobWarrDraft(x),out={};for(const kind of ['manufacturer','shop']){const a=draft[kind];if(a.period==='')throw new Error('حدد ضمان الشركة وضمان المحل لكل جهاز، أو اختار بدون ضمان');
 const n=a.period==='days'?Number(a.days):Number(a.period),unit=a.period==='days'?'days':'months';if(!Number.isInteger(n)||n<0||n>(unit==='days'?3650:120)||(unit==='days'&&n===0))throw new Error('راجع مدة الضمان');
 if(!n){out[kind]={duration:0,unit,startAt:null,endAt:null,label:''};continue;}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(a.start)||!Number.isFinite(Date.parse(a.start+'T12:00:00Z'))||new Date(a.start+'T12:00:00Z').toISOString().slice(0,10)!==a.start)throw new Error('راجع تاريخ بداية الضمان');
 const end=new Date(a.start+'T12:00:00Z');if(unit==='months'){const day=end.getUTCDate();end.setUTCMonth(end.getUTCMonth()+n);if(end.getUTCDate()!==day)end.setUTCDate(0);}else end.setUTCDate(end.getUTCDate()+n);
 out[kind]={duration:n,unit,startAt:a.start,endAt:end.toISOString().slice(0,10),label:String(a.label||'').trim().slice(0,160)};}
 return out;}

function mobWarrantyBadge(d){return ['manufacturer','shop'].map(k=>{const w=d.warranties[k]||{duration:0},title=k==='manufacturer'?'الشركة':'المحل';let label='بدون ضمان',cls='mb-m';if(w.duration){label=w.startAt>mobToday()?'يبدأ '+mobWarrDate(w.startAt):w.endAt>=mobToday()?'ساري لحد '+mobWarrDate(w.endAt):'منتهي';cls=w.endAt>=mobToday()?'mb-g':'mb-r';}return `<span class="mbb ${cls}">${title}: ${label}</span>`;}).join(' ');}
function mobInvoiceCanvas(inv){const W=820,pd=44,cv=document.createElement('canvas'),cx=cv.getContext('2d');cx.font='700 25px Cairo,sans-serif';const rows=[];
 const wrap=(s)=>{const words=String(s).split(/\s+/);let line='';for(const word of words){const n=line?line+' '+word:word;if(cx.measureText(n).width>W-pd*2&&line){rows.push({text:line});line=word;}else line=n;}if(line)rows.push({text:line});};
 rows.push({text:DB.settings.shopName,title:true},{text:'فاتورة #'+fmt(inv.num)+' · '+mobWarrDate(inv.date)},{text:'العميل: '+(cust(inv.customerId)?.name||'نقدي')});
 inv.items.forEach(it=>{rows.push({line:true});wrap(it.name.replace(/ · IMEI .*/,''));if(it.imei)rows.push({text:'IMEI: '+it.imei});wrap(fmt(it.qty)+' '+it.unit+' × '+fmt(it.price)+' ج = '+fmt(it.qty*it.price)+' ج');if(it.warranties)mobWarrLines(it.warranties).forEach(wrap);if(it.commerce)cmDetail(it).forEach(wrap);});

 rows.push({line:true},{text:'الإجمالي: '+fmt(inv.total)+' ج',title:true},{text:'المدفوع: '+fmt(inv.paid)+' ج'},{text:'الباقي: '+fmt(Math.max(0,inv.total-inv.paid))+' ج'});cv.width=W;cv.height=pd*2+rows.reduce((n,r)=>n+(r.title?58:r.line?22:42),0);const x=cv.getContext('2d');x.fillStyle='#fffdf6';x.fillRect(0,0,W,cv.height);x.direction='rtl';x.textAlign='right';let y=pd;
 rows.forEach(r=>{if(r.line){x.strokeStyle='#e4d8be';x.beginPath();x.moveTo(pd,y);x.lineTo(W-pd,y);x.stroke();y+=22;return;}x.font=(r.title?'900 32px':'700 25px')+' Cairo,sans-serif';x.fillStyle=r.title?'#0b6b3d':'#1b1812';y+=r.title?46:34;x.fillText(r.text,W-pd,y);y+=r.title?12:8;});return cv;}

function vMobileDebt(cid){const c=cust(cid);if(!c)return vMobileDebts();const b=custBalance(cid),cs=mdContracts(cid),last=mdLast(cid),inst=mdRound(cs.reduce((n,c)=>n+instLeft(c),0)),ambig=inst>b+.005||(cs.length>0&&DB.payments.some(p=>p.partyType==='c'&&p.partyId===cid&&p.kind==='in'&&!p.contractId&&p.amount>0));const hist=[...DB.invoices.filter(i=>i.customerId===cid).map(x=>({type:'inv',date:x.date,x})),...DB.payments.filter(p=>p.partyType==='c'&&p.partyId===cid).map(x=>({type:'pay',date:x.date,x}))].sort((a,b)=>new Date(b.date)-new Date(a.date));return mobHead(esc(c.name),'حساب العميل',`<button class="btn" onclick="go('#/mdebts')">رجوع</button>`)+`<div class="content"><div class="total-card">${mdKV(b<0?'له رصيد عندك':'إجمالي المتبقي عليه',`<span style="font-size:27px;color:var(--red)">${fmt(Math.abs(b))} ج</span>`)}${mdKV('آخر دفعة',last?fmt(last.amount)+' ج · '+mdDate(last.date):'مفيش دفعات')}${localStorage.getItem(mdReceiptKey())?`<button class="btn btn-p" style="width:100%;margin-top:12px" onclick="mdOpenReceipt('${cid}')">تأكيد نتيجة دفعة سابقة</button>`:''}${b>0?`<button class="btn btn-p" style="width:100%;margin-top:12px" onclick="mdOpenReceipt('${cid}')">＋ تسجيل دفعة مستلمة</button>`:''}</div><div class="sec-title">تفاصيل المبالغ</div><div class="total-card">${ambig?'<p class="note">فيه دفعات عامة أو فرق بين جدول الأقساط وحساب العميل محتاج مراجعة. إجمالي الحساب هو المرجع؛ ما تجمعش الرقمين.</p>':mdKV('أقساط متبقية',fmt(inst)+' ج')+mdKV('باقي حساب الفواتير',fmt(Math.max(0,mdRound(b-inst)))+' ج')}${cs.map(c=>`<button class="row" onclick="openContract('${c.id}')"><div class="mid"><b>عقد تقسيط #${esc(c.invoiceNum||'')}</b><div class="s">فتح الجدول والتحصيل</div></div><b>${fmt(instLeft(c))} ج</b></button>`).join('')}</div><div class="sec-title">حركة الحساب</div>${hist.map(h=>h.type==='inv'?`<button class="row" onclick="go('#/inv/${h.x.id}')"><div class="mid"><b>فاتورة #${fmt(h.x.num)}</b><div class="s">${mdDate(h.date)} · فتح الفاتورة الأصلية</div>${auditAnnotati function mdOpenReceipt(cid,contractId=''){if(!can('invoice')&&!can('customers')){toast('مفيش صلاحية');return;}const old=localStorage.getItem(mdReceiptKey());if(old){try{mdDraft=JSON.parse(old);mdReview(true);return;}catch(e){toast('طلب سابق محتاج مراجعة');return;}}const c=cust(cid),cs=mdContracts(cid).filter(c=>instLeft(c)>.005);sheet('تسجيل دفعة مستلمة',`<h3>${esc(c.name)}</h3><p class="note">تحصيل جديد محتاج اتصال عشان حساب العميل وجدول الأقساط يتحفظوا مع بعض، من غير تكرار.</p>${mdKV('إجمالي المتبقي',fmt(custBalance(cid))+' ج')}<div class="field"><label class="lbl" for="md-purpose">الدفعة تخص إيه؟</label><select id="md-purpose" onchange="mdPreview('${cid}')"><option value="">دفعة عامة على الحساب</option>${cs.map(c=>`<option value="${c.id}" ${c.id===contractId?'selected':''}>قسط عقد #${esc(c.invoiceNum||'')} · باقي ${fmt(instLeft(c))} ج</option>`).join('')}</select></div><div class="field"><label class="lbl" for="md-amount">المبلغ المستلم بالجنيه</label><input id="md-amount" inputmode="decimal" oninput="mdPreview('${cid}')"></div><div class="field"><label class="lbl" for="md-method">طريقة الاستلام</label><select id="md-method">${['كاش','تحويل','رصيد'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label class="lbl" for="md-note">ملاحظة (اختياري)</label><input id="md-note"></div><div class="total-card" id="md-preview"></div><button class="btn btn-p" style="width:100%;margin-top:12px" onclick="mdPrepare('${cid}')">مراجعة الدفعة</button>`);mdPreview(cid);}
