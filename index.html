<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C7A54">
<title>محلي — إدارة المحل</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F5F1E8;--card:#FFF;--line:#EAE2D3;--ink:#23201A;--muted:#8A8172;
--green:#1C7A54;--green-soft:#E4F1EA;--amber:#DE9A2B;--amber-soft:#FBF0DC;
--red:#C24A3E;--red-soft:#F9E7E5;--blue:#2F6296;--blue-soft:#E8EFF7;
}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Noto Sans Arabic',system-ui,sans-serif;background:#DDD6C7;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:92px;box-shadow:0 0 40px rgba(0,0,0,.08)}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.appbar{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar .hello{font-size:13px;color:var(--muted)}
.appbar .shop{font-size:19px;font-weight:800;margin-top:1px}
.appbar .back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:6px 0}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:none}
.content{padding:6px 16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-size:20px;font-weight:800;margin-top:4px}
.stat .val small{font-size:12px;font-weight:600;color:var(--muted)}
.stat .sub{font-size:10.5px;margin-top:3px;color:var(--muted)}
.stat.hero{background:var(--green);border-color:var(--green)}
.stat.hero .lbl,.stat.hero .sub{color:#CDE7DA}
.stat.hero .val{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec-title{font-size:14px;font-weight:800;margin:16px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.sec-title .more{font-size:12px;color:var(--green);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;text-align:center;display:block}
.act .ic{width:36px;height:36px;margin:0 auto 5px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.act .tx{font-size:11px;font-weight:800}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;width:100%;text-align:right}
button.row{cursor:pointer}
.row .ic{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.row .mid{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.row .end{text-align:left;flex-shrink:0}
.row .amt{font-size:14px;font-weight:800}
.row .amt small{font-size:10.5px;font-weight:600;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:3px}
.b-red{background:var(--red-soft);color:var(--red)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:#9A6A14}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.alert{background:var(--amber-soft);border:1px solid #F0D9AC;border-radius:14px;padding:10px 13px;display:flex;gap:10px;align-items:center;margin-top:10px}
.alert .tx{font-size:12px;font-weight:600;color:#7A5A15;line-height:1.6}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:74px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:9px;z-index:20}
.nav-it{text-align:center;width:58px;color:var(--muted)}
.nav-it .ic{display:flex;align-items:center;justify-content:center;height:24px}
.nav-it .tx{font-size:10px;font-weight:800;margin-top:2px}
.nav-it.on{color:var(--green)}
.fab{width:52px;height:52px;border-radius:18px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:-26px auto 0;box-shadow:0 6px 14px rgba(28,122,84,.35)}
.fab-wrap{text-align:center;width:58px}
.fab-wrap .tx{font-size:10px;font-weight:800;color:var(--green);margin-top:3px}
.field{margin-bottom:13px}
.field .lbl{font-size:12.5px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.seg{display:flex;background:#EDE7DA;border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:800;color:var(--muted);border-radius:9px}
.seg button.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.item-row .qty{display:flex;align-items:center;gap:9px;background:#F1ECE1;border-radius:10px;padding:5px 9px}
.item-row .qty .n{font-size:14px;font-weight:800;min-width:18px;text-align:center}
.item-row .qty button{font-size:16px;color:var(--green);font-weight:800;width:22px;height:22px}
.add-item{border:1.5px dashed #CFC5B0;border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:800;color:var(--green);width:100%;margin-bottom:8px}
.total-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0}
.trow .k{color:var(--muted);font-weight:600}
.trow.grand{border-top:1px dashed var(--line);margin-top:6px;padding-top:11px;font-size:16px;font-weight:800}
.trow .paid{color:var(--green);font-weight:800}
.trow .due{color:var(--red);font-weight:800}
.trow input{width:110px;background:#F7F3EA;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:800;text-align:left;outline:none}
.cost-in{width:74px;background:#F7F3EA;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:13px;font-weight:800;text-align:center;outline:none;color:var(--ink);font-family:inherit}
.cost-in:focus{border-color:var(--green)}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px;z-index:15}
.btn{flex:1;border-radius:16px;padding:14px 0;text-align:center;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--green);color:#fff}
.btn-s{background:var(--card);border:1px solid var(--line);flex:0 0 140px}
.btn-danger{background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px;font-weight:800;width:100%;margin-top:8px}
.cust-head{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;text-align:center}
.cust-head .av{width:50px;height:50px;border-radius:18px;background:var(--blue-soft);color:var(--blue);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.cust-head .nm{font-size:16.5px;font-weight:800}
.cust-head .ph{font-size:12px;color:var(--muted);margin-top:3px;direction:ltr}
.bal{margin-top:11px;border-radius:14px;padding:10px;text-align:center}
.bal.owed{background:var(--red-soft);border:1px solid #EFC9C5}
.bal.owed .k{color:var(--red)}
.bal.owed .v{color:var(--red)}
.bal.clear{background:var(--green-soft);border:1px solid #C6E2D2}
.bal.clear .k{color:var(--green)}
.bal.clear .v{color:var(--green)}
.bal .k{font-size:12px;font-weight:700}
.bal .v{font-size:25px;font-weight:800;margin-top:1px}
.bal .v small{font-size:13px;font-weight:600}
.cbtns{display:flex;gap:8px;margin-top:11px}
.cbtn{flex:1;border-radius:12px;padding:11px 4px;text-align:center;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.overlay{position:fixed;inset:0;background:rgba(35,32,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet .st{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center}
.sheet .x{position:absolute;left:16px;top:14px;color:var(--muted)}
.sheet-wrap{position:relative}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;font-weight:600}
.empty .big{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.set-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;margin-bottom:8px;width:100%;text-align:right;font-size:13.5px;font-weight:800}
.set-row .s{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.lockwrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px;width:100%;max-width:340px;text-align:center}
.lockcard .lk{width:56px;height:56px;border-radius:20px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.lockcard h2{font-size:18px;font-weight:800}
.lockcard p{font-size:12.5px;color:var(--muted);margin:5px 0 16px;font-weight:600}
.lockcard input{width:100%;background:#F7F3EA;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:20px;font-weight:800;text-align:center;letter-spacing:6px;outline:none;color:var(--ink)}
.lockcard input:focus{border-color:var(--green)}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord .onm{font-size:14px;font-weight:800}
.ord .otm{font-size:11px;color:var(--muted);font-weight:600}
.ord .oit{font-size:12.5px;color:var(--ink);margin-top:8px;line-height:1.9;font-weight:600}
.ord .ont{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.ord .obt{display:flex;gap:8px;margin-top:10px}
.ord .obt button{flex:1;border-radius:10px;padding:9px 0;font-size:12px;font-weight:800}
.ord .ob-ok{background:var(--green);color:#fff}
.ord .ob-no{background:var(--red-soft);color:var(--red)}
.ord .ob-wa{background:var(--green-soft);color:var(--green);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:4px}
.ord.done{opacity:.6}
.pimg{width:38px;height:38px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--green-soft)}
.photo-pick{width:100%;aspect-ratio:16/9;border-radius:16px;border:1.5px dashed #CFC5B0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;overflow:hidden;position:relative}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .ov{position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(35,32,26,.75);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px}
#print-area{display:none}
@media print{
  body>*{display:none!important}
  #print-area{display:block!important;background:#fff;color:#000;font-family:'Cairo',sans-serif}
  #print-area{padding:10px;direction:rtl}
}
.p-head{text-align:center;border-bottom:2px dashed #999;padding-bottom:8px;margin-bottom:10px}
.p-head h1{font-size:18px}
.p-head p{font-size:12px;color:#333}
table.p-items{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.p-items th,table.p-items td{border:1px solid #999;padding:6px;text-align:right}
.p-tot{font-size:14px;margin-top:8px}
.p-foot{text-align:center;font-size:11px;color:#555;margin-top:14px}
</style>
</head>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const AR='ar-EG';
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString(AR,{maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,]/g,''));return isNaN(n)?0:n;};
const todayStr=()=>new Date().toISOString().slice(0,10);
function relDate(iso){const d=new Date(iso),t=new Date();const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()),tt=new Date(t.getFullYear(),t.getMonth(),t.getDate());const diff=Math.round((tt-dd)/86400000);
if(diff===0)return'النهاردة';if(diff===1)return'أمبارح';if(diff<7)return'من '+diff.toLocaleString(AR)+' أيام';if(diff<30)return'من '+Math.floor(diff/7).toLocaleString(AR)+' أسبوع';return d.toLocaleDateString(AR,{day:'numeric',month:'long'});}
const sameMonth=iso=>{const d=new Date(iso),t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth();};
const isToday=iso=>new Date(iso).toDateString()===new Date().toDateString();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function waLink(phone,text){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='2'+p;if(p.length===11&&p.startsWith('20'))p='2'+p;if(!p)return null;return 'https://wa.me/'+p+'?text='+encodeURIComponent(text);}

receipt:'<path d="M5 3h14v18l-2.3-1.7-2.4 1.7-2.3-1.7-2.3 1.7-2.4-1.7L5 21z"/><path d="M9 8.5h6"/><path d="M9 12.5h6"/>',

const PHOTOS={
 db:null,
 open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('mahal_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
 async set(id,blob){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});},
 async get(id){const db=await this.open();return new Promise((res,rej)=>{const rq=db.transaction('photos').objectStore('photos').get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});},
 async del(id){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
const photoURLs={};
function photoObjUrl(id,blob){if(photoURLs[id])URL.revokeObjectURL(photoURLs[id]);photoURLs[id]=URL.createObjectURL(blob);return photoURLs[id];}
async function hydratePhotos(root){const imgs=(root||document).querySelectorAll('img[data-pid]:not([src])');
for(const img of imgs){const pid=img.dataset.pid;try{let u=photoURLs[pid];
 if(!u){const blob=await PHOTOS.get(pid);if(!blob){img.replaceWith(imgPhFallback(pid));continue;}u=photoObjUrl(pid,blob);}
 img.src=u;}catch(e){}}
}
function imgPhFallback(pid){const p=prod(pid);const d=document.createElement('div');d.className='ic';d.style.cssText='width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--green-soft);color:var(--green)';d.innerHTML=ic(catIcon(p?p.cat:''));return d;}
async function processPhotoFile(file){const bmp=await createImageBitmap(file);const max=640;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
return await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));}
let pendingPhoto=null;
async function pickProductPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;
try{const blob=await processPhotoFile(f);pendingPhoto={blob,url:URL.createObjectURL(blob)};
 const w=$('#fp-photo-wrap');if(w){w.innerHTML=`<img src="${pendingPhoto.url}" alt=""><span class="ov">غيّر الصورة</span>`;}
}catch(e){toast('الصورة دي مش راضية تتقري — جرب صورة تانية');}}

const SB={
key:'mahal_shop_cfg',cfg:null,token:null,tokenExp:0,
load(){if(this.cfg)return;try{this.cfg=JSON.parse(localStorage.getItem(this.key))||{};}catch(e){this.cfg={};}},
save(){localStorage.setItem(this.key,JSON.stringify(this.cfg||{}));},
ready(){this.load();return !!(this.cfg.url&&this.cfg.anon);},
async login(){this.load();if(this.token&&Date.now()<this.tokenExp)return;
 if(!this.cfg.email||!this.cfg.pass)throw new Error('no-auth');
 const r=await fetch(this.cfg.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':this.cfg.anon,'Content-Type':'application/json'},body:JSON.stringify({email:this.cfg.email,password:this.cfg.pass})});
 if(!r.ok)throw new Error('auth-failed');const j=await r.json();this.token=j.access_token;this.tokenExp=Date.now()+((j.expires_in||3600)-120)*1000;},
async req(path,opt){opt=opt||{};this.load();const h=Object.assign({'apikey':this.cfg.anon,'Authorization':'Bearer '+(this.token||this.cfg.anon)},opt.headers||{});
 const r=await fetch(this.cfg.url.replace(/\/$/,'')+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));
 if(!r.ok)throw new Error('req-failed:'+r.status);if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null;},
photoUrlFor(p){return this.cfg.url.replace(/\/$/,'')+'/storage/v1/object/public/product-photos/'+encodeURIComponent(p.id)+'.jpg?v='+(p.photoVer||1);},
async uploadPhoto(id,blob){const r=await fetch(this.cfg.url.replace(/\/$/,'')+'/storage/v1/object/product-photos/'+encodeURIComponent(id)+'.jpg',{method:'POST',headers:{'apikey':this.cfg.anon,'Authorization':'Bearer '+this.token,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
 if(!r.ok)throw new Error('photo-upload-failed:'+r.status);},
async pushProducts(){await this.login();
 const ups=JSON.parse(localStorage.getItem('mahal_photo_up')||'{}');
 for(const p of DB.products){if(p.photo&&p.photoVer&&ups[p.id]!==p.photoVer){const blob=await PHOTOS.get(p.id);if(blob){await this.uploadPhoto(p.id,blob);ups[p.id]=p.photoVer;}}}
 localStorage.setItem('mahal_photo_up',JSON.stringify(ups));
 const rows=DB.products.map(p=>({id:p.id,name:p.name,cat:p.cat,unit:p.unit,price:p.rPrice,stock:p.stock,photo_url:p.photo?this.photoUrlFor(p):null,updated_at:new Date().toISOString()}));
 await this.req('products',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
 const info=[{id:1,shop_name:DB.settings.shopName,owner_name:DB.settings.ownerName||'',phone:DB.settings.phone||'',updated_at:new Date().toISOString()}];
 await this.req('shop_info',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify(info)});
 const liveIds=DB.products.map(p=>p.id);
 if(liveIds.length){await this.req('products?id=not.in.('+liveIds.map(encodeURIComponent).join(',')+')',{method:'DELETE'});}
 return rows.length;},
async fetchOrders(){await this.login();return await this.req('orders?order=created_at.desc&limit=100');},
async setOrderStatus(id,st){await this.login();await this.req('orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({status:st})});}
};

/* ============ derived ============ */
const prod=id=>DB.products.find(p=>p.id===id);
const cust=id=>DB.customers.find(c=>c.id===id);
const supp=id=>DB.suppliers.find(s=>s.id===id);
function custBalance(cid){let b=0;DB.invoices.filter(i=>i.customerId===cid).forEach(i=>b+=i.total-i.paid);DB.payments.filter(p=>p.partyType==='c'&&p.partyId===cid&&p.kind==='in').forEach(p=>b-=p.amount);return Math.round(b*100)/100;}
function suppBalance(sid){let b=0;DB.purchases.filter(i=>i.supplierId===sid).forEach(i=>b+=i.total-i.paid);DB.payments.filter(p=>p.partyType==='s'&&p.partyId===sid&&p.kind==='out').forEach(p=>b-=p.amount);return Math.round(b*100)/100;}
function totals(){let salesToday=0,profitMonth=0,receivables=0,payables=0;
DB.invoices.forEach(inv=>{if(isToday(inv.date))salesToday+=inv.total;
 if(sameMonth(inv.date))inv.items.forEach(it=>profitMonth+=(it.price-it.cost)*it.qty);});
DB.customers.forEach(c=>{const b=custBalance(c.id);if(b>0)receivables+=b;});
DB.suppliers.forEach(s=>{const b=suppBalance(s.id);if(b>0)payables+=b;});
return{salesToday,profitMonth,receivables,payables};}
function activity(){const a=[];
DB.invoices.forEach(i=>a.push({date:i.date,kind:'inv',text:'فاتورة لـ'+(cust(i.customerId)?.name||'زبون محذوف'),amt:i.total,left:i.total-i.paid,ref:i.id}));
DB.payments.filter(p=>p.kind==='in').forEach(p=>a.push({date:p.date,kind:'pay',text:'دفعة من '+(cust(p.partyId)?.name||'زبون محذوف'),amt:p.amount,ref:p.id}));

function saveInvoice(andPrint){const d=invDraft;if(!d.customerId){toast('اختار الزبون الأول');return;}
if(!d.items.length){toast('ضيف صنف واحد على الأقل');return;}
for(const it of d.items){const p=prod(it.productId);if(p&&it.qty>p.stock){toast(`الكمية من "${it.name}" أكبر من المتاح (${fmt(p.stock)})`);return;}}
const total=d.items.reduce((s,it)=>s+it.qty*it.price,0);let paid=Math.min(num(d.paid),total);
const inv={id:uid(),num:DB.nextNum++,date:new Date().toISOString(),customerId:d.customerId,priceType:d.priceType,items:d.items.map(it=>({...it})),total,paid};
d.items.forEach(it=>{const p=prod(it.productId);if(p)p.stock=Math.round((p.stock-it.qty)*100)/100;});
DB.invoices.push(inv);if(d._draftId){DB.drafts=DB.drafts.filter(x=>x.id!==d._draftId);}save();
const preset=d._preset;invDraft=null;

go(preset?'#/customers/'+preset:'#/');toast('الفاتورة اتحفظت ✓');}

<div class="p-foot">${esc(DB.settings.shopName)}</div>`;

${parties.map(x=>`<option value="${x.id}" ${x.id===presetId?'selected':''}>${esc(x.name)} — ${isIn?'عليه':'له'} ${fmt(Math.max(isIn?custBalance(x.id):suppBalance(x.id),0))} ج</option>`).join('')}</select></div>

<button class="btn btn-p" style="width:100%" onclick="saveProduct('${pid||''}',${fromPur?'true':'false'})">${p?'حفظ التعديلات ✓':fromPur?'ضيف الصنف للتوريد ✓':'ضيف الصنف ✓'}</button>

async function saveProduct(pid,fromPur){const name=$('#fp-name').value.trim();if(!name){toast('اكتب اسم الصنف');return;}
const st=$('#fp-stock');
const data={name,cat:$('#fp-cat').value,unit:$('#fp-unit').value.trim()||'قطعة',wPrice:num($('#fp-w').value),rPrice:num($('#fp-r').value),cost:num($('#fp-cost').value),stock:st?num(st.value):0,lowAt:num($('#fp-low').value)};
const ph=pendingPhoto;pendingPhoto=null;
try{
if(pid){const p=prod(pid);Object.assign(p,data);
 if(ph==='REMOVE'){await PHOTOS.del(pid).catch(()=>{});p.photo=0;p.photoVer=Date.now();if(photoURLs[pid]){URL.revokeObjectURL(photoURLs[pid]);delete photoURLs[pid];}}
 else if(ph&&ph.blob){await PHOTOS.set(pid,ph.blob);p.photo=1;p.photoVer=Date.now();photoObjUrl(pid,ph.blob);}
 save();closeSheet();render();toast('اتحفظ ✓');return;}
const np={id:uid(),...data};DB.products.push(np);
if(ph&&ph.blob){await PHOTOS.set(np.id,ph.blob);np.photo=1;np.photoVer=Date.now();photoObjUrl(np.id,ph.blob);}
save();closeSheet();
if(fromPur&&purDraft){purDraft.items.push({productId:np.id,name:np.name,unit:np.unit,qty:1,cost:np.cost});}
render();toast(fromPur?'الصنف اتضاف للتوريد ✓':'الصنف اتضاف ✓');
}catch(e){toast('حصلت مشكلة في حفظ الصورة — البيانات اتسجلت من غيرها');save();closeSheet();render();}}

<div class="field"><div class="lbl">الاسم</div><input id="ft-name" value="${x?esc(x.name):''}" placeholder="${isC?'مطعم الفلاح — الحاج رضوان':'شركة النور للتوريدات'}"></div>
<div class="field"><div class="lbl">رقم التليفون (اختياري)</div><input id="ft-phone" inputmode="tel" style="direction:ltr;text-align:right" value="${x?esc(x.phone):''}" placeholder="01xxxxxxxxx"></div>
${isC?`<div class="field"><div class="lbl">نوع الزبون</div><div class="seg" id="ft-seg">
<button class="${!x||x.type==='w'?'on':''}" data-v="w" onclick="segPick(this)">جملة</button>
<button class="${x&&x.type==='r'?'on':''}" data-v="r" onclick="segPick(this)">قطاعي</button></div></div>`:''}
<button class="btn btn-p" style="width:100%" onclick="saveParty('${type}','${pid||''}',${fromInvoice?'true':'false'})">${x?'حفظ ✓':'ضيف ✓'}</button>`);}
function segPick(btn){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function saveParty(type,pid,fromInvoice){const isC=type==='c';const name=$('#ft-name').value.trim();if(!name){toast('اكتب الاسم');return;}
const phone=$('#ft-phone').value.trim();
let id=pid;
if(pid){const x=isC?cust(pid):supp(pid);x.name=name;x.phone=phone;if(isC){const seg=$('#ft-seg button.on');if(seg)x.type=seg.dataset.v;}}
else{id=uid();const obj=isC?{id,name,phone,type:$('#ft-seg button.on')?.dataset.v||'w'}:{id,name,phone};(isC?DB.customers:DB.suppliers).push(obj);}
save();closeSheet();
if(fromInvoice){if(isC&&invDraft){invDraft.customerId=id;const c=cust(id);if(c)invDraft.priceType=c.type;}if(!isC&&purDraft){purDraft.supplierId=id;}}
render();toast('اتحفظ ✓');}
/* ============ settings ============ */
const SB_DEF={url:'https://ofqhrpkgxxbdrhuujgxt.supabase.co',anon:'sb_publishable_CH8nhDJQlV-5xsKYoCZRVg_mUoLsTQw'};
function storeUrl(){return (location.origin||'')+String(location.pathname||'/').replace(/[^/]*$/,'')+'store.html';}
function shopSettingsHTML(){SB.load();const c=SB.cfg||{};const sUrl=storeUrl();
if(!SB.ready()){return `<div class="set-row" style="cursor:default"><span style="font-weight:600;color:var(--muted);font-size:12px;line-height:1.8">حط بيانات مشروع Supabase هنا مرة واحدة، والمتجر هيشتغل لوحده. البيانات دي بتتخزن على جهازك بس.</span></div>
<div class="field"><div class="lbl">رابط المشروع (Project URL)</div><input id="sb-url" value="${esc(c.url||SB_DEF.url)}" placeholder="https://xxxx.supabase.co" style="direction:ltr;text-align:left" autocomplete="off"></div>
<div class="field"><div class="lbl">المفتاح العمومي (anon public key)</div><input id="sb-anon" value="${esc(c.anon||SB_DEF.anon)}" type="password" autocomplete="off" style="direction:ltr;text-align:left"></div>
<div class="field"><div class="lbl">إيميل حساب سوبابيز بتاعك</div><input id="sb-email" value="${esc(c.email||'')}" autocomplete="off" style="direction:ltr;text-align:left"></div>
<div class="field"><div class="lbl">باسورد سوبابيز</div><input id="sb-pass" value="${esc(c.pass||'')}" type="password" autocomplete="off" style="direction:ltr;text-align:left"></div>
<button class="btn btn-p" style="width:100%" onclick="saveShopCfg()">حفظ بيانات المتجر ✓</button>`;}
return `<div class="set-row" style="cursor:default">${ic('store')}<span>المتجر شغال<span class="s" style="display:block;direction:ltr;text-align:right">${esc(sUrl)}</span></span><button class="cbtn" style="flex:0 0 62px" onclick="copyStoreLink()">${ic('copy',14)} نسخ</button><button class="cbtn" style="flex:0 0 62px;background:var(--green-soft);color:var(--green);margin-inline-start:6px" onclick="openStore()">${ic('open',14)} فتح</button></div>
<button class="set-row" onclick="syncShopNow()">${ic('upload')}<span>نزّل الأصناف على المتجر<span class="s" style="display:block">حدّث الأسعار والكميات واسم المحل عند الزباين</span></span></button>
<button class="set-row" onclick="go('#/orders')">${ic('receipt')}<span>طلبات المتجر<span class="s" style="display:block">شوف الطلبات الجديدة واقفلها</span></span></button>
<button class="set-row" onclick="sheet('بيانات المتجر',document.getElementById('sb-cfg-tpl').innerHTML)">${ic('gear')}<span>تعديل بيانات الاتصال</span></button>
<template id="sb-cfg-tpl">
<div class="field"><div class="lbl">رابط المشروع (Project URL)</div><input id="sb-url" value="${esc(c.url||SB_DEF.url)}" style="direction:ltr;text-align:left" autocomplete="off"></div>
<div class="field"><div class="lbl">المفتاح العمومي (anon public key)</div><input id="sb-anon" value="${esc(c.anon||SB_DEF.anon)}" type="password" autocomplete="off" style="direction:ltr;text-align:left"></div>
<div class="field"><div class="lbl">إيميل حساب سوبابيز</div><input id="sb-email" value="${esc(c.email||'')}" autocomplete="off" style="direction:ltr;text-align:left"></div>
<div class="field"><div class="lbl">باسورد سوبابيز</div><input id="sb-pass" value="${esc(c.pass||'')}" type="password" autocomplete="off" style="direction:ltr;text-align:left"></div>
<button class="btn btn-p" style="width:100%" onclick="saveShopCfg()">حفظ ✓</button>
</template>`;}
function saveShopCfg(){SB.cfg={url:($('#sb-url')||{}).value.trim(),anon:($('#sb-anon')||{}).value.trim(),email:($('#sb-email')||{}).value.trim(),pass:($('#sb-pass')||{}).value};
SB.save();SB.token=null;shopOrders=null;shopOrdersAt=0;closeSheet();render();toast('بيانات المتجر اتحفظت ✓');}
function copyStoreLink(){const u=storeUrl();
const done=()=>toast('اللينك اتنسخ ✓ — ابعته لزباينك');
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done).catch(()=>{prompt('انسخ اللينك ده:',u);});}else{prompt('انسخ اللينك ده:',u);}}
function vSettings(){return `<div class="appbar"><div>${backBtn('#/')}<div class="shop" style="margin-top:4px">الإعدادات</div></div></div>
<div class="content">
<div class="field"><div class="lbl">اسم المحل</div><input id="st-shop" value="${esc(DB.settings.shopName)}"></div>
<div class="field"><div class="lbl">اسمك (للتحية في الرئيسية)</div><input id="st-owner" value="${esc(DB.settings.ownerName||'')}" placeholder="الحاج محمود"></div>
<div class="field"><div class="lbl">موبايل المحل (واتساب — بيظهر للزباين في المتجر)</div><input id="st-phone" value="${esc(DB.settings.phone||'')}" placeholder="01xxxxxxxxx" inputmode="tel" style="direction:ltr;text-align:right"></div>
<button class="btn btn-p" style="width:100%" onclick="DB.settings.shopName=$('#st-shop').value.trim()||'محلي';DB.settings.ownerName=$('#st-owner').value.trim();DB.settings.phone=$('#st-phone').value.trim();save();render();toast('اتحفظ ✓')">حفظ ✓</button>
<div class="sec-title">قفل البرنامج</div>
${localStorage.getItem(PIN_KEY)?`<button class="set-row" onclick="openPinSheet('change')">${ic('lock')}<span>غيّر رقم القفل<span class="s" style="display:block">البرنامج متقفل — بيتفتح برقمك بس</span></span></button>
<button class="set-row" style="color:var(--red)" onclick="openPinSheet('remove')">${ic('x')}<span>شيل القفل</span></button>`:`<button class="set-row" onclick="openPinSheet('set')">${ic('lock')}<span>اقفل البرنامج برقم<span class="s" style="display:block">كل ما تفتح البرنامج هيطلب الرقم — تأمين لبياناتك لو حد مسك الموبايل</span></span></button>`}
<div class="sec-title">المتجر الإلكتروني</div>
${shopSettingsHTML()}
<div class="sec-title">النسخ الاحتياطي</div>
<button class="set-row" onclick="exportData()">${ic('download')}<span>نزّل نسخة احتياطية<span class="s" style="display:block">ملف فيه كل بياناتك — نزّله كل فترة وابعته لنفسك واتساب</span></span></button>
<button class="set-row" onclick="document.getElementById('imp-file').click()">${ic('upload')}<span>رجّع نسخة احتياطية<span class="s" style="display:block">لو غيرت الموبايل أو مسحت المتصفح</span></span></button>
<input type="file" id="imp-file" accept=".json,application/json" style="display:none" onchange="importData(this)">
<div class="sec-title">التقارير (Excel)</div>
<button class="set-row" onclick="exportProducts()">${ic('download')}<span>المخزون والأصناف<span class="s" style="display:block">كل الأصناف بالأسعار والكميات — يفتح في Excel</span></span></button>
<button class="set-row" onclick="exportInvoices()">${ic('download')}<span>الفواتير والمبيعات<span class="s" style="display:block">كل فاتورة بتاريخها وقيمتها وربحها</span></span></button>
<button class="set-row" onclick="exportPurchases()">${ic('download')}<span>التوريدات<span class="s" style="display:block">كل البضاعة اللي دخلت من الموردين</span></span></button>
<button class="set-row" onclick="exportParties()">${ic('download')}<span>أرصدة الزباين والموردين<span class="s" style="display:block">مين عليه كام ومين لك عنده</span></span></button>
<div class="sec-title">منطقة الخطر</div>
<button class="set-row" style="color:var(--red)" onclick="openResetSheet()">${ic('trash')}<span>امسح كل البيانات وابدأ من جديد</span></button>
<div style="text-align:center;color:var(--muted);font-size:11px;margin-top:18px;font-weight:600">محلي — إدارة المحل · النسخة التانية · بياناتك متخزنة على جهازك بس</div>
</div>`+navbar('home');}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='نسخة-احتياطية-'+todayStr()+'.json';a.click();toast('النسخة نزلت ✓');}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.settings)throw 0;if(!d.drafts)d.drafts=[];if(!d.nextNum)d.nextNum=1001;DB=d;save();render();toast('النسخة رجعت ✓');}catch(e){toast('الملف ده مش نسخة صحيحة');}};
r.readAsText(f);}
function openResetSheet(){
sheet('مسح كل البيانات',`
<div class="alert" style="margin-top:0;background:var(--red-soft);border-color:#EFC9C5"><span style="color:var(--red)">${ic('alert')}</span><div class="tx" style="color:var(--red)">ده هيمسح كل حاجة: الأصناف والفواتير والزباين والموردين والمسودات، ويرجع البرنامج للبداية من أول وجديد. مفيش رجوع بعدها.</div></div>
<div class="field" style="margin-top:13px"><div class="lbl">للتأكيد، اكتب الجملة دي: «امسح كل حاجه»</div><input id="reset-confirm" placeholder="امسح كل حاجه" autocomplete="off"></div>
<button class="btn btn-p" id="reset-go" style="background:var(--red);width:100%;opacity:.45" disabled onclick="doFullReset()">امسح كل حاجة وابدأ من جديد</button>
<button class="btn" style="background:var(--card);border:1px solid var(--line);width:100%;margin-top:8px" onclick="closeSheet()">لأ، ارجع</button>`);
const inp=$('#reset-confirm'),btn=$('#reset-go');
if(inp&&btn){inp.oninput=()=>{const okk=inp.value.trim().replace(/ة/g,'ه')==='امسح كل حاجه';btn.disabled=!okk;btn.style.opacity=okk?'1':'.45';};}
setTimeout(()=>inp&&inp.focus(),60);}
function doFullReset(){const inp=$('#reset-confirm');const okk=inp&&inp.value.trim().replace(/ة/g,'ه')==='امسح كل حاجه';
if(!okk){toast('اكتب الجملة صح الأول');return;}
closeSheet();DB=seed();save();invDraft=null;purDraft=null;go('#/');render();toast('اتمسح كل حاجة ورجعنا للبداية');}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadCSV(name,rows){const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+todayStr()+'.csv';a.click();toast('الملف نزل ✓ — يفتح في Excel');}
function exportProducts(){if(!DB.products.length){toast('مفيش أصناف');return;}
downloadCSV('المخزون',[['الصنف','الفئة','الوحدة','سعر الجملة','سعر القطاعي','التكلفة (آخر شراء)','الكمية'],...DB.products.map(p=>[p.name,p.cat,p.unit,p.wPrice,p.rPrice,p.cost,p.stock])]);}
function exportInvoices(){if(!DB.invoices.length){toast('لسه مفيش فواتير');return;}
const rows=[...DB.invoices].sort((a,b)=>a.num-b.num).map(i=>{const c=cust(i.customerId);const profit=i.items.reduce((s,it)=>s+(it.price-it.cost)*it.qty,0);
return[i.num,i.date.slice(0,10),c?c.name:'(زبون محذوف)',i.priceType==='w'?'جملة':'قطاعي',i.total,i.paid,i.total-i.paid,Math.round(profit*100)/100];});
downloadCSV('الفواتير',[['رقم الفاتورة','التاريخ','الزبون','النوع','الإجمالي','المدفوع','الباقي','الربح'],...rows]);}
function exportPurchases(){if(!DB.purchases.length){toast('لسه مفيش توريدات');return;}
const rows=[...DB.purchases].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(pu=>{const s=supp(pu.supplierId);
return[pu.date.slice(0,10),s?s.name:'(مورد محذوف)',pu.items.map(it=>it.name+' × '+fmt(it.qty)+' '+it.unit).join(' + '),pu.total,pu.paid,pu.total-pu.paid];});
downloadCSV('التوريدات',[['التاريخ','المورد','الأصناف','الإجمالي','المدفوع','الباقي'],...rows]);}
function exportParties(){const rows=[['الاسم','النوع','التليفون','الرصيد']];
DB.customers.forEach(c=>{const b=custBalance(c.id);rows.push([c.name,'زبون '+(c.type==='w'?'جملة':'قطاعي'),c.phone||'',b>0?'عليه '+b:'خالص']);});
DB.suppliers.forEach(s=>{const b=suppBalance(s.id);rows.push([s.name,'مورد',s.phone||'',b>0?'له '+b:'خالص']);});
if(rows.length===1){toast('مفيش زباين ولا موردين');return;}
downloadCSV('الأرصدة',rows);}
/* ============ router ============ */
function go(h){location.hash=h;}
function render(){const h=location.hash||'#/';const app=$('#app');
if(!unlocked){app.innerHTML=vLock();return;}
let html;
if(h==='#/'||h==='#'){closeSheet();html=vDash();}
else if(h==='#/products'){html=vProducts();}
else if(h==='#/customers'){html=vCustomers();}
else if(h.startsWith('#/customers/')){html=vCustDetail(h.split('/')[2]);}
else if(h==='#/suppliers'){html=vSuppliers();}
else if(h.startsWith('#/suppliers/')){html=vSuppDetail(h.split('/')[2]);}
else if(h==='#/invoice'){html=vInvoice(null);}
else if(h.startsWith('#/invoice/')){html=vInvoice(h.split('/')[2]);}
else if(h==='#/purchase'){html=vPurchase(null);}
else if(h.startsWith('#/purchase/')){html=vPurchase(h.split('/')[2]);}
else if(h==='#/settings'){html=vSettings();}
else if(h==='#/orders'){html=vOrders();}
else{html=vDash();}
app.innerHTML=html;window.scrollTo(0,0);
hydratePhotos();
if((h==='#/'||h==='#')&&SB.ready()&&Date.now()-shopOrdersAt>60000){refreshOrders(true);}}
window.addEventListener('hashchange',()=>{if(unlocked)render();});
if(unlocked){render();}else{$('#app').innerHTML=vLock();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
