<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C7A54">
<title>محلي — إدارة المحل</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F5F1E8;--card:#FFF;--line:#EAE2D3;--ink:#23201A;--muted:#8A8172;
--green:#1C7A54;--green-soft:#E4F1EA;--amber:#DE9A2B;--amber-soft:#FBF0DC;
--red:#C24A3E;--red-soft:#F9E7E5;--blue:#2F6296;--blue-soft:#E8EFF7;
}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Noto Sans Arabic',system-ui,sans-serif;background:#DDD6C7;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:92px;box-shadow:0 0 40px rgba(0,0,0,.08)}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.appbar{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar .hello{font-size:13px;color:var(--muted)}
.appbar .shop{font-size:19px;font-weight:800;margin-top:1px}
.appbar .back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:6px 0}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:none}
.content{padding:6px 16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-size:20px;font-weight:800;margin-top:4px}
.stat .val small{font-size:12px;font-weight:600;color:var(--muted)}
.stat .sub{font-size:10.5px;margin-top:3px;color:var(--muted)}
.stat.hero{background:var(--green);border-color:var(--green)}
.stat.hero .lbl,.stat.hero .sub{color:#CDE7DA}
.stat.hero .val{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec-title{font-size:14px;font-weight:800;margin:16px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.sec-title .more{font-size:12px;color:var(--green);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;text-align:center;display:block}
.act .ic{width:36px;height:36px;margin:0 auto 5px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.act .tx{font-size:11px;font-weight:800}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;width:100%;text-align:right}
button.row{cursor:pointer}
.row .ic{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.row .mid{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.row .end{text-align:left;flex-shrink:0}
.row .amt{font-size:14px;font-weight:800}
.row .amt small{font-size:10.5px;font-weight:600;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:3px}
.b-red{background:var(--red-soft);color:var(--red)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:#9A6A14}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.alert{background:var(--amber-soft);border:1px solid #F0D9AC;border-radius:14px;padding:10px 13px;display:flex;gap:10px;align-items:center;margin-top:10px}
.alert .tx{font-size:12px;font-weight:600;color:#7A5A15;line-height:1.6}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:74px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:9px;z-index:20}
.nav-it{text-align:center;width:58px;color:var(--muted)}
.nav-it .ic{display:flex;align-items:center;justify-content:center;height:24px}
.nav-it .tx{font-size:10px;font-weight:800;margin-top:2px}
.nav-it.on{color:var(--green)}
.fab{width:52px;height:52px;border-radius:18px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:-26px auto 0;box-shadow:0 6px 14px rgba(28,122,84,.35)}
.fab-wrap{text-align:center;width:58px}
.fab-wrap .tx{font-size:10px;font-weight:800;color:var(--green);margin-top:3px}
.field{margin-bottom:13px}
.field .lbl{font-size:12.5px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.seg{display:flex;background:#EDE7DA;border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:800;color:var(--muted);border-radius:9px}
.seg button.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.item-row .qty{display:flex;align-items:center;gap:9px;background:#F1ECE1;border-radius:10px;padding:5px 9px}
.item-row .qty .n{font-size:14px;font-weight:800;min-width:18px;text-align:center}
.item-row .qty button{font-size:16px;color:var(--green);font-weight:800;width:22px;height:22px}
.add-item{border:1.5px dashed #CFC5B0;border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:800;color:var(--green);width:100%;margin-bottom:8px}
.total-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0}
.trow .k{color:var(--muted);font-weight:600}
.trow.grand{border-top:1px dashed var(--line);margin-top:6px;padding-top:11px;font-size:16px;font-weight:800}
.trow .paid{color:var(--green);font-weight:800}
.trow .due{color:var(--red);font-weight:800}
.trow input{width:110px;background:#F7F3EA;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:800;text-align:left;outline:none}
.cost-in{width:74px;background:#F7F3EA;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:13px;font-weight:800;text-align:center;outline:none;color:var(--ink);font-family:inherit}
.cost-in:focus{border-color:var(--green)}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px;z-index:15}
.btn{flex:1;border-radius:16px;padding:14px 0;text-align:center;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--green);color:#fff}
.btn-s{background:var(--card);border:1px solid var(--line);flex:0 0 140px}
.btn-danger{background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px;font-weight:800;width:100%;margin-top:8px}
.cust-head{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;text-align:center}
.cust-head .av{width:50px;height:50px;border-radius:18px;background:var(--blue-soft);color:var(--blue);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.cust-head .nm{font-size:16.5px;font-weight:800}
.cust-head .ph{font-size:12px;color:var(--muted);margin-top:3px;direction:ltr}
.bal{margin-top:11px;border-radius:14px;padding:10px;text-align:center}
.bal.owed{background:var(--red-soft);border:1px solid #EFC9C5}
.bal.owed .k{color:var(--red)}
.bal.owed .v{color:var(--red)}
.bal.clear{background:var(--green-soft);border:1px solid #C6E2D2}
.bal.clear .k{color:var(--green)}
.bal.clear .v{color:var(--green)}
.bal .k{font-size:12px;font-weight:700}
.bal .v{font-size:25px;font-weight:800;margin-top:1px}
.bal .v small{font-size:13px;font-weight:600}
.cbtns{display:flex;gap:8px;margin-top:11px}
.cbtn{flex:1;border-radius:12px;padding:11px 4px;text-align:center;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.overlay{position:fixed;inset:0;background:rgba(35,32,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet .st{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center}
.sheet .x{position:absolute;left:16px;top:14px;color:var(--muted)}
.sheet-wrap{position:relative}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;font-weight:600}
.empty .big{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.set-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;margin-bottom:8px;width:100%;text-align:right;font-size:13.5px;font-weight:800}
.set-row .s{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.lockwrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px;width:100%;max-width:340px;text-align:center}
.lockcard .lk{width:56px;height:56px;border-radius:20px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.lockcard h2{font-size:18px;font-weight:800}
.lockcard p{font-size:12.5px;color:var(--muted);margin:5px 0 16px;font-weight:600}
.lockcard input{width:100%;background:#F7F3EA;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:20px;font-weight:800;text-align:center;letter-spacing:6px;outline:none;color:var(--ink)}
.lockcard input:focus{border-color:var(--green)}
.user-pick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#F7F3EA;font-weight:800;font-size:15px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-family:inherit}
.user-pick.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord .onm{font-size:14px;font-weight:800}
.ord .otm{font-size:11px;color:var(--muted);font-weight:600}
.ord .oitems{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-top:10px}
.ord .oitem{display:flex;align-items:baseline;gap:7px;font-size:12.5px;font-weight:600;padding:3.5px 0}
.ord .oitem+.oitem{border-top:1px dashed var(--line)}
.ord .oitem .q{color:var(--green);font-weight:800;flex-shrink:0}
.ord .oitem .nm{flex:1;min-width:0}
.ord .oitem .pr{color:var(--muted);font-weight:700;font-size:11.5px;flex-shrink:0}
.ord .ometa{margin:7px 0 1px}
.odelv{font-size:12px;color:var(--muted);font-weight:700;margin-top:7px}
.ochip{display:inline-block;background:var(--green-soft);color:var(--green);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:800;margin-inline-end:5px}
.oaddr{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--muted);font-weight:600;margin-top:9px;line-height:1.7}
.ord .oaddr .i{width:15px;height:15px;margin-top:2px}
.ord .ofoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ord .oamt{font-size:17px;font-weight:800}
.ord .oamt small{font-size:11px;color:var(--muted);font-weight:600}
.ord .oph{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--blue);text-decoration:none;direction:ltr}
.ord .obt{display:flex;gap:8px;margin-top:10px}
.ord .obt>*{flex:1;border-radius:10px;padding:9px 0;font-size:12px;font-weight:800}
.ord .ob-ed{background:var(--blue-soft);color:var(--blue)}
.ord .ob-del{flex:0 0 42px;background:var(--card);border:1px solid var(--line);color:var(--red);display:flex;align-items:center;justify-content:center}
.ord .ob-ok{background:var(--green);color:#fff}
.ord .ob-no{background:var(--red-soft);color:var(--red)}
.ord .ob-wa{background:var(--green-soft);color:var(--green);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:4px}
.ord.done{opacity:.6}
.pimg{width:38px;height:38px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--green-soft)}
.crop-frame{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:#17150F;touch-action:none;user-select:none}
.crop-frame img{position:absolute;max-width:none;pointer-events:none}
.photo-pick{width:100%;aspect-ratio:1;border-radius:16px;border:1.5px dashed #CFC5B0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;overflow:hidden;position:relative}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .ov{position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(35,32,26,.75);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px}
#print-area{display:none}
/* شاشات كبيرة (لابتوب/ديسكتوب): البرنامج يوسّع مع عرض الصفحة */
@media(min-width:768px){
#app{max-width:1000px;padding-bottom:110px}
.navbar{max-width:1000px}
.cta{max-width:1000px}
.sheet{max-width:620px}
.content{padding:6px 24px 0}
.grid2{grid-template-columns:repeat(4,1fr)}
#plist{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-content:start}
#plist .row{margin-bottom:10px}
}
@media(min-width:1300px){
#app{max-width:1200px}
.navbar{max-width:1200px}
.cta{max-width:1200px}
#plist{grid-template-columns:repeat(3,1fr)}
}
@media print{
  body>*{display:none!important}
  #print-area{display:block!important;background:#fff;color:#000;font-family:'Cairo',sans-serif}
  #print-area{padding:10px;direction:rtl}
}
.p-head{text-align:center;border-bottom:2px dashed #999;padding-bottom:8px;margin-bottom:10px}
.p-head h1{font-size:18px}
.p-head p{font-size:12px;color:#333}
table.p-items{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.p-items th,table.p-items td{border:1px solid #999;padding:6px;text-align:right}
.p-tot{font-size:14px;margin-top:8px}
.p-foot{text-align:center;font-size:11px;color:#555;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<div id="print-area"></div>
<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const AR='ar-EG';
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString(AR,{maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,]/g,''));return isNaN(n)?0:n;};
const todayStr=()=>new Date().toISOString().slice(0,10);
function relDate(iso){const d=new Date(iso),t=new Date();const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()),tt=new Date(t.getFullYear(),t.getMonth(),t.getDate());const diff=Math.round((tt-dd)/86400000);
if(diff===0)return'النهاردة';if(diff===1)return'أمبارح';if(diff<7)return'من '+diff.toLocaleString(AR)+' أيام';if(diff<30)return'من '+Math.floor(diff/7).toLocaleString(AR)+' أسبوع';return d.toLocaleDateString(AR,{day:'numeric',month:'long'});}
const sameMonth=iso=>{const d=new Date(iso),t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth();};
const isToday=iso=>new Date(iso).toDateString()===new Date().toDateString();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function payLabel(k){return {cash:'💵 نقدي',vf:'فودافون كاش',insta:'إنستاباي',bank:'تحويل بنكي'}[k]||esc(k);}
function waLink(phone,text){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='2'+p;if(p.length===11&&p.startsWith('20'))p='2'+p;if(!p)return null;return 'https://wa.me/'+p+'?text='+encodeURIComponent(text);}
/* ============ icons ============ */
const IC={
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-5.5h5V21"/>',
box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>',
users:'<circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c.8-3.4 3.3-4.9 6.2-4.9s5.4 1.5 6.2 4.9"/><circle cx="17" cy="9" r="2.6"/><path d="M16.8 14.8c2.4.3 4.1 1.7 4.7 4.1"/>',
truck:'<rect x="2" y="6" width="12" height="10" rx="1"/><path d="M14 10h4.2l2.8 3v3h-7"/><circle cx="7" cy="18.2" r="1.8"/><circle cx="17" cy="18.2" r="1.8"/>',
receipt:'<path d="M5 3h14v18l-2.3-1.7-2.4 1.7-2.3-1.7-2.3 1.7-2.4-1.7L5 21z"/><path d="M9 8.5h6"/><path d="M9 12.5h6"/>',
cash:'<rect x="2.5" y="7" width="19" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.8"/><path d="M6.2 10.4h.01"/><path d="M17.8 14.6h.01"/>',

 st=r.status;j=await r.json().catch(()=>({}));}catch(e){toast('في مشكلة في الاتصال — جرب تاني');return;}
if(st!==200){toast(j.error_description==='Email not confirmed'?'الإيميل ده محتاج تأكيد — شوف إيميلك أو كلّم الدعم':(st===400?'الإيميل أو الباسورد غلط':'في مشكلة في الاتصال — جرب تاني'));return;}
authSet({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user&&j.user.id,email:em});

 authSet(null);toast('في مشكلة في الاتصال — جرب تاني');return null;}

async function saveUser(id,legacyId){const name=($('#uf-name')?.value||'').trim();
if(!name){toast('اكتب الاسم');return;}
const perms={};PERMS.forEach(([k])=>{const el=document.getElementById('uf-p-'+k);perms[k]=el&&el.checked?1:0;});
if(id){try{await SB.ensureSession();
  await SB.req('shop_users?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({name,perms,updated_at:new Date().toISOString()})});
  usersCache=null;closeSheet();render();toast('اتحفظ ✓');}catch(e){toast(e.message==='no-auth'?'سجّل دخولك تاني':'في مشكلة في الاتصال — جرب تاني');}
 return;}
const email=($('#uf-email')?.value||'').trim();const pass=$('#uf-pass')?.value||'';
if(!email.includes('@')){toast('اكتب إيميل صحيح');return;}
if(pass.length<6){toast('الباسورد لازم ٦ حروف أو أرقام على الأقل');return;}
SB.load();const base=(SB.cfg.url||SB_DEF.url).replace(/\/$/,''),anon=SB.cfg.anon||SB_DEF.anon;
let j,st;try{const r=await fetch(base+'/auth/v1/signup',{method:'POST',headers:{'apikey':anon,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
 st=r.status;j=await r.json().catch(()=>({}));}catch(e){toast('في مشكلة في الاتصال — جرب تاني');return;}
if(st!==200){const msg=(j.msg||j.error_description||j.error||'').toLowerCase();const code=((j.error_code||j.code)||'')+'';
 const why=msg.includes('already')||code.includes('already')?'الإيميل ده متسجل قبل كده — اختار إيميل تاني'
  :(code.includes('signup_disabled')||msg.includes('signups not allowed'))?'إنشاء الحسابات مقفول من سوبابيز — من Supabase افتح Authentication ← Providers ← Email وشغّل "Allow new users to sign up"'
  :(code.includes('weak_password')||msg.includes('password'))?'الباسورد ضعيف — خليه ٦ حروف أو أرقام على الأقل'
  :(st===429||code.includes('rate_limit'))?'محاولات كتير — استنى دقيقة وجرب تاني'
  :'مشكلة في إنشاء الحساب — جرب تاني';
 toast(why);return;}
const newUid=j.id||(j.user&&j.user.id);
if(!newUid){toast('مشكلة في إنشاء الحساب — جرب تاني');return;}
try{await SB.ensureSession();
 await SB.req('shop_users',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify([{id:uid(),name,auth_id:newUid,owner:false,active:true,perms,updated_at:new Date().toISOString()}])});
}catch(e){toast('الحساب اتسجل بس الربط فشل — جرب تضيفه تاني');return;}
if(legacyId){const l=DB.users.find(x=>x.id===legacyId);if(l){l.__converted=true;save();}}
usersCache=null;
const needsConfirm=!!(j.confirmation_sent_at||(j.user&&j.user.confirmation_sent_at));
closeSheet();render();
toast(needsConfirm?'المستخدم اتضاف ✓ — ملحوظة: تأكيد الإيميل شغال في سوبابيز، طفّيه من الإعدادات عشان يقدر يدخل':'المستخدم اتضاف ✓ — يسجل دخوله بالإيميل والباسورد من أي جهاز');}
async function toggleUser(id){const u=(usersCache||[]).find(x=>String(x.id)===String(id));if(!u||u.owner)return;
try{await SB.ensureSession();

const prod=id=>DB.products.find(p=>p.id===id);
const cust=id=>DB.customers.find(c=>c.id===id);
const supp=id=>DB.suppliers.find(s=>s.id===id);
function custBalance(cid){let b=0;DB.invoices.filter(i=>i.customerId===cid).forEach(i=>b+=i.total-i.paid);DB.payments.filter(p=>p.partyType==='c'&&p.partyId===cid&&p.kind==='in').forEach(p=>b-=p.amount);return Math.round(b*100)/100;}
function suppBalance(sid){let b=0;DB.purchases.filter(i=>i.supplierId===sid).forEach(i=>b+=i.total-i.paid);DB.payments.filter(p=>p.partyType==='s'&&p.partyId===sid&&p.kind==='out').forEach(p=>b-=p.amount);return Math.round(b*100)/100;}
function totals(){let salesToday=0,profitMonth=0,receivables=0,payables=0;
DB.invoices.forEach(inv=>{if(isToday(inv.date))salesToday+=inv.total;
 if(sameMonth(inv.date))inv.items.forEach(it=>profitMonth+=(it.price-it.cost)*it.qty);});
DB.customers.forEach(c=>{const b=custBalance(c.id);if(b>0)receivables+=b;});
DB.suppliers.forEach(s=>{const b=suppBalance(s.id);if(b>0)payables+=b;});
return{salesToday,profitMonth,receivables,payables};}
function activity(){const a=[];
DB.invoices.forEach(i=>a.push({date:i.date,kind:'inv',text:'فاتورة لـ'+(cust(i.customerId)?.name||'زبون محذوف'),amt:i.total,left:i.total-i.paid,ref:i.id}));
DB.payments.filter(p=>p.kind==='in').forEach(p=>a.push({date:p.date,kind:'pay',text:(p.amount<0?'خصم من رصيد ':'دفعة من ')+(cust(p.partyId)?.name||'زبون محذوف'),amt:p.amount,ref:p.id}));
DB.payments.filter(p=>p.kind==='out').forEach(p=>a.push({date:p.date,kind:'payout',text:'دفعة لـ'+(supp(p.partyId)?.name||'مورد محذوف'),amt:p.amount,ref:p.id}));
DB.purchases.forEach(pu=>a.push({date:pu.date,kind:'pur',text:'توريد من '+(supp(pu.supplierId)?.name||'مورد محذوف'),amt:pu.total,left:pu.total-pu.paid,ref:pu.id}));
return a.sort((x,y)=>new Date(y.date)-new Date(x.date));}

function invItemRow(it,i){const p=prod(it.productId);return `<div class="item-row"><div class="mid"><div class="t">${esc(it.name)}</div><div class="s">${fmt(it.price)} ج لل${esc(it.unit)}${p?` · متاح ${fmt(p.stock)}`:''}</div></div>
<div class="qty"><button onclick="chQty(${i},1)">＋</button><span class="n">${fmt(it.qty)}</span><button onclick="chQty(${i},-1)">−</button></div>
<div class="amt" style="width:60px;text-align:left">${fmt(it.qty*it.price)}</div>
<button style="color:var(--red)" onclick="invDraft.items.splice(${i},1);render()">${ic('trash',18)}</button></div>`;}
function chQty(i,d){const it=invDraft.items[i];it.qty=Math.max(1,(+it.qty||1)+d);render();}
function invPayMath(d,m){const paid=num(d.paid);const c=d.customerId?cust(d.customerId):null;const credit=c?Math.max(-custBalance(c.id),0):0;const use=d.useCredit!==false&&credit>0;const applied=use?Math.min(credit,Math.max(m.total-paid,0)):0;const left=Math.round(Math.max(m.total-paid-applied,0)*100)/100;const over=Math.round(Math.max(paid+applied-m.total,0)*100)/100;return{paid,credit,applied,left,over,use};}
function payLeftText(pm){return pm.left>0?(fmt(pm.left)+' جنيه'):(pm.over>0?('خالص ✓ + رصيد له '+fmt(pm.over)+' ج'):'خالص ✓');}
function updInvTotals(){const m=invMath(invDraft);const pm=invPayMath(invDraft,m);const el=$('#inv-left');if(el)el.textContent=payLeftText(pm);const s=$('#inv-sub');if(s)s.textContent=fmt(m.sub)+' جنيه';const r=$('#inv-math');if(r)r.innerHTML=invMathRows(m);const cr=$('#inv-credit-row');if(cr)cr.style.display=pm.credit>0?'':'none';}
function openPickProduct(){if(!DB.products.length){toast('ضيف أصناف الأول');return;}
sheet('اختار صنف',`<div class="search" style="margin-top:0">${ic('search',18)}<input id="pp-q" placeholder="دوّر…" oninput="pickFilter(this.value)"></div><div id="pp-list">${pickListHTML('')}</div>`);setTimeout(()=>$('#pp-q')?.focus(),50);}
function pickListHTML(q){return DB.products.filter(p=>!q||p.name.includes(q)).map(p=>`<button class="row" style="margin-bottom:6px" onclick="pickProduct('${p.id}')"><div class="mid"><div class="t">${esc(p.name)}</div><div class="s">${invDraft.priceType==='w'?fmt(p.wPrice):fmt(p.rPrice)} ج · متاح ${fmt(p.stock)} ${esc(p.unit)}</div></div>${ic('plus',18)}</button>`).join('')||'<div class="empty">مفيش نتايج</div>';}
function pickFilter(q){$('#pp-list').innerHTML=pickListHTML(q);}
function pickProduct(pid){const p=prod(pid);if(!p)return;const ex=invDraft.items.find(it=>it.productId===pid);
if(ex){ex.qty+=1;}else{invDraft.items.push({productId:pid,name:p.name,unit:p.unit,qty:1,price:invDraft.priceType==='w'?p.wPrice:p.rPrice,cost:p.cost});}
closeSheet();render();}
function saveInvoice(andPrint){const d=invDraft;if(!d.customerId){toast('اختار الزبون الأول');return;}
if(!d.items.length){toast('ضيف صنف واحد على الأقل');return;}
for(const it of d.items){const p=prod(it.productId);if(p&&it.qty>p.stock){toast(`الكمية من "${it.name}" أكبر من المتاح (${fmt(p.stock)})`);return;}}
const m=invMath(d);const total=m.total;const pm=invPayMath(d,m);const paid=Math.round((pm.paid+pm.applied)*100)/100;
const inv={id:uid(),num:DB.nextNum++,date:new Date().toISOString(),customerId:d.customerId,priceType:d.priceType,items:d.items.map(it=>({...it})),discPct:m.discPct,taxPct:m.taxPct,discAmt:m.discAmt,taxAmt:m.taxAmt,total,paid,creditUsed:pm.applied||0};
d.items.forEach(it=>{const p=prod(it.productId);if(p){const b=p.stock;p.stock=Math.round((p.stock-it.qty)*100)/100;logMove(p.id,'sale',-it.qty,b,p.stock,'فاتورة #'+inv.num);}});
DB.invoices.push(inv);if(pm.applied>0)DB.payments.push({id:uid(),kind:'in',partyType:'c',partyId:d.customerId,amount:-pm.applied,note:'خصم من رصيده في فاتورة #'+inv.num.toLocaleString(AR),date:new Date().toISOString()});if(d._draftId){DB.drafts=DB.drafts.filter(x=>x.id!==d._draftId);}save();
const preset=d._preset;invDraft=null;
if(andPrint){printInvoice(inv);setTimeout(()=>window.print(),80);}
go(preset?'#/customers/'+preset:'#/');toast(pm.over>0?('الفاتورة اتحفظت ✓ — '+fmt(pm.over)+' ج زيادة اتحطت رصيد للزبون'):'الفاتورة اتحفظت ✓');}
function printInvoice(inv){const c=cust(inv.customerId);$('#print-area').innerHTML=`
<div class="p-head"><h1>${esc(DB.settings.shopName)}</h1><p>فاتورة رقم #${inv.num} · ${new Date(inv.date).toLocaleDateString(AR,{day:'numeric',month:'long',year:'numeric'})}</p><p>الزبون: ${esc(c?.name||'')} (${inv.priceType==='w'?'جملة':'قطاعي'})</p></div>
<table class="p-items"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>القيمة</th></tr>
${inv.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${fmt(it.qty)} ${esc(it.unit)}</td><td>${fmt(it.price)}</td><td>${fmt(it.qty*it.price)}</td></tr>`).join('')}${inv.deliveryFee>0?`<tr><td>توصيل (دليفري)</td><td>—</td><td>—</td><td>${fmt(inv.deliveryFee)}</td></tr>`:''}</table>
<div class="p-tot">${(inv.discAmt>0||inv.taxAmt>0)?`الإجمالي: ${fmt(Math.round((inv.items.reduce((s,it)=>s+it.qty*it.price,0)+(inv.deliveryFee||0))*100)/100)} جنيه<br>`:''}${inv.discAmt>0?`خصم ${fmt(inv.discPct)}٪: −${fmt(inv.discAmt)} جنيه<br>`:''}${inv.taxAmt>0?`ضريبة ${fmt(inv.taxPct)}٪: +${fmt(inv.taxAmt)} جنيه<br>`:''}${(inv.discAmt>0||inv.taxAmt>0)?`الصافي: ${fmt(inv.total)} جنيه<br>`:`الإجمالي: ${fmt(inv.total)} جنيه<br>`}المدفوع: ${fmt(inv.paid)} جنيه${inv.creditUsed>0?` (منها ${fmt(inv.creditUsed)} ج من رصيده)`:''}<br><b>الباقي: ${fmt(Math.max(inv.total-inv.paid,0))} جنيه</b>${inv.paid>inv.total?`<br>رصيد للزبون عند المحل: ${fmt(Math.round((inv.paid-inv.total)*100)/100)} جنيه`:''}</div>
<div class="p-foot">شكراً لتعاملكم معانا — ${esc(DB.settings.shopName)}</div>`;}
function printInvoiceById(id){const inv=DB.invoices.find(i=>i.id===id);if(!inv)return;printInvoice(inv);setTimeout(()=>window.print(),80);}
function printStatement(type,id){const isC=type==='c';const x=isC?cust(id):supp(id);if(!x)return;
const bal=isC?custBalance(id):suppBalance(id);const rows=[];

else{DB.purchases.filter(i=>i.supplierId===id).forEach(i=>rows.push({date:i.date,text:'توريد'+(i.paid>0?' (اتدفع منه '+fmt(i.paid)+' ج)':''),debit:i.total-i.paid,credit:0}));

$('#print-area').innerHTML=`
<div class="p-head"><h1>${esc(DB.settings.shopName)}</h1><p>كشف حساب ${isC?'زبون':'مورد'}: ${esc(x.name)} · ${new Date().toLocaleDateString(AR,{day:'numeric',month:'long',year:'numeric'})}</p></div>
<table class="p-items"><tr><th>التاريخ</th><th>البيان</th><th>${isC?'عليه':'له'}</th><th>${isC?'دفع':'سددنا'}</th></tr>
${rows.length?rows.map(r=>`<tr><td>${new Date(r.date).toLocaleDateString(AR,{day:'numeric',month:'numeric'})}</td><td>${esc(r.text)}</td><td>${r.debit?fmt(r.debit):''}</td><td>${r.credit?fmt(r.credit):''}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center">لسه مفيش حركات</td></tr>`}</table>
<div class="p-tot"><b>${bal>0?(isC?'الباقي عليه: ':'الباقي له: ')+fmt(bal)+' جنيه':(bal<0&&isC?'له رصيد عند المحل: '+fmt(-bal)+' جنيه':'الحساب خالص ✓')}</b></div>
<div class="p-foot">${esc(DB.settings.shopName)}</div>`;
setTimeout(()=>window.print(),80);}
/* ============ invoice drafts ============ */

const data={customerId:d.customerId||'',priceType:d.priceType,items:d.items.map(it=>({...it})),paid:d.paid||'',disc:d.disc||'',tax:d.tax||'',useCredit:d.useCredit!==false};

<button class="add-item" onclick="openPickPurProduct()">＋ ضيف صنف دخل المحل</button>

</div>
<div class="cta"><button class="btn btn-p" onclick="savePurchase()">حفظ التوريد ✓</button></div>`;}
function chPQty(i,d){const it=purDraft.items[i];it.qty=Math.max(1,(+it.qty||1)+d);render();}
function updPurTotals(){const d=purDraft;if(!d)return;const total=d.items.reduce((s,it)=>s+it.qty*num(it.cost),0);
const te=$('#pur-total');if(te)te.textContent=fmt(total)+' جنيه';
const le=$('#pur-left');if(le)le.textContent=fmt(Math.max(total-num(d.paid),0))+' جنيه';

function openPickPurProduct(){
sheet('اختار الصنف اللي اتورّد',`<div class="search" style="margin-top:0">${ic('search',18)}<input placeholder="دوّر…" oninput="$('#ppp-list').innerHTML=pickPurListHTML(this.value)"></div><div id="ppp-list">${pickPurListHTML('')}</div><button class="add-item" style="margin-top:4px;color:#9A6A14" onclick="closeSheet();openProductSheet(null,true)">＋ صنف جديد لسه متسجلش</button>`);}
function pickPurListHTML(q){return DB.products.filter(p=>!q||p.name.includes(q)).map(p=>`<button class="row" style="margin-bottom:6px" onclick="pickPurProduct('${p.id}')"><div class="mid"><div class="t">${esc(p.name)}</div><div class="s">آخر شراء ${fmt(p.cost)} ج · متاح حالياً ${fmt(p.stock)}</div></div>${ic('plus',18)}</button>`).join('')||'<div class="empty">مفيش نتايج</div>';}
function pickPurProduct(pid){const p=prod(pid);if(!p)return;const ex=purDraft.items.find(it=>it.productId===pid);

function savePurchase(){const d=purDraft;if(!d.supplierId){toast('اختار المورد الأول');return;}
if(!d.items.length){toast('ضيف صنف واحد على الأقل');return;}
for(const it of d.items){it.cost=num(it.cost);if(it.cost<=0){toast('اكتب سعر الشراء لـ"'+it.name+'"');return;}}
const total=d.items.reduce((s,it)=>s+it.qty*it.cost,0);let paid=Math.min(num(d.paid),total);
d.items.forEach(it=>{const p=prod(it.productId);if(p){const b=p.stock;p.stock=Math.round((p.stock+it.qty)*100)/100;p.cost=it.cost;logMove(p.id,'in',it.qty,b,p.stock,'توريد');}});

save();const preset=d._preset;purDraft=null;
go(preset?'#/suppliers/'+preset:'#/');toast('التوريد اتحفظ ✓');}
/* ============ payment ============ */
function openPaymentSheet(kind,presetId){const isIn=kind==='in';const parties=isIn?DB.customers:DB.suppliers;
if(!parties.length){toast(isIn?'ضيف زبون الأول':'ضيف مورد الأول');return;}
sheet(isIn?'تسجيل دفعة من زبون':'تسجيل دفعة لمورد',`
<div class="field"><div class="lbl">${isIn?'الزبون':'المورد'}</div><select id="pay-party">
${parties.map(x=>{const bb=isIn?custBalance(x.id):suppBalance(x.id);const lbl=isIn?(bb>0?'عليه '+fmt(bb)+' ج':(bb<0?'له رصيد '+fmt(-bb)+' ج':'خالص')):('له '+fmt(Math.max(bb,0))+' ج');return `<option value="${x.id}" ${x.id===presetId?'selected':''}>${esc(x.name)} — ${lbl}</option>`;}).join('')}</select></div>
<div class="field"><div class="lbl">المبلغ</div><input id="pay-amt" inputmode="decimal" placeholder="٠"></div>
<div class="field"><div class="lbl">ملحوظة (اختياري)</div><input id="pay-note" placeholder="نقدي، فودافون كاش…"></div>
<button class="btn btn-p" style="width:100%" onclick="savePayment('${kind}')">سجّل الدفعة ✓</button>`);
setTimeout(()=>$('#pay-amt')?.focus(),60);}
function savePayment(kind){const pid=$('#pay-party').value;const amt=num($('#pay-amt').value);const note=$('#pay-note').value.trim();
if(amt<=0){toast('اكتب المبلغ');return;}
DB.payments.push({id:uid(),date:new Date().toISOString(),kind,partyId:pid,partyType:kind==='in'?'c':'s',amount:amt,note});
save();closeSheet();render();toast('الدفعة اتسجلت ✓');}

function openProductSheet(pid,fromPur){const p=pid?prod(pid):null;

async function saveProduct(pid,fromPur){const name=$('#fp-name').value.trim();if(!name){toast('اكتب اسم الصنف');return;}
const st=$('#fp-stock');
const data={name,cat:$('#fp-cat').value,unit:$('#fp-unit').value.trim()||'قطعة',wPrice:num($('#fp-w').value),rPrice:num($('#fp-r').value),cost:num($('#fp-cost').value),stock:st?num(st.value):0,lowAt:num($('#fp-low').value)};
const ph=pendingPhoto;pendingPhoto=null;
try{
if(pid){const p=prod(pid);if(st&&Math.round((num(st.value)-p.stock)*100)/100!==0){logMove(pid,'edit',Math.round((num(st.value)-p.stock)*100)/100,p.stock,num(st.value),'تعديل يدوي');}Object.assign(p,data);
 if(ph==='REMOVE'){await PHOTOS.del(pid).catch(()=>{});p.photo=0;p.photoVer=Date.now();if(photoURLs[pid]){URL.revokeObjectURL(photoURLs[pid]);delete photoURLs[pid];}}
 else if(ph&&ph.blob){await PHOTOS.set(pid,ph.blob);p.photo=1;p.photoVer=Date.now();photoObjUrl(pid,ph.blob);}
 save();closeSheet();render();toast('اتحفظ ✓');return;}
const np={id:uid(),...data};DB.products.push(np);if(np.stock>0)logMove(np.id,'open',np.stock,0,np.stock,'رصيد أول');
if(ph&&ph.blob){await PHOTOS.set(np.id,ph.blob);np.photo=1;np.photoVer=Date.now();photoObjUrl(np.id,ph.blob);}
save();closeSheet();
if(fromPur&&purDraft){purDraft.items.push({productId:np.id,name:np.name,unit:np.unit,qty:1,cost:np.cost});}
render();toast(fromPur?'الصنف اتضاف للتوريد ✓':'الصنف اتضاف ✓');
}catch(e){toast('حصلت مشكلة في حفظ الصورة — البيانات اتسجلت من غيرها');save();closeSheet();render();}}
function openPartySheet(type,pid,fromInvoice){const isC=type==='c';const x=pid?(isC?cust(pid):supp(pid)):null;

function saveParty(type,pid,fromInvoice){const isC=type==='c';const name=$('#ft-name').value.trim();if(!name){toast('اكتب الاسم');return;}
const phone=$('#ft-phone').value.trim();
let id=pid;
if(pid){const x=isC?cust(pid):supp(pid);x.name=name;x.phone=phone;if(isC){const seg=$('#ft-seg button.on');if(seg)x.type=seg.dataset.v;}}
else{id=uid();const obj=isC?{id,name,phone,type:$('#ft-seg button.on')?.dataset.v||'w'}:{id,name,phone};(isC?DB.customers:DB.suppliers).push(obj);}
save();closeSheet();

render();toast('اتحفظ ✓');}

function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.settings)throw 0;if(!d.drafts)d.drafts=[];if(!d.nextNum)d.nextNum=1001;if(!Array.isArray(d.users))d.users=[];if(!Array.isArray(d.movements))d.movements=[];DB=d;save();curUser=null;sessionStorage.removeItem('mahal_cur');render();toast('النسخة رجعت ✓ — سجّل دخول من جديد');}catch(e){toast('الملف ده مش نسخة صحيحة');}};
r.readAsText(f);}
function openResetSheet(){if(!curUser||!curUser.owner){toast('ده للمالك بس');return;}
sheet('مسح كل البيانات',`
<div class="alert" style="margin-top:0;background:var(--red-soft);border-color:#EFC9C5"><span style="color:var(--red)">${ic('alert')}</span><div class="tx" style="color:var(--red)">ده هيمسح كل حاجة: الأصناف والفواتير والزباين والموردين والمسودات، ويرجع البرنامج للبداية من أول وجديد. مفيش رجوع بعدها.</div></div>
<div class="field" style="margin-top:13px"><div class="lbl">للتأكيد، اكتب الجملة دي: «امسح كل حاجه»</div><input id="reset-confirm" placeholder="امسح كل حاجه" autocomplete="off"></div>
<button class="btn btn-p" id="reset-go" style="background:var(--red);width:100%;opacity:.45" disabled onclick="doFullReset()">امسح كل حاجة وابدأ من جديد</button>
<button class="btn" style="background:var(--card);border:1px solid var(--line);width:100%;margin-top:8px" onclick="closeSheet()">لأ، ارجع</button>`);
const inp=$('#reset-confirm'),btn=$('#reset-go');
if(inp&&btn){inp.oninput=()=>{const okk=inp.value.trim().replace(/ة/g,'ه')==='امسح كل حاجه';btn.disabled=!okk;btn.style.opacity=okk?'1':'.45';};}
setTimeout(()=>inp&&inp.focus(),60);}
function doFullReset(){const inp=$('#reset-confirm');const okk=inp&&inp.value.trim().replace(/ة/g,'ه')==='امسح كل حاجه';
if(!okk){toast('اكتب الجملة صح الأول');return;}
closeSheet();DB=seed();save();invDraft=null;purDraft=null;curUser=null;sessionStorage.removeItem('mahal_cur');go('#/');render();toast('اتمسح كل حاجة ورجعنا للبداية — اعمل حساب المالك من جديد');}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadCSV(name,rows){const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+todayStr()+'.csv';a.click();toast('الملف نزل ✓ — يفتح في Excel');}
function exportProducts(){if(!DB.products.length){toast('مفيش أصناف');return;}
downloadCSV('المخزون',[['الصنف','الفئة','الوحدة','سعر الجملة','سعر القطاعي','التكلفة (آخر شراء)','الكمية'],...DB.products.map(p=>[p.name,p.cat,p.unit,p.wPrice,p.rPrice,p.cost,p.stock])]);}
function exportInvoices(){if(!DB.invoices.length){toast('لسه مفيش فواتير');return;}
const rows=[...DB.invoices].sort((a,b)=>a.num-b.num).map(i=>{const c=cust(i.customerId);const profit=i.items.reduce((s,it)=>s+(it.price-it.cost)*it.qty,0);
return[i.num,i.date.slice(0,10),c?c.name:'(زبون محذوف)',i.priceType==='w'?'جملة':'قطاعي',i.total,i.paid,i.total-i.paid,Math.round(profit*100)/100];});
downloadCSV('الفواتير',[['رقم الفاتورة','التاريخ','الزبون','النوع','الإجمالي','المدفوع','الباقي','الربح'],...rows]);}
function exportPurchases(){if(!DB.purchases.length){toast('لسه مفيش توريدات');return;}
const rows=[...DB.purchases].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(pu=>{const s=supp(pu.supplierId);
return[pu.date.slice(0,10),s?s.name:'(مورد محذوف)',pu.items.map(it=>it.name+' × '+fmt(it.qty)+' '+it.unit).join(' + '),pu.total,pu.paid,pu.total-pu.paid];});
downloadCSV('التوريدات',[['التاريخ','المورد','الأصناف','الإجمالي','المدفوع','الباقي'],...rows]);}
function exportParties(){const rows=[['الاسم','النوع','التليفون','الرصيد']];
DB.customers.forEach(c=>{const b=custBalance(c.id);rows.push([c.name,'زبون '+(c.type==='w'?'جملة':'قطاعي'),c.phone||'',b>0?'عليه '+b:(b<0?'له رصيد '+(-b):'خالص')]);});
DB.suppliers.forEach(s=>{const b=suppBalance(s.id);rows.push([s.name,'مورد',s.phone||'',b>0?'له '+b:'خالص']);});
if(rows.length===1){toast('مفيش زباين ولا موردين');return;}
downloadCSV('الأرصدة',rows);}
/* ============ router ============ */
function go(h){location.hash=h;}
function render(top){const h=location.hash||'#/';const app=$('#app');
if(!curUser){app.innerHTML=vLogin();return;}
let html;
if(h==='#/'||h==='#'){closeSheet();html=vDash();}
else if(h==='#/products'){html=can('products')?vProducts():vNoPerm();}
else if(h==='#/customers'){html=can('customers')?vCustomers():vNoPerm();}
else if(h.startsWith('#/customers/')){html=can('customers')?vCustDetail(h.split('/')[2]):vNoPerm();}
else if(h==='#/suppliers'){html=can('suppliers')?vSuppliers():vNoPerm();}
else if(h.startsWith('#/suppliers/')){html=can('suppliers')?vSuppDetail(h.split('/')[2]):vNoPerm();}
else if(h==='#/invoices'){html=can('invoice')?vInvoicesList():vNoPerm();}
else if(h.startsWith('#/inv/')){html=can('invoice')?vInvoiceDetail(h.split('/')[2]):vNoPerm();}
else if(h==='#/invoice'){html=can('invoice')?vInvoice(null):vNoPerm();}
else if(h.startsWith('#/invoice/')){html=can('invoice')?vInvoice(h.split('/')[2]):vNoPerm();}
else if(h==='#/purchase'){html=can('suppliers')?vPurchase(null):vNoPerm();}
else if(h.startsWith('#/purchase/')){html=can('suppliers')?vPurchase(h.split('/')[2]):vNoPerm();}
else if(h==='#/settings'){html=vSettings();}
else if(h==='#/orders'){html=can('orders')?vOrders():vNoPerm();}
else if(h==='#/users'){html=vUsers();}
else{html=vDash();}
app.innerHTML=html;if(top)window.scrollTo(0,0);
hydratePhotos();
if((h==='#/'||h==='#')&&SB.ready()&&Date.now()-shopOrdersAt>60000){refreshOrders(true);}
if(Date.now()-lastSyncTick>45000){syncTick();}}
window.addEventListener('hashchange',()=>{render(true);});
setInterval(()=>{if(document.visibilityState==='visible')syncTick();},10000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncTick();else if(localStorage.getItem(DIRTY_KEY))pushCloudBackup(true);});
window.addEventListener('pagehide',()=>{if(localStorage.getItem(DIRTY_KEY))pushCloudBackup(true);});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(!window.__reloaded){window.__reloaded=true;window.__updating=true;location.reload();}});}
</script>
