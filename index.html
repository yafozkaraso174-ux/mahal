function cmRound(n,p=2){const f=10**p;return Math.round((Number(n)+Number.EPSILON)*f)/f;}
function cmActive(o,at=Date.now()){const a=o.startsAt?Date.parse(o.startsAt):-Infinity,b=o.endsAt?Date.parse(o.endsAt):Infinity;return !!(o.active&&!o.deleted&&Number.isFinite(Number(o.value))&&Number(o.value)>0&&a<=at&&at<=b);}
function cmQuote(offers,pid,base,at=Date.now()){base=Number(base);const found=(offers||[]).filter(o=>cmActive(o,at)&&(o.productIds||[]).includes(pid)).sort((a,b)=>String(a.id).localeCompare(String(b.id)));if(!found.length)return{price:base,original:base,offer:null};const o=found[0];const reduction=o.kind==='pct'?base*Math.min(100,Number(o.value))/100:Math.min(base,Number(o.value));const price=cmRound(Math.max(0,base-reduction),6);return{price,original:base,offer:{id:o.id,name:o.name,kind:o.kind,value:Number(o.value),original:base,price,startsAt:o.startsAt||null,endsAt:o.endsAt||null,quotedAt:new Date(at).toISOString()},conflict:found.length>1};}
function cmUnits(p){const c=p.unitConfig;if(!c)return[{id:'base',label:p.unit||'قطعة',factor:1}];const a=[{id:'base',label:c.base||p.unit,factor:1}];if(c.packLabel&&c.packFactor>0)a.push({id:'pack',label:c.packLabel,factor:Number(c.packFactor)});if(c.area>0)a.push({id:'area',label:'م²',factor:1/Number(c.area)});return a;}
function cmQuantity(p,unitId,q){const c=p.unitConfig,u=cmUnits(p).find(x=>x.id===unitId);if(!u||!Number.isFinite(q)||q<=0)throw Error('اكتب كمية أكبر من صفر');const b=cmRound(q*u.factor,6);if(!c&&!Number.isInteger(q))throw Error('فعّل وحدات الوزن للصنف قبل إدخال كمية عشرية');if(c?.discrete&&Math.abs(b-Math.round(b))>0.000001)throw Error('الكمية مش عدد قطع صحيح. اختار قطع أو راجع الكراتين، مش هنقرب تلقائي.');if(!c?.discrete&&Math.abs(b*1000-Math.round(b*1000))>0.000001)throw Error('استخدم حتى ٣ خانات عشرية في وحدة المخزون');if(c?.wholePack&&unitId==='pack'&&!Number.isInteger(q))throw Error('اكتب عدد كراتين كامل، أو اختار قطع');return{unit:u,baseQty:c?.discrete?Math.round(b):cmRound(b,3)};}
function cmDetail(it){const c=it.commerce;if(!c)return[];let a=[];if(c.saleUnit){a.push('الكمية: '+c.saleQty+' '+c.saleUnit+(c.factor!==1?' = '+it.qty+' '+it.unit:'')+(c.areaQty?' = '+c.areaQty+' م²':''));a.push('السعر: '+cmRound(it.price*(c.factor||1),4)+' ج / '+c.saleUnit);}if(c.offer)a.push('خصم '+c.offer.name+': '+cmRound((c.offer.original-c.offer.price)*it.qty)+' ج، قبل الخصم '+cmRound(c.offer.original*it.qty)+' ج');if(c.invoiceDiscountReason)a.push('خصم الفاتورة: '+c.invoiceDiscountReason);return a;}

function cmNumber(v){const s=String(v).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٬/g,'').replace(/٫/g,'.');return /^-?(?:\d+\.?\d*|\.\d+)$/.test(s)?Number(s):NaN;}

/* ===== Optional commerce modules. Legacy invoice layout stays untouched. ===== */
function cmEnsure(){if(!Array.isArray(DB.offers))DB.offers=[];}
ENT.offers={table:'offers',ts:'updated_at',perms:null,map:o=>({id:o.id,data:o,deleted:!!o.deleted,updated_at:new Date().toISOString()}),unmap:r=>({...r.data,id:r.id,deleted:!!r.deleted})};
const cmProductMap=ENT.products.map,cmProductUnmap=ENT.products.unmap;
ENT.products.map=p=>{const r=cmProductMap(p);if(p.unitConfig)r.unit_config=p.unitConfig;return r;};
ENT.products.unmap=(r,o)=>{const p=cmProductUnmap(r,o);if(r.unit_config)p.unitConfig=r.unit_config;return p;};
function cmOwner(){return !!curUser?.owner;}
function cmSyncNote(){return `<div class="cm-note">${navigator.onLine?'متصل':'أوفلاين، السعر المحفوظ على الجهاز'} · عمليات منتظرة: ${fmt(outboxPending())}<br>تعديلات العروض والأسعار تصل للأجهزة الأخرى والمتجر بعد المزامنة، مش فورًا وهي مفصولة.</div>`;}
function cmField(id,label,value='',attrs=''){return `<div class="field"><div class="lbl">${label}</div><input id="${id}" aria-label="${label}" value="${esc(value)}" ${attrs}></div>`;}
function cmRoute(h){if(h==='#/offers')return vOffers();if(h==='#/sale')return can('invoice')?vCommerceSale():vNoPerm();if(h==='#/units')return can('products')?vUnitProducts():vNoPerm();return null;}
function vOffers(){cmEnsure();return appbar('أسعار وعروض محلك','عروض المحل',cmOwner()?`<button class="avatar" onclick="openOffer()">＋</button>`:'')+`<div class="content">${cmSyncNote()}${!cmOwner()?'<div class="cm-note">العروض للعرض، تعديلها لصاحب المحل فقط.</div>':''}${DB.offers.filter(o=>!o.deleted).map(o=>`<div class="total-card" style="margin:12px 0"><div class="trow"><b>${esc(o.name)}</b><span class="badge b-green">${o.active?(cmActive(o)?'شغّال':'مجدول / منتهي'):'موقوف'}</span></div><div>${o.kind==='pct'?fmt(o.value)+'٪':fmt(o.value)+' ج لكل '+esc(o.unit||'وحدة')}</div><div class="cm-note">${(o.productIds||[]).map(id=>esc(prod(id)?.name||'صنف محذوف')).join('، ')}<br>${o.startsAt?new Date(o.startsAt).toLocaleString(AR):'فورًا'} ← ${o.endsAt?new Date(o.endsAt).toLocaleString(AR):'بدون نهاية'}</div>${cmOwner()?`<button class="cbtn" onclick="openOffer('${o.id}')">تعديل العرض</button>`:''}</div>`).join('')||'<div class="empty">لسه مفيش عروض</div>'}<button class="btn btn-p" style="width:100%;margin-top:12px" onclick="go('#/sale')">بيع بعرض / وحدات</button></div>`+navbar('home');}
function openOffer(id){if(!cmOwner()){toast('تعديل العروض لصاحب المحل فقط');return;}cmEnsure();const o=DB.offers.find(x=>x.id===id)||{name:'',productIds:[],kind:'pct',value:'',active:true};sheet(id?'تعديل العرض':'عرض جديد',`${cmField('of-name','اسم العرض',o.name)}<div class="lbl">الأصناف (خصم المبلغ لكل وحدة مخزون)</div><div style="max-height:180px;overflow:auto;border:1px solid var(--line);padding:8px;border-radius:12px">${DB.products.filter(p=>!p.deleted).map(p=>`<label style="display:flex;gap:8px;padding:9px;font-size:13px"><input type="checkbox" name="of-product" value="${p.id}" ${o.productIds.includes(p.id)?'checked':''}>${esc(p.name)} (${esc(p.unit)})</label>`).join('')}</div><div class="field"><div class="lbl">نوع الخصم</div><select id="of-kind"><option value="pct" ${o.kind==='pct'?'selected':''}>نسبة ٪</option><option value="fixed" ${o.kind==='fixed'?'selected':''}>مبلغ لكل وحدة مخزون</option></select></div>${cmField('of-value','قيمة الخصم',o.value,'inputmode="decimal"')}${cmField('of-start','البداية (اختياري)',cmLocalDT(o.startsAt),'type="datetime-local"')}${cmField('of-end','النهاية (اختياري)',cmLocalDT(o.endsAt),'type="datetime-local"')}<label style="display:flex;gap:10px;margin:15px 0"><input id="of-active" type="checkbox" ${o.active?'checked':''}>العرض مفعّل</label><div class="cm-note">عرض واحد في نفس الفترة لكل صنف. السعر الأصلي والفواتير المحفوظة لا يتغيروا.</div><button class="btn btn-p" style="width:100%;margin-top:14px" onclick="saveOffer('${id||''}')">حفظ العرض ✓</button>`);}
function cmLocalDT(s){if(!s)return'';const d=new Date(s);if(!Number.isFinite(+d))return'';return new Date(+d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function saveOffer(id){if(!cmOwner())return;const g=k=>$('#of-'+k),name=g('name').value.trim(),ids=[...document.querySelectorAll('[name=of-product]:checked')].map(e=>e.value),kind=g('kind').value,value=cmNumber(g('value').value);const startsAt=g('start').value?new Date(g('start').value).toISOString():null,endsAt=g('end').value?new Date(g('end').value).toISOString():null,active=g('active').checked;if(!name||!ids.length||value<=0||!Number.isFinite(value)||(kind==='pct'&&value>100)){toast('راجع اسم العرض والأصناف وقيمة الخصم');return;}if(startsAt&&endsAt&&startsAt>=endsAt){toast('النهاية لازم بعد البداية');return;}const overlap=DB.offers.some(o=>o.id!==id&&o.active&&active&&!o.deleted&&o.productIds.some(x=>ids.includes(x))&&(!endsAt||!o.startsAt||endsAt>=o.startsAt)&&(!startsAt||!o.endsAt||startsAt<=o.endsAt));if(overlap){toast('في عرض مفعّل لنفس الصنف في الفترة دي، وقفه أو غيّر المواعيد');return;}const o={id:id||uid(),name,productIds:ids,kind,value,startsAt,endsAt,active};const i=DB.offers.findIndex(x=>x.id===id);if(i>=0)DB.offers[i]=o;else DB.offers.push(o);save();enqueue({type:'upsert',table:'offers',rowId:o.id,row:ENT.offers.map(o)});closeSheet();render();toast('العرض اتحفظ ✓');}
let cmDraft=null;
function cmNewDraft(){return{customerId:'',items:[],discount:0,discountReason:'',paid:'',suppressOffers:false};}
function cmSaleMath(d){const sub=cmRound(d.items.reduce((n,it)=>n+it.qty*it.price,0)),hasOffer=d.items.some(it=>it.commerce?.offer),discount=hasOffer?0:Math.min(sub,Math.max(0,num(d.discount)));return{sub,discount,total:cmRound(sub-discount),hasOffer};}
function vCommerceSale(){cmEnsure();if(!cmDraft)cmDraft=cmNewDraft();const d=cmDraft,m=cmSaleMath(d);return appbar('العروض والوزن والوحدات','بيع بعرض / وحدات',gearBtn())+`<div class="content" style="padding-bottom:110px">${cmSyncNote()}<div class="field"><div class="lbl">العميل</div><select id="cm-customer" onchange="cmDraft.customerId=this.value"><option value="">اختار العميل</option>${DB.customers.filter(c=>!c.deleted).map(c=>`<option value="${c.id}" ${d.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${d.items.map((it,i)=>`<div class="total-card" style="margin:12px 0"><div class="trow"><b>${esc(it.name)}</b><button onclick="cmDraft.items.splice(${i},1);render()">✕</button></div><div class="cm-note">${cmDetail(it).map(esc).join('<br>')}</div><div class="trow"><b>${fmt(it.qty*it.price)} ج</b><button class="cbtn" onclick="cmEditLine(${i})">تعديل الكمية / السعر</button></div></div>`).join('')}<button class="add-item" onclick="cmPick()">＋ ضيف صنف</button><div class="total-card"><div class="trow"><span>قبل خصم الفاتورة</span><b>${fmt(m.sub)} ج</b></div><button class="cbtn" style="margin:10px 0" onclick="cmDiscount()">${m.hasOffer?'🔒 خصم فاتورة (مش بيتجمع مع العرض)':'خصم فاتورة بسبب'}</button>${m.discount?`<div class="trow"><span>${esc(d.discountReason)}</span><b>−${fmt(m.discount)} ج</b></div>`:''}<div class="trow grand"><span>الصافي</span><b>${fmt(m.total)} ج</b></div></div>${cmField('cm-paid','المدفوع (فارغ = كامل المبلغ)',d.paid,'inputmode="decimal" oninput="cmDraft.paid=this.value"')}</div><div class="cta"><button class="btn btn-p" style="width:100%" onclick="cmSaveSale()">حفظ الفاتورة ✓</button></div>`;}
function cmPick(){sheet('اختار صنف',DB.products.filter(p=>!p.deleted&&p.stock>0&&!(isMobile()&&mobIsModel(p))).map(p=>{const q=cmQuote(DB.offers,p.id,p.rPrice);return `<button class="row" onclick="cmOpenQuantity('${p.id}')"><div class="mid"><b>${esc(p.name)}</b><div class="cm-note">${fmt(q.price)} ج / ${esc(p.unit)} ${q.offer?'· '+esc(q.offer.name):''}</div></div></button>`;}).join('')||'<div class="empty">مفيش أصناف متاحة، استلام الموبايل من بيع الأجهزة</div>');}
function cmEditLine(i){cmOpenQuantity(cmDraft.items[i].productId,i);}
function cmOpenQuantity(pid,i){const old=i==null?null:cmDraft.items[i],p=cmLineProduct(prod(pid),old),units=cmUnits(p),oldUnit=old?.commerce?.unitId||'base';sheet('كمية '+p.name,`<div class="field"><div class="lbl">وحدة البيع</div><select id="cm-unit" onchange="cmQuantityPreview('${pid}',${i??'null'})">${units.map(u=>`<option value="${u.id}" ${u.id===oldUnit?'selected':''}>${esc(u.label)}</option>`).join('')}</select></div>${cmField('cm-qty','الكمية',old?.commerce?.saleQty||1,`inputmode="decimal" oninput="cmQuantityPreview('${pid}',${i??'null'})"`)}<div id="cm-preview" class="total-card"></div><div class="cm-note">السعر محفوظ لحظة الإضافة. لو السعر الحالي اتغيّر، اختيار تحديثه صريح، مش تلقائي.</div>${old?`<button class="cbtn" style="margin:10px 0" onclick="cmAddLine('${pid}',${i},true)">تحديث لسعر وعرض الصنف الحالي</button>`:''}<button class="btn btn-p" style="width:100%;margin-top:12px" onclick="cmAddLine('${pid}',${i??'null'})">${old?'حفظ الكمية بالسعر المحفوظ':'إضافة للفاتورة'}</button>`);cmQuantityPreview(pid,i);}
function cmReadLine(pid,i,refresh){const old=i==null?null:cmDraft.items[i],p=refresh?prod(pid):cmLineProduct(prod(pid),old),q=cmNumber($('#cm-qty').value),unit=$('#cm-unit').value,r=cmQuantity(p,unit,q);let quote=old&&!refresh?{price:old.price,original:old.commerce?.offer?.original||old.price,offer:old.commerce?.offer||null}:cmQuote(cmDraft.suppressOffers?[]:DB.offers,pid,p.rPrice);if(quote.conflict)throw Error('في عروض متعارضة من المزامنة. صاحب المحل يوقف التعارض الأول');const c={saleQty:q,saleUnit:r.unit.label,unitId:unit,factor:r.unit.factor,offer:quote.offer?structuredClone(quote.offer):null,unitConfig:p.unitConfig?structuredClone(p.unitConfig):null};if(p.unitConfig?.area)c.areaQty=cmRound(r.baseQty*p.unitConfig.area,6);return{productId:pid,name:p.name,unit:p.unit,qty:r.baseQty,price:quote.price,cost:p.cost,commerce:c};}
function cmQuantityPreview(pid,i){try{const it=cmReadLine(pid,i),p=prod(pid);$('#cm-preview').innerHTML=`<b>${cmFmtQty(it.qty)} ${esc(it.unit)}${it.commerce.areaQty?' = '+cmFmtQty(it.commerce.areaQty)+' م²':''}</b><div class="cm-note">${cmDetail(it).map(esc).join('<br>')}<br>متاح ${cmFmtQty(p.stock)} ${esc(p.unit)}</div><b>${fmt(it.qty*it.price)} ج</b>`;}catch(e){$('#cm-preview').textContent=e.message;}}
function cmAddLine(pid,i,refresh=false){try{const it=cmReadLine(pid,i,refresh),other=cmDraft.items.reduce((s,x,j)=>s+(j!==i&&x.productId===pid?x.qty:0),0);if(other+it.qty>prod(pid).stock)throw Error('الكمية أكبر من المخزون المتاح');if(it.commerce.offer&&num(cmDraft.discount)>0)throw Error('في خصم فاتورة، شيله الأول أو كمّل من غير عروض');if(i==null){if(cmDraft.items.some(x=>x.productId===pid))throw Error('الصنف موجود، عدّل كميته من الفاتورة');cmDraft.items.push(it);}else cmDraft.items[i]=it;closeSheet();render();}catch(e){toast(e.message);}}
function cmDiscount(){if(cmSaleMath(cmDraft).hasOffer){sheet('مينفعش نجمع الخصمين',`<div class="cm-note">في عرض منتج بالفاتورة. اختار تفضل بالعرض أو تشيل العروض صراحة قبل خصم فاتورة.</div><button class="btn btn-p" style="width:100%;margin:14px 0" onclick="closeSheet()">الاحتفاظ بعرض المنتج</button><button class="btn btn-s" style="width:100%" onclick="cmRemoveOffers()">إزالة العروض واختيار خصم فاتورة</button>`);return;}sheet('خصم الفاتورة',`${cmField('cm-reason','سبب الخصم (مطلوب)',cmDraft.discountReason)}${cmField('cm-discount','قيمة الخصم بالجنيه',cmDraft.discount||'','inputmode="decimal"')}<div class="cm-note">الاسم والقيمة يظهروا في البيع والفاتورة والطباعة.</div><button class="btn btn-p" style="width:100%;margin-top:12px" onclick="cmSetDiscount()">حفظ الخصم</button>`);}
function cmRemoveOffers(){cmDraft.items.forEach(it=>{if(it.commerce?.offer){it.price=it.commerce.offer.original;it.commerce.offer=null;}});cmDraft.suppressOffers=true;closeSheet();cmDiscount();render();}
function cmSetDiscount(){const amount=cmNumber($('#cm-discount').value),reason=$('#cm-reason').value.trim();if(!Number.isFinite(amount)||amount<0||amount>cmSaleMath({...cmDraft,discount:0}).sub||(amount>0&&!reason)){toast('اكتب السبب وقيمة خصم لا تزيد عن الإجمالي');return;}cmDraft.discount=amount;cmDraft.discountReason=amount?reason:'';closeSheet();render();}
function cmSaveSale(){const d=cmDraft,m=cmSaleMath(d);if(d.items.some(it=>cmOfferChanged(it.productId,it.commerce?.offer))){toast('العرض اتغير أو انتهى، افتح تعديل الصنف واختار تحديث السعر والعرض');return;}if(!d.customerId||!d.items.length){toast('اختار العميل وضيف صنف');return;}if(num(d.discount)>0&&(m.hasOffer||!d.discountReason.trim())){toast('راجع سبب الخصم، مش بيتجمع مع العرض');return;}const paid=d.paid===''?m.total:cmNumber(d.paid);if(paid<0||!Number.isFinite(paid)){toast('راجع المدفوع');return;}for(const it of d.items){const p=prod(it.productId);if(!p||it.qty<=0||it.qty>p.stock){toast('المخزون اتغير، راجع الكمية');return;}}const items=d.items.map(it=>({...structuredClone(it),moveId:uid(),moveKind:'sale'}));if(m.discount)items.forEach(it=>{it.commerce.invoiceDiscountReason=d.discountReason;it.commerce.invoiceDiscountAmount=m.discount;});const inv={id:uid(),num:DB.nextNum++,date:new Date().toISOString(),customerId:d.customerId,priceType:'r',items,discPct:m.sub?m.discount/m.sub*100:0,discAmt:m.discount,taxPct:0,taxAmt:0,deliveryFee:0,total:m.total,paid,payMethod:'كاش',creditUsed:0};items.forEach(it=>{const p=prod(it.productId),b=p.stock;p.stock=cmRound(b-it.qty,3);logMove(p.id,'sale',-it.qty,b,p.stock,'فاتورة #'+inv.num,it.moveId);});DB.invoices.push(inv);save();enqueue({type:'invoice',table:'invoices',rowId:inv.id,payload:structuredClone(inv)});cmDraft=null;go('#/inv/'+inv.id);render();toast('الفاتورة اتحفظت ✓');}
function cmInvoiceHTML(inv,print=false){const its=inv.items.filter(x=>x.commerce);if(!its.length)return'';return `<div ${print?'style="margin:12px 0;font-size:12px"':'class="total-card" style="margin:12px 0"'}><b>تفاصيل الوحدات والخصومات</b>${its.map(it=>`<div style="margin-top:9px"><b>${esc(it.name)}</b>${cmDetail(it).map(s=>`<div style="font-size:12px;line-height:1.8">${esc(s)}</div>`).join('')}</div>`).join('')}</div>`;}
function vUnitProducts(){return appbar('اختياري لكل صنف','وحدات البيع والأسعار',gearBtn())+`<div class="content">${cmSyncNote()}${DB.products.filter(p=>!p.deleted&&!(isMobile()&&mobIsModel(p))).map(p=>`<button class="row" onclick="cmUnitSheet('${p.id}')"><div class="mid"><b>${esc(p.name)}</b><div class="cm-note">${esc(p.unit)} · ${fmt(p.rPrice)} ج / ${esc(p.unit)}</div></div>تعديل</button>`).join('')}</div>`+navbar('home');}
function cmUnitSheet(pid){if(!can('products'))return;const p=prod(pid),c=p.unitConfig||{};sheet('وحدات '+p.name,`<div class="cm-note">المخزون والتكلفة في الوحدة الأساسية. لا نعيد تفسير الرصيد القديم عند تغيير الوحدة.</div><div class="field"><div class="lbl">وحدة المخزون الأساسية</div><select id="un-base" ${p.stock||DB.invoices.some(i=>i.items.some(it=>it.productId===pid))?'disabled':''}>${[...new Set([c.base||p.unit,'قطعة','كجم','متر'])].map(l=>`<option ${(c.base||p.unit)===l?'selected':''}>${l}</option>`).join('')}</select></div>${cmField('un-pack','اسم العبوة (اختياري)',c.packLabel||'')}${cmField('un-factor','عدد الوحدات الأساسية في العبوة',c.packFactor||'','inputmode="decimal"')}${cmField('un-area','مساحة القطعة بالمتر المربع (سيراميك فقط)',c.area||'','inputmode="decimal"')}<label style="display:flex;gap:10px;margin:14px 0"><input id="un-whole" type="checkbox" ${c.wholePack?'checked':''}>العبوات الكاملة فقط عند اختيار العبوة</label><div class="field"><div class="lbl">طريقة إدخال السعر</div><select id="un-pricemode" onchange="cmUnitPriceMode()"><option value="base" ${!c.area?'selected':''}>بالوحدة الأساسية</option><option value="area" ${c.area?'selected':''}>بالمتر المربع</option></select></div>${cmField('un-price','السعر الحالي للوحدة الأساسية',p.rPrice,'inputmode="decimal"')}${cmField('un-areaPrice','أو سعر المتر المربع (مع مساحة القطعة)',c.area?cmRound(p.rPrice/c.area):'','inputmode="decimal"')}<div class="cm-note">السعر الجديد للمبيعات الجديدة فقط. الفاتورة المفتوحة تحتاج اختيار تحديث السعر، والقديمة لا تتغير. للمتر الطولي اختار متر، مش م².</div><button class="btn btn-p" style="width:100%;margin-top:14px" onclick="cmSaveUnits('${pid}')">حفظ الوحدات والسعر</button>`);cmUnitPriceMode();}
function cmSaveUnits(pid){if(!can('products'))return;const p=prod(pid),base=$('#un-base').value,packLabel=$('#un-pack').value.trim(),packFactor=$('#un-factor').value.trim()?cmNumber($('#un-factor').value):0,area=$('#un-area').value.trim()?cmNumber($('#un-area').value):0,price=cmNumber($('#un-price').value),areaPrice=$('#un-areaPrice').value.trim()?cmNumber($('#un-areaPrice').value):0;if(![packFactor,area,price,areaPrice].every(Number.isFinite)||($('#un-pricemode').value==='area'&&(!area||!$('#un-areaPrice').value.trim()))||(packLabel&&packFactor<=0)||(!packLabel&&packFactor>0)||area<0||price<0||areaPrice<0||(area&&base!=='قطعة')||(base==='قطعة'&&packFactor&&!Number.isInteger(packFactor))){toast('راجع وحدات العبوة والمساحة والسعر');return;}p.unitConfig={base,packLabel,packFactor:packLabel?packFactor:0,area,discrete:base==='قطعة',wholePack:$('#un-whole').checked};p.unit=base;p.rPrice=$('#un-pricemode').value==='area'?cmRound(area*areaPrice,6):price;save();enqueue({type:'upsert',table:'products',rowId:p.id,row:ENT.products.map(p)});closeSheet();render();toast('الوحدات والسعر اتحفظوا ✓');}
function cmMobileQuote(x){if(x.cmQuote)return x.cmQuote;const d=x.k==='d'?DB.devices.find(z=>z.id===x.id):null,p=prod(d?d.productId:x.id),base=d?d.price:p?.rPrice||0;cmEnsure();x.cmQuote=cmQuote(DB.offers,d?d.productId:x.id,base);return x.cmQuote;}
function cmMobileMeta(x){const q=cmMobileQuote(x);return q.offer?{commerce:{offer:structuredClone(q.offer)}}:{};}
function cmMobileOfferText(x){const q=cmMobileQuote(x);return q.offer?`<div class="cm-note">خصم ${esc(q.offer.name)} · قبل العرض ${fmt(q.original)} ج / وحدة</div>`:'';}
function cmInvoiceDiscountLabel(inv){return inv.items.find(it=>it.commerce?.invoiceDiscountReason)?.commerce.invoiceDiscountReason||('خصم '+fmt(inv.discPct)+'٪');}
function cmReturnPrice(inv,it){const sub=inv.items.reduce((n,x)=>n+x.qty*x.price,0);return inv.discAmt>0&&sub>0?it.price*(1-inv.discAmt/sub):it.price;}
function cmReturnInput(it,i){return `<div>كمية بوحدة المخزون ${esc(it.unit)}، حسب التحويل المحفوظ</div><input aria-label="كمية المرتجع" inputmode="decimal" value="${it.qty}" oninput="cmRetQty(${i},this.value)" style="width:100px">`;}
function cmRetQty(i,v){const it=retDraft.items[i],q=cmNumber(v);it._cmInvalid=true;if(!Number.isFinite(q)||q<0||q>it.max){toast('الكمية أكبر من اللي اتباع');return;}if(it.commerce?.unitConfig?.discrete&&!Number.isInteger(q)){toast('المرتجع لازم قطع كاملة');return;}if(Math.abs(q*1000-Math.round(q*1000))>0.000001){toast('حتى ٣ خانات عشرية');return;}it.qty=q;delete it._cmInvalid;const t=$('#ret-total');if(t)t.textContent=fmt(retDraft.items.reduce((s,x)=>s+x.qty*x.price,0))+' ج';}

function cmFmtQty(n){return Number(n).toLocaleString(AR,{maximumFractionDigits:3});}

function cmLineProduct(p,old){return old?.commerce?{...p,unit:old.unit,unitConfig:old.commerce.unitConfig}:p;}

function cmMobileCardPrice(pid,base){cmEnsure();const q=cmQuote(DB.offers,pid,base);return q.offer?`<small style="display:block;color:var(--muted)"><s>${fmt(base)} ج</s> · ${esc(q.offer.name)}</small>${fmt(q.price)} <small>ج</small>`:`${fmt(base)} <small>ج</small>`;}
function cmLegacyDiscount(andPrint){sheet('سبب خصم الفاتورة',`${cmField('legacy-discount-reason','سبب الخصم (مطلوب)')}<div class="cm-note">هيظهر في الفاتورة والطباعة، من غير تغيير شاشة الفاتورة.</div><button class="btn btn-p" style="width:100%;margin-top:12px" onclick="cmLegacyDiscountSave(${!!andPrint})">تأكيد السبب وحفظ الفاتورة</button>`);}
function cmLegacyDiscountSave(andPrint){const reason=$('#legacy-discount-reason').value.trim();if(!reason){toast('اكتب سبب الخصم');return;}invDraft.discountReason=reason;closeSheet();saveInvoice(andPrint);}

function cmUnitPriceMode(){const area=$('#un-pricemode').value==='area';$('#un-price').disabled=area;$('#un-areaPrice').disabled=!area;}

function cmOfferChanged(pid,snapshot){if(!snapshot)return false;const q=cmQuote(DB.offers||[],pid,snapshot.original);return q.conflict||!q.offer||q.offer.id!==snapshot.id||q.price!==snapshot.price||q.offer.name!==snapshot.name;}
function cmMobileRefresh(){mobCart.forEach(x=>delete x.cmQuote);mobCheckoutRender();mobBar();}

/* @shop-audit */
/* Shop audit, owner-only. Never guess unknown historical actors. */
let auditRows=[],auditBefore=null,auditBusy=false,auditTenant=null,auditType='';
const auditLabels={products:'صنف',customers:'عميل',suppliers:'مورد',invoices:'فاتورة',purchases:'توريد',payments:'دفعة',movements:'حركة مخزون',sales_returns:'مرتجع',expenses:'مصروف',drawer_entries:'درج',day_closes:'قفل يوم',service_txns:'خدمة',shop_info:'بيانات المحل',orders:'طلب',devices:'جهاز',installment_contracts:'عقد أقساط',repair_tickets:'صيانة',offers:'عرض'};
const auditActs={create:'إضافة',update:'تعديل',delete:'حذف',restore:'استعادة',wipe:'مسح بيانات المحل',correction:'تصحيح'};
function auditActor(x){return esc(x?.createdActorName||x?.created_actor_name||'غير معروف');}
function auditAnnotation(x){return `<span class="actor-note" style="display:block;color:var(--muted);font-size:11px;margin-top:6px">نفّذها: ${auditActor(x)}${x?.actorPending?' · مستني تأكيد المزامنة':''}</span>`;}
async function auditLoad(older=false){if(!curUser?.owner||curUser.tenantBlocked)return;if(auditBusy)return;auditBusy=true;const tenant=curUser.tenantId;try{await SB.ensureSession();const rows=await rpc('shop_audit_list',{p_before:older?auditBefore:null,p_actor:null,p_table:auditType||null});if(curUser?.tenantId!==tenant)return;auditTenant=tenant;auditRows=older?auditRows.concat(rows):rows;auditBefore=rows.length?rows[rows.length-1].id:null;if(location.hash==='#/audit')render();}catch(e){toast('تعذر تحميل السجل. اتأكد من الاتصال وتجهيز تحديث السجل.');}finally{auditBusy=false;}}
function auditHTML(){if(!curUser?.owner)return vNoPerm();if(auditTenant!==curUser.tenantId){auditRows=[];auditBefore=null;auditType='';}return `<div class="appbar"><div>${backBtn('#/settings')}<div class="shop">السجل الرقابي</div><small>${esc(DB.settings.shopName)}</small></div></div><div class="content"><div class="note">صاحب المحل بس يقدر يشوف السجل ويصحح العمليات. الأصل محفوظ، والتصحيح عملية جديدة بسبب واضح.</div><div class="field"><label class="lbl" for="au-type">نوع العملية</label><select id="au-type" onchange="auditType=this.value;auditLoad()"><option value="">كل العمليات</option>${Object.entries(auditLabels).map(([k,v])=>`<option value="${k}" ${auditType===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label class="lbl" for="au-search">ابحث في الصفحة الحالية</label><input id="au-search" placeholder="رقم أو اسم الحساب" oninput="auditFilter(this.value)"></div><button class="btn btn-p" style="width:100%" onclick="auditLoad()">تحديث السجل</button><div id="au-rows">${auditCards(auditRows)}</div>${auditBefore?'<button class="btn" style="width:100%" onclick="auditLoad(true)">عمليات أقدم</button>':''}</div>`;}
function auditCards(rows){return rows.map(e=>`<div class="total-card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(auditActs[e.action]||e.action)} ${esc(auditLabels[e.table_name]||e.table_name)}</b><small>#${esc(e.row_id||e.id)}</small></div><p style="color:var(--green)">نفّذها: ${esc(e.actor_name||'غير معروف')}</p><p>${esc(new Date(e.event_at).toLocaleString('ar-EG'))}</p>${e.reason?`<p>السبب: ${esc(e.reason)}</p>`:''}${e.corrected?'<p>العملية ليها تصحيح محفوظ</p>':''}<button class="btn" style="width:100%;border:1px solid var(--line)" onclick="auditOpen(${Number(e.id)})">تفاصيل ومراجعة التصحيح</button></div>`).join('')||'<div class="empty">مفيش عمليات مسجلة في الصفحة دي</div>';}
function auditFilter(v){document.querySelector('#au-rows').innerHTML=auditCards(auditRows.filter(e=>[e.row_id,e.actor_name,e.reason,auditLabels[e.table_name]].join(' ').includes(v)));}
async function auditOpen(id){if(!curUser?.owner)return;const tenant=curUser.tenantId;try{await SB.ensureSession();const e=await rpc('shop_audit_detail',{p_id:id});if(curUser?.tenantId!==tenant)return;if(!e)throw Error('missing');const payment=e.action==='create'&&e.table_name==='payments'&&!e.after_row?.correction_of&&Number(e.after_row?.amount)>0;const cash=e.action==='create'&&['expenses','drawer_entries'].includes(e.table_name)&&!e.after_row?.correction_of;const restore=e.action==='delete'&&['products','customers','suppliers'].includes(e.table_name)&&e.before_row;sheet('تفاصيل العملية',`<p>${esc(auditActs[e.action]||e.action)} ${esc(auditLabels[e.table_name]||e.table_name)} #${esc(e.row_id||e.id)}</p><p>نفّذها: ${esc(e.actor_name||'غير معروف')}</p><h3>قبل</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere;direction:rtl;text-align:right;max-height:180px;overflow:auto">${esc(auditSnapshot(e.before_row))}</pre><h3>بعد</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere;direction:rtl;text-align:right;max-height:180px;overflow:auto">${esc(auditSnapshot(e.after_row))}</pre>${payment?`<div class="field"><label class="lbl" for="au-reason">سبب تصحيح الدفعة</label><input id="au-reason"></div><div class="note">بيتسجل قيد عكسي، الأصل محفوظ. الأقساط والأيام المقفولة أو البيانات المتغيرة بتتوقف للمراجعة.</div><button class="btn btn-p" style="width:100%" onclick="auditCorrectPayment(${Number(e.id)})">تأكيد قيد تصحيح الدفعة</button>`:cash?`<div class="field"><label class="lbl" for="au-reason">سبب التصحيح</label><input id="au-reason"></div><div class="note">الأصل مش بيتمسح. بيتسجل قيد عكسي جديد بتاريخ النهارده. لو اليوم اتقفل أو العملية اتغيرت، التصحيح بيتوقف للمراجعة.</div><button class="btn btn-p" style="width:100%" onclick="auditCorrectCash(${Number(e.id)})">تأكيد القيد العكسي</button>`:restore?`<div class="field"><label class="lbl" for="au-reason">سبب الاستعادة</label><input id="au-reason"></div><div class="note">يراجع السيرفر آخر نسخة قبل الاستعادة. لو الصنف اتغير، العملية مش هتكمل.</div><button class="btn btn-p" style="width:100%" onclick="auditRestore(${Number(e.id)})">تأكيد استعادة المحذوف</button>`:'<div class="note">التراجع المالي مش حذف للسجل. تصحيح الفواتير والتحصيل والمخزون المرتبط محتاج مراجعة العمليات التابعة. التصحيح التلقائي للنوع ده مش ضمن الإصدار ده.</div>'}`);}catch(e){toast('تعذر فتح العملية');}}
function auditDisplay(r){if(!r)return null;const x={...r};for(const k of ['tenant_id','created_actor_id','updated_actor_id'])delete x[k];return x;}
async function auditRestore(id){if(auditBusy||!curUser?.owner)return;const reason=document.querySelector('#au-reason')?.value.trim();if(!reason||reason.length<3){toast('اكتب سبب واضح');return;}auditBusy=true;try{await SB.ensureSession();await rpc('shop_restore_deleted',{p_id:id,p_reason:reason});closeSheet();toast('السجل المحذوف اتعاد والتصحيح محفوظ');await pullDelta(true);}catch(e){toast('الاستعادة لم تتأكد. حدّث السجل وراجع آخر حالة قبل إعادة المحاولة.');}finally{auditBusy=false;}await auditLoad();}
// Preserve server-stamped names through every mapped table. The client never writes them.
for(const k of Object.keys(ENT)){const old=ENT[k].unmap;if(!old)continue;ENT[k].unmap=function(r,...a){return Object.assign(old.call(this,r,...a),{correctionOf:r.correction_of||null,createdActorId:r.created_actor_id||null,createdActorName:r.created_actor_name||null,updatedActorId:r.updated_actor_id||null,updatedActorName:r.updated_actor_name||null});};}
// A pre-wipe device is never allowed to silently replay its cached writes.
const auditRefreshTenant=refreshTenant;
refreshTenant=async function(){await auditRefreshTenant();if(!curUser||curUser.tenantBlocked)return;const r=await SB.req('shop_control?tenant_id=eq.'+encodeURIComponent(curUser.tenantId)+'&select=generation');if(!r?.[0])throw Error('shop control unavailable');const g=Number(r[0].generation);if(!Number.isSafeInteger(g)||g<1)throw Error('invalid generation');const key=tenantKey('mahal_generation'),old=Number(localStorage.getItem(key)||1);if(old!==g){const pending=outboxGet();if(pending.length)localStorage.setItem(tenantKey('mahal_quarantined_outbox_'+old),JSON.stringify({generation:old,operations:pending,quarantinedAt:new Date().toISOString()}));localStorage.removeItem(OUTBOX_KEY);localStorage.removeItem(SYNC2_KEY);localStorage.removeItem(SYNC_KEY);localStorage.removeItem(DIRTY_KEY);localStorage.removeItem(KEY);const fresh=seed();ENT_ORDER.forEach(k=>fresh[k]=[]);for(const k of ['devices','contracts','tickets','users','drafts','offers'])fresh[k]=[];fresh.settings.shopName=DB.settings.shopName;fresh.settings.migratedV2=true;DB=fresh;invDraft=null;purDraft=null;localStorage.setItem(key,String(g));toast('بيانات المحل اتصفّرت من المالك. النسخة القديمة مش هتتزامن.');}curUser.generation=g;localStorage.setItem(key,String(g));};

const auditFlush=flushOutbox;flushOutbox=async function(){if(curUser&&navigator.onLine){try{await refreshTenant();}catch(e){return;}}return auditFlush();};

async function auditCorrectCash(id){if(auditBusy||!curUser?.owner)return;const reason=document.querySelector('#au-reason')?.value.trim();if(!reason||reason.length<3){toast('اكتب سبب واضح');return;}auditBusy=true;try{await rpc('shop_correct_cash_event',{p_id:id,p_reason:reason});closeSheet();await pullDelta(true);toast('اتسجل التصحيح والأصل محفوظ');}catch(e){toast('التصحيح لم يتأكد. راجع آخر حالة العملية وقفل اليوم قبل المحاولة.');}finally{auditBusy=false;}await auditLoad();}

async function auditCorrectPayment(id){if(auditBusy||!curUser?.owner)return;const reason=document.querySelector('#au-reason')?.value.trim();if(!reason||reason.length<3){toast('اكتب سبب واضح');return;}auditBusy=true;try{await rpc('shop_correct_payment',{p_id:id,p_reason:reason});closeSheet();await pullDelta(true);toast('اتسجل قيد تصحيح الدفعة والأصل محفوظ');}catch{toast('تصحيح الدفعة لم يتأكد. راجع الأقساط وقفل اليوم وآخر حالة العملية.');}finally{auditBusy=false;}await auditLoad();}

const auditEnqueue=enqueue;enqueue=function(op){const key=Object.keys(ENT).find(k=>ENT[k].table===op.table),row=key&&DB[key]?.find(x=>x.id===op.rowId);if(row&&!row.createdActorName){row.createdActorName=curUser?.name||'غير معروف';row.actorPending=true;}return auditEnqueue(op);};

function auditSnapshot(row){if(!row)return 'مفيش بيانات';const labels={id:'الرقم',name:'الاسم',title:'البيان',amount:'المبلغ',method:'طريقة الدفع',kind:'النوع',stock:'المخزون',deleted:'محذوف',total:'الإجمالي',paid:'المدفوع',note:'ملاحظة',date:'التاريخ',created_actor_name:'نفّذها',updated_actor_name:'آخر تعديل',correction_of:'تصحيح للعملية',customer_id:'رقم العميل',supplier_id:'رقم المورد',party_id:'رقم الطرف',party_type:'نوع الطرف',num:'رقم الفاتورة'};const x=auditDisplay(row),result={};for(const [k,v] of Object.entries(x)){if(k==='updated_at'||k==='inserted_at'||k==='created_by')continue;result[labels[k]||k]=typeof v==='boolean'?(v?'نعم':'لا'):k==='kind'?({in:'داخل',out:'خارج'}[v]||v):k==='party_type'?({c:'عميل',s:'مورد'}[v]||v):v;}return Object.entries(result).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join('\n');}
