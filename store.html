<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C7A54">
<title>المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F5F1E8;--card:#FFF;--line:#EAE2D3;--ink:#23201A;--muted:#8A8172;
--green:#1C7A54;--green-soft:#E4F1EA;--amber:#DE9A2B;--amber-soft:#FBF0DC;
--red:#C24A3E;--red-soft:#F9E7E5;--blue:#2F6296;--blue-soft:#E8EFF7;
}
body{font-family:'Cairo','Noto Sans Arabic',system-ui,sans-serif;background:#DDD6C7;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:110px;box-shadow:0 0 40px rgba(0,0,0,.08)}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:15px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hero{background:var(--green);color:#fff;padding:26px 20px 30px;text-align:center;border-radius:0 0 26px 26px}
.hero h1{font-size:23px;font-weight:800}
.hero p{font-size:13px;color:#CDE7DA;margin-top:4px;font-weight:600}
.content{padding:14px 16px 0}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:var(--ink)}
.cat-t{font-size:14px;font-weight:800;margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.prd .ph{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--green-soft);display:block}
.prd .ph-none{display:flex;align-items:center;justify-content:center;color:var(--green)}
.prd .nm{font-size:13.5px;font-weight:800;line-height:1.5;min-height:40px}
.prd .pr{font-size:15px;font-weight:800;color:var(--green)}
.prd .pr small{font-size:10.5px;color:var(--muted);font-weight:600}
.prd .stk{font-size:10.5px;font-weight:800}
.prd .stk.ok{color:var(--green)}
.prd .stk.low{color:#9A6A14}
.prd button{background:var(--green);color:#fff;border-radius:10px;padding:9px 0;font-size:12.5px;font-weight:800;margin-top:2px}
.prd button:disabled{background:#EDE7DA;color:var(--muted);cursor:default}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 12px;font-weight:600;line-height:1.9}
.empty .big{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px}
.dch{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;font-size:13px;font-weight:800;color:var(--ink);font-family:inherit}
.dch.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.dch.wide{width:100%;margin-bottom:7px;text-align:right;padding:12px 14px}
.zsel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none;font-family:inherit;font-weight:700}
.payinfo{background:#FDF3E3;border:1px solid #F0DFC0;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.7}
.cartbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:15}
.cartbar button{width:100%;background:var(--green);color:#fff;border-radius:16px;padding:15px 0;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(28,122,84,.3)}
.overlay{position:fixed;inset:0;background:rgba(35,32,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet .st{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center}
.sheet .x{position:absolute;left:16px;top:14px;color:var(--muted)}
.sheet-wrap{position:relative}
.field{margin-bottom:13px}
.field .lbl{font-size:12.5px;font-weight:800;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.citem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.citem .mid{flex:1;min-width:0}
.citem .t{font-size:13px;font-weight:800}
.citem .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.citem .qty{display:flex;align-items:center;gap:9px;background:#F1ECE1;border-radius:10px;padding:5px 9px}
.citem .qty .n{font-size:14px;font-weight:800;min-width:18px;text-align:center}
.citem .qty button{font-size:16px;color:var(--green);font-weight:800;width:22px;height:22px}
.trow{display:flex;justify-content:space-between;font-size:14.5px;font-weight:800;padding:10px 2px;border-top:1px dashed var(--line);margin-top:4px}
.btn{border-radius:16px;padding:14px 0;text-align:center;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.btn-p{background:var(--green);color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-s{background:var(--card);border:1px solid var(--line);margin-top:8px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease;max-width:88vw;text-align:center}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.done-wrap{text-align:center;padding:30px 18px}
.done-wrap .ck{width:70px;height:70px;border-radius:26px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done-wrap h2{font-size:19px;font-weight:800}
.done-wrap p{font-size:13px;color:var(--muted);font-weight:600;margin:8px 0 18px;line-height:1.9}
.note{font-size:11px;color:var(--muted);text-align:center;font-weight:600;margin-top:16px;line-height:1.8}
@media(min-width:768px){
#app{max-width:1080px}
.cartbar{max-width:640px}
.sheet{max-width:620px}
.grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1200px){
.grid{grid-template-columns:repeat(4,1fr)}
}

/* ===== الوضع الداكن (الافتراضي فاتح) ===== */
html[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--card:#18263b;--line:#2a3c57;--ink:#e9eef8;--muted:#9fb0c6;--green:#17a77d;--green2:#12a37a;--green-soft:#123a35;--amber:#f0aa2c;--amber-soft:#3b3015;--red:#f27067;--red-soft:#3d2128;--blue:#6aa8ff;--blue-soft:#162f4d;--deep:#0c3b2f;--purple:#a58bf5;--purple-soft:#2a2150}
html[data-theme=dark] body{background:#060b14}
html[data-theme=dark] #app{box-shadow:0 0 40px rgba(0,0,0,.5)}
html[data-theme=dark] [style*="color:#9A6A14"],html[data-theme=dark] .prd .stk.low{color:#e8b64a!important}
html[data-theme=dark] .qty,html[data-theme=dark] .citem .qty{background:#0f1a2b}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#0f1a2b;color:var(--ink);border-color:var(--line)}
html[data-theme=dark] ::placeholder{color:#7487a0}
html[data-theme=dark] .search input{background:transparent}
html[data-theme=dark] .seg{background:#0f1a2b}
html[data-theme=dark] .seg button:not(.on):not(.act):not(.sel){color:var(--muted)}
html[data-theme=dark] .user-pick,html[data-theme=dark] .cost-in,html[data-theme=dark] .trow input,html[data-theme=dark] .lockcard input{background:#0f1a2b;color:var(--ink)}
html[data-theme=dark] .prd button:disabled{background:#223148;color:var(--muted)}
html[data-theme=dark] [style*="background:#FDF3DC"]{background:var(--amber-soft)!important}
html[data-theme=dark] [style*="background:#E7F5EC"]{background:var(--green-soft)!important}
html[data-theme=dark] [style*="background:#F1ECE1"]{background:#0f1a2b!important}
html[data-theme=dark] [style*="color:#2F567F"]{color:#9cc4f5!important}
html[data-theme=dark] [style*="color:#1E6B3C"]{color:#6fe0a8!important}
html[data-theme=dark] .alert{border-color:#2a3c57}
html[data-theme=dark] .sheet,html[data-theme=dark] .modal{background:#111d2e}
html[data-theme=dark] .toast{background:#e9eef8;color:#0b1220}
html[data-theme=dark] .photo-pick{border-color:#3a4f6d}
#themeBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:900;width:34px;height:34px;border-radius:50%;border:1px solid rgba(128,128,128,.4);background:rgba(20,30,45,.55);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);padding:0}
@media print{#themeBtn{display:none!important}}

.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}}
@media(min-width:1200px){#app{max-width:1280px}.grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}}
html[data-theme=dark] .hero{background:linear-gradient(135deg,#17a77d,#0c3b2f)}
</style>
<script id="theme-early">try{var t=localStorage.getItem('mahal_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script></head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<script>
'use strict';
/* ============================================================
   إعدادات المتجر — بتتملى مرة واحدة لما المشروع يتعمل
   (المفتاح ده عمومي بالتصميم: بيسمح بقراءة الأصناف وإرسال طلب بس،
    والحماية الحقيقية من صلاحيات قاعدة البيانات RLS)
   ============================================================ */
const STORE_CFG={url:'https://ofqhrpkgxxbdrhuujgxt.supabase.co',anon:'sb_publishable_CH8nhDJQlV-5xsKYoCZRVg_mUoLsTQw'};
const OILS_TENANT='5336a072-d9eb-43d9-ac91-4d9d6572b781';
const STORE_PARAM=new URLSearchParams(location.search).get('shop');
const TENANT=STORE_PARAM===null?OILS_TENANT:STORE_PARAM.toLowerCase();
const VALID_TENANT=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(TENANT);
const CART_KEY=TENANT===OILS_TENANT?'mahal_store_cart':'mahal_store_cart:'+TENANT;
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const AR='ar-EG';
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString(AR,{maximumFractionDigits:2});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
const IC={
search:'<circle cx="11" cy="11" r="6.2"/><path d="m20 20-3.6-3.6"/>',
cart:'<circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2.4l2.2 11h10.6l2-8H6.2"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',
check:'<path d="m4.5 12.5 5 5L19.5 7"/>',
wa:'<path d="M21 11.8a8.3 8.3 0 0 1-8.4 8.2c-1.4 0-2.8-.3-4-1L3 20.4l1.5-5A8.3 8.3 0 1 1 21 11.8z"/>',
box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>',
};
const ic=(n,s)=>`<svg class="i"${s?` style="width:${s}px;height:${s}px"`:''} viewBox="0 0 24 24">${IC[n]||''}</svg>`;
/* ============ data ============ */
const DEMO=new URLSearchParams(location.search).has('demo');
const DEMO_PRODUCTS=[
{id:'p1',name:'زيت عباد ١٠ لتر',cat:'زيوت وسمنة',unit:'قطعة',price:520,stock:6},
{id:'p2',name:'زيت خليط ٤٫٥ لتر',cat:'زيوت وسمنة',unit:'قطعة',price:260,stock:32},
{id:'p3',name:'زيت ذرة ٨٠٠ مل',cat:'زيوت وسمنة',unit:'زجاجة',price:75,stock:48},
{id:'p4',name:'سمنة بلدي (علبة ٢ كيلو)',cat:'زيوت وسمنة',unit:'علبة',price:420,stock:12},
{id:'p5',name:'فول بلدي (شيكارة ٢٥ كيلو)',cat:'فول وبقوليات',unit:'شيكارة',price:1250,stock:18},
{id:'p6',name:'فول مجروش (كيلو)',cat:'فول وبقوليات',unit:'كيلو',price:55,stock:60},
{id:'p7',name:'عدس أصفر (كيلو)',cat:'فول وبقوليات',unit:'كيلو',price:50,stock:75},
{id:'p8',name:'أرز مصري (كيلو)',cat:'أرز ومكرونة',unit:'كيلو',price:33,stock:120},
{id:'p9',name:'مكرونة (كيس ١ كيلو)',cat:'أرز ومكرونة',unit:'كيس',price:22,stock:80},
{id:'p10',name:'سكر (كيلو)',cat:'مستلزمات',unit:'كيلو',price:35,stock:90},
{id:'p11',name:'شاي (علبة ٢٥٠ جم)',cat:'مستلزمات',unit:'علبة',price:48,stock:36},
{id:'p12',name:'دقيق (شيكارة ١٠ كيلو)',cat:'مستلزمات',unit:'شيكارة',price:350,stock:0},
];
const DEMO_INFO={shop_name:'محل البركة',phone:''};
let shopInfo={shop_name:'المتجر',phone:''};
let products=null,loadErr=false,notReady=false;
let payCfg=null;
const CO={del:'delivery',pay:'',zone:'',name:'',phone:'',addr:'',note:''};
let cart={};
try{cart=JSON.parse(localStorage.getItem(CART_KEY))||{};}catch(e){cart={};}
const saveCart=()=>localStorage.setItem(CART_KEY,JSON.stringify(cart));
const cartCount=()=>Object.values(cart).reduce((s,q)=>s+q,0);
const cartTotal=()=>Object.entries(cart).reduce((s,[id,q])=>{const p=(products||[]).find(x=>x.id===id);return s+(p?p.price*q:0);},0);
async function loadStore(){
if(DEMO){products=DEMO_PRODUCTS;shopInfo=DEMO_INFO;render();return;}
if(!STORE_CFG.url||!STORE_CFG.anon){products=[];render();return;}
try{
 const h={'apikey':STORE_CFG.anon,'Authorization':'Bearer '+STORE_CFG.anon};
 const base=STORE_CFG.url.replace(/\/$/,'');
 if(!VALID_TENANT){notReady=true;products=[];render();return;}
 const r=await fetch(base+'/rest/v1/rpc/get_store',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({p_tenant:TENANT})});
 if(r.status===404){notReady=true;products=[];render();return;}
 if(!r.ok)throw Error('Store unavailable');
 const data=await r.json();
 if(!data||data.tenant_id!==TENANT){notReady=true;products=[];render();return;}
 products=data.products||[];storeOffers=(data.offers||[]).map(x=>({...x.data,id:x.id}));
 shopInfo=Object.assign({shop_name:'المتجر',phone:''},data.info||{});payCfg=shopInfo.payment||null;cmStoreRefresh();
 Object.keys(cart).forEach(id=>{const p=products.find(x=>x.id===id);if(!p||!p.stock||p.stock<=0)delete cart[id];else if(cart[id]>p.stock)cart[id]=p.stock;});saveCart();
}catch(e){loadErr=true;products=[];}
render();}
/* ============ views ============ */
function render(){cmStoreRefresh();const app=$('#app');
if(products===null){app.innerHTML=`<div class="hero"><h1>…</h1></div><div class="empty">بنحمّل المتجر…</div>`;return;}
if(notReady){app.innerHTML=`<div class="hero"><h1>المتجر</h1></div><div class="empty"><div class="big">المتجر تحت التجهيز</div>ارجع لينا قريب إن شاء الله</div>`;return;}
if(!DEMO&&(!STORE_CFG.url||!STORE_CFG.anon)){app.innerHTML=`<div class="hero"><h1>المتجر</h1></div><div class="empty"><div class="big">المتجر تحت التجهيز</div>ارجع لينا قريب إن شاء الله</div>`;return;}
if(loadErr){app.innerHTML=`<div class="hero"><h1>${esc(shopInfo.shop_name)}</h1></div><div class="empty"><div class="big">في مشكلة في التحميل</div>اتأكد من النت وجرب تاني</div><div style="padding:0 24px"><button class="btn btn-p" onclick="loadErr=false;products=null;loadStore()">حاول تاني</button></div>`;return;}
document.title=shopInfo.shop_name;
const q=(window._q||'').trim();
const list=products.filter(p=>!q||p.name.includes(q));
const cats=[...new Set(list.map(p=>p.cat||'أصناف'))];
app.innerHTML=`
<div class="hero"><h1>${esc(shopInfo.shop_name)}</h1><p>اطلب اللي محتاجه وهنوصلهولك${DEMO?' · نسخة تجريبية':''}</p></div>
<div class="content">
<div class="search">${ic('search',18)}<input placeholder="دوّر على صنف…" value="${esc(q)}" oninput="window._q=this.value;render()"></div>
${list.length?cats.map(c=>`<div class="cat-t">${esc(c)}</div><div class="grid">${list.filter(p=>(p.cat||'أصناف')===c).map(prdHTML).join('')}</div>`).join(''):(q?`<div class="empty"><div class="big">مفيش أصناف مطابقة</div>جرب كلمة تانية</div>`:`<div class="empty"><div class="big">المتجر لسه فاضي</div>الأصناف هتظهر هنا أول ما المحل ينزّلها</div>`)}
<div class="note">الأسعار بالجنيه · الأسعار بتتحدث من المحل أول بأول</div>
</div>
${cartCount()?`<div class="cartbar"><button onclick="openCart()">${ic('cart',20)} السلة · ${cartCount().toLocaleString(AR)} صنف · ${fmt(cartTotal())} جنيه</button></div>`:''}`;}
function prdHTML(p){const out=!p.stock||p.stock<=0;const inCart=cart[p.id]||0;
return `<div class="prd">${p.photo_url?`<img class="ph" src="${esc(p.photo_url)}" loading="lazy" alt="${esc(p.name)}">`:`<div class="ph ph-none">${ic('box',34)}</div>`}<div class="nm">${esc(p.name)}</div><div class="pr">${p.offer?`<small style="display:block;color:var(--green)">خصم ${esc(p.offer.name)}</small><s style="font-size:12px">${fmt(p.originalPrice)} ج</s> `:''}${fmt(p.price)} <small>جنيه / ${esc(p.unit||'قطعة')}</small></div><div class="stk ${out?'':'ok'}">${out?'<span style="color:var(--red)">غير متاح</span>':inCart?('في السلة: '+inCart.toLocaleString(AR)):'متاح'}</div><button ${out?'disabled':''} onclick="addToCart('${p.id}')">${out?'غير متاح':'ضيف للسلة ＋'}</button></div>`;}
function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;
const cur=cart[id]||0;
if(p.stock&&cur>=p.stock){toast('دي أقصى كمية متاحة دلوقتي');return;}
cart[id]=cur+1;saveCart();render();}
function chQty(id,d){const p=products.find(x=>x.id===id);let q=(cart[id]||0)+d;
if(q<=0){delete cart[id];}else{if(p&&p.stock&&q>p.stock){toast('دي أقصى كمية متاحة');return;}cart[id]=q;}
saveCart();render();if($('.overlay'))openCart();}
function payMethods(){const m=[];if(!payCfg)return m;
 if(payCfg.cash&&payCfg.cash.on)m.push({k:'cash',t:'💵 نقدي',d:'تدفع نقدي عند الاستلام'});
 if(payCfg.vf&&payCfg.vf.on&&payCfg.vf.num)m.push({k:'vf',t:'فودافون كاش',d:'حوّل الإجمالي على المحفظة: '+payCfg.vf.num});
 if(payCfg.insta&&payCfg.insta.on&&payCfg.insta.num)m.push({k:'insta',t:'إنستاباي',d:'حوّل الإجمالي على: '+payCfg.insta.num});
 if(payCfg.bank&&payCfg.bank.on&&payCfg.bank.num)m.push({k:'bank',t:'تحويل بنكي',d:'حوّل الإجمالي على: '+payCfg.bank.num});
 return m;}
function delOn(){return shopInfo.delivery_on!==false;}
function zoneList(){return (Array.isArray(shopInfo.zones)?shopInfo.zones:[]).filter(z=>z&&z.name);}
function pickZone(i){const z=zoneList()[i];CO.zone=z?z.name:'';openCart();}
function openCart(){cmStoreRefresh();const items=Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id===id),q})).filter(x=>x.p);
const methods=payMethods();const useNew=methods.length>0;
if(useNew&&!methods.find(m=>m.k===CO.pay))CO.pay=methods[0].k;
const selPay=methods.find(m=>m.k===CO.pay)||null;
if(useNew&&!delOn())CO.del='pickup';
const zones=zoneList();
if(useNew&&CO.del==='delivery'&&zones.length===1&&!CO.zone)CO.zone=zones[0].name;
if(zones.length&&!zones.find(z=>z.name===CO.zone))CO.zone='';
const selZone=zones.find(z=>z.name===CO.zone)||null;
const fee=(useNew&&CO.del==='delivery')?(zones.length?(selZone?Math.max(0,+selZone.fee||0):0):Math.max(0,+shopInfo.delivery_fee||0)):0;
const o=document.createElement('div');o.className='overlay';o.onclick=e=>{if(e.target===o)o.remove();};
o.innerHTML=`<div class="sheet"><div class="sheet-wrap"><button class="x" onclick="this.closest('.overlay').remove()">${ic('x')}</button><div class="st">سلتك</div>
${items.map(({p,q})=>`<div class="citem"><div class="mid"><div class="t">${esc(p.name)}</div><div class="s">${fmt(p.price)} ج / ${esc(p.unit||'قطعة')}${p.offer?`<br>خصم ${esc(p.offer.name)}، قبل العرض ${fmt(p.originalPrice)} ج`:''}${p.unit_config&&!p.unit_config.discrete?`<br><input aria-label="الوزن أو الكمية" inputmode="decimal" style="width:85px" value="${q}" onchange="cmStoreQty('${p.id}',this.value)">`:''}</div></div><div class="qty"><button onclick="chQty('${p.id}',1)">＋</button><div class="n">${q.toLocaleString(AR)}</div><button onclick="chQty('${p.id}',-1)">−</button></div></div>`).join('')}
${fee>0?`<div class="trow"><span>الأصناف</span><span>${fmt(cartTotal())} جنيه</span></div>
<div class="trow"><span>🚚 توصيل${selZone?` (${esc(selZone.name)})`:''}</span><span>${fmt(fee)} جنيه</span></div>`:''}
<div class="trow"><span>الإجمالي</span><span>${fmt(cartTotal()+fee)} جنيه</span></div>
<div class="field" style="margin-top:14px"><div class="lbl">اسمك</div><input id="ord-name" placeholder="اسم حضرتك" value="${esc(CO.name)}" oninput="CO.name=this.value"></div>
<div class="field"><div class="lbl">موبايلك (عشان نأكد الطلب)</div><input id="ord-phone" inputmode="tel" placeholder="01xxxxxxxxx" style="direction:ltr;text-align:right" value="${esc(CO.phone)}" oninput="CO.phone=this.value"></div>
${useNew?(delOn()?`<div class="field"><div class="lbl">طريقة الاستلام</div><div style="display:flex;gap:8px">
<button class="dch ${CO.del==='delivery'?'on':''}" onclick="CO.del='delivery';openCart()">🚚 دليفري</button>
<button class="dch ${CO.del==='pickup'?'on':''}" onclick="CO.del='pickup';openCart()">🏪 استلام من المحل</button></div></div>`
:`<div class="field"><div class="lbl">طريقة الاستلام</div><div class="payinfo" style="margin-top:0">🏪 الطلب استلام من المحل</div></div>`)+`
${CO.del==='delivery'&&zones.length?`<div class="field"><div class="lbl">منطقة التوصيل</div><select class="zsel" onchange="pickZone(this.selectedIndex-1)"><option ${CO.zone?'':'selected'} disabled>اختار منطقتك…</option>${zones.map(z=>`<option value="${esc(z.name)}" ${CO.zone===z.name?'selected':''}>${esc(z.name)} — ${fmt(z.fee)} ج</option>`).join('')}</select></div>`:''}
${CO.del==='delivery'?`<div class="field"><div class="lbl">العنوان بالتفصيل</div><textarea id="ord-addr" rows="2" placeholder="اسم الشارع، رقم العمارة، الدور، وأقرب علامة مميزة…" oninput="CO.addr=this.value">${esc(CO.addr)}</textarea></div>`:''}
<div class="field"><div class="lbl">ملاحظات (اختياري)</div><textarea id="ord-note" rows="1" placeholder="أي حاجة تحب تضيفها…" oninput="CO.note=this.value">${esc(CO.note)}</textarea></div>
<div class="field"><div class="lbl">طريقة الدفع</div>${methods.map(m=>`<button class="dch wide ${CO.pay===m.k?'on':''}" onclick="CO.pay='${m.k}';openCart()">${m.t}</button>`).join('')}
${selPay?`<div class="payinfo">${esc(selPay.d)}${selPay.k!=='cash'?' — وبعد التحويل ابعتلنا صورة الإيصال واتساب':''}</div>`:''}</div>`
:`<div class="field"><div class="lbl">العنوان أو أي ملاحظات</div><textarea id="ord-note" rows="2" placeholder="مثال: شارع كذا، الدور التالت…" oninput="CO.note=this.value">${esc(CO.note)}</textarea></div>`}
<button class="btn btn-p" onclick="submitOrder(false)">ابعت الطلب ✓</button>
${shopInfo.phone?`<button class="btn btn-wa" style="margin-top:8px" onclick="submitOrder(true)">${ic('wa',18)} ابعت الطلب واتساب</button>`:''}
</div></div>`;
$('#overlay-root').innerHTML='';$('#overlay-root').appendChild(o);}
async function submitOrder(viaWa){if(cmStoreRefresh()){toast('السعر أو العرض اتغير، راجع السلة قبل الإرسال');openCart();render();return;}const methods=payMethods();const useNew=methods.length>0;
if(useNew&&!methods.find(m=>m.k===CO.pay))CO.pay=methods[0].k;
const m=useNew?methods.find(x=>x.k===CO.pay):null;
const name=CO.name.trim();
const phone=CO.phone.trim();
const note=CO.note.trim();
const addr=CO.addr.trim();
if(!name){toast('اكتب اسمك الأول');return;}
if(!viaWa&&!phone){toast('اكتب رقم موبايلك عشان نأكد الطلب');return;}
if(useNew&&CO.del==='delivery'){const zn=zoneList();
 if(zn.length&&!CO.zone){toast('اختار منطقة التوصيل الأول');return;}
 if(!addr){toast('اكتب العنوان بالتفصيل عشان الدليفري يوصلك');return;}}
const items=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id===id);return p?{id,name:p.name,qty:q,price:p.price,unit:p.unit,...(p.offer?{commerce:{offer:p.offer}}:{})}:null;}).filter(Boolean);
if(!items.length){toast('السلة فاضية');return;}
for(const it of items){const p=products.find(x=>x.id===it.id);
 if(p&&typeof p.stock==='number'){if(p.stock<=0){toast('"'+p.name+'" غير متاح دلوقتي — شيله من السلة');return;}
 if(it.qty>p.stock){toast('المتاح من "'+p.name+'" حالياً '+p.stock.toLocaleString('ar-EG')+' — قلل الكمية');return;}}}
const zn=zoneList();const selZ=zn.find(z=>z.name===CO.zone)||null;
const feeApplied=(useNew&&CO.del==='delivery')?(zn.length?(selZ?Math.max(0,+selZ.fee||0):0):Math.max(0,+shopInfo.delivery_fee||0)):0;
const total=Math.round((cartTotal()+feeApplied)*100)/100;
const payload={customer_name:name,phone,note,items,total,tenant_id:TENANT};
if(useNew){payload.delivery=CO.del;payload.payment=CO.pay;if(CO.del==='delivery')payload.address=addr;if(feeApplied>0)payload.delivery_fee=feeApplied;if(selZ)payload.zone=selZ.name;}
const waText='طلب جديد من '+shopInfo.shop_name+':\n'+items.map(it=>'• '+it.name+' × '+it.qty+(it.commerce?.offer?' — خصم '+it.commerce.offer.name:'')).join('\n')+'\nالإجمالي: '+fmt(total)+' جنيه'+(feeApplied>0?('\n🚚 شامل توصيل '+(selZ?selZ.name+' ':'')+fmt(feeApplied)+' جنيه'):'')+(payload.delivery?('\n'+(CO.del==='pickup'?'🏪 استلام من المحل':'🚚 دليفري — '+addr)):'')+(m?('\n💳 الدفع: '+m.t):'')+(note?'\nملاحظات: '+note:'')+'\n— '+name+(phone?' ('+phone+')':'');
if(viaWa||DEMO){if(shopInfo.phone){let ph=String(shopInfo.phone).replace(/\D/g,'');if(ph.startsWith('0'))ph='2'+ph;
 window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(waText),'_blank');
 showDone(true);return;}
 if(DEMO){toast('دي نسخة تجريبية — الطلب الحقيقي هيشتغل لما المتجر يتفعّل');return;}}
try{
 const post=(body)=>fetch(STORE_CFG.url.replace(/\/$/,'')+'/rest/v1/orders',{method:'POST',headers:{'apikey':STORE_CFG.anon,'Authorization':'Bearer '+STORE_CFG.anon,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
 let r=await post(payload);
 const err=!r.ok?await r.clone().json().catch(()=>({})):{};
 if(!r.ok&&String(err.message||'').includes('price changed')){await loadStore();openCart();toast('السعر أو العرض اتغير، راجع السلة وأكد الإرسال من جديد');return;}
 if(!r.ok&&useNew&&!items.some(it=>it.commerce)&&/column|schema cache/i.test(String(err.message||''))){const packed=[CO.del==='pickup'?'🏪 استلام من المحل':('🚚 دليفري — '+addr),feeApplied>0?('التوصيل'+(selZ?' '+selZ.name:'')+': '+fmt(feeApplied)+' ج'):'',m?('الدفع: '+m.t):'',note].filter(Boolean).join('\n');
  r=await post({customer_name:name,phone,note:packed,items,total,tenant_id:TENANT});}
 if(!r.ok)throw 0;
 showDone(false);
}catch(e){toast('الطلب ماتأكدش، راجع الاتصال وحدّث المتجر قبل المحاولة تاني');}}
function showDone(viaWa){$('#overlay-root').innerHTML='';cart={};saveCart();CO.name='';CO.phone='';CO.addr='';CO.note='';CO.zone='';
$('#app').innerHTML=`<div class="hero"><h1>${esc(shopInfo.shop_name)}</h1></div>
<div class="done-wrap"><div class="ck">${ic('check',34)}</div><h2>طلبك وصل ✓</h2><p>${viaWa?'كمّل الإرسال في واتساب والمحل هيرد عليك يأكد':'المحل هيراجع الطلب ويتصل بيك يأكد'}<br>شكراً ليك ❤</p><button class="btn btn-p" onclick="render()">ارجع للمتجر</button></div>`;}
/* @store-commerce */
/* ===== Shared pricing: no side effects, use exact saved snapshots ===== */
function cmRound(n,p=2){const f=10**p;return Math.round((Number(n)+Number.EPSILON)*f)/f;}
function cmActive(o,at=Date.now()){const a=o.startsAt?Date.parse(o.startsAt):-Infinity,b=o.endsAt?Date.parse(o.endsAt):Infinity;return !!(o.active&&!o.deleted&&Number.isFinite(Number(o.value))&&Number(o.value)>0&&a<=at&&at<=b);}
function cmQuote(offers,pid,base,at=Date.now()){base=Number(base);const found=(offers||[]).filter(o=>cmActive(o,at)&&(o.productIds||[]).includes(pid)).sort((a,b)=>String(a.id).localeCompare(String(b.id)));if(!found.length)return{price:base,original:base,offer:null};const o=found[0];const reduction=o.kind==='pct'?base*Math.min(100,Number(o.value))/100:Math.min(base,Number(o.value));const price=cmRound(Math.max(0,base-reduction),6);return{price,original:base,offer:{id:o.id,name:o.name,kind:o.kind,value:Number(o.value),original:base,price,startsAt:o.startsAt||null,endsAt:o.endsAt||null,quotedAt:new Date(at).toISOString()},conflict:found.length>1};}
function cmUnits(p){const c=p.unitConfig;if(!c)return[{id:'base',label:p.unit||'قطعة',factor:1}];const a=[{id:'base',label:c.base||p.unit,factor:1}];if(c.packLabel&&c.packFactor>0)a.push({id:'pack',label:c.packLabel,factor:Number(c.packFactor)});if(c.area>0)a.push({id:'area',label:'م²',factor:1/Number(c.area)});return a;}
function cmQuantity(p,unitId,q){const c=p.unitConfig,u=cmUnits(p).find(x=>x.id===unitId);if(!u||!Number.isFinite(q)||q<=0)throw Error('اكتب كمية أكبر من صفر');const b=cmRound(q*u.factor,6);if(!c&&!Number.isInteger(q))throw Error('فعّل وحدات الوزن للصنف قبل إدخال كمية عشرية');if(c?.discrete&&Math.abs(b-Math.round(b))>0.000001)throw Error('الكمية مش عدد قطع صحيح. اختار قطع أو راجع الكراتين، مش هنقرب تلقائي.');if(!c?.discrete&&Math.abs(b*1000-Math.round(b*1000))>0.000001)throw Error('استخدم حتى ٣ خانات عشرية في وحدة المخزون');if(c?.wholePack&&unitId==='pack'&&!Number.isInteger(q))throw Error('اكتب عدد كراتين كامل، أو اختار قطع');return{unit:u,baseQty:c?.discrete?Math.round(b):cmRound(b,3)};}
function cmDetail(it){const c=it.commerce;if(!c)return[];let a=[];if(c.saleUnit){a.push('الكمية: '+c.saleQty+' '+c.saleUnit+(c.factor!==1?' = '+it.qty+' '+it.unit:'')+(c.areaQty?' = '+c.areaQty+' م²':''));a.push('السعر: '+cmRound(it.price*(c.factor||1),4)+' ج / '+c.saleUnit);}if(c.offer)a.push('خصم '+c.offer.name+': '+cmRound((c.offer.original-c.offer.price)*it.qty)+' ج، قبل الخصم '+cmRound(c.offer.original*it.qty)+' ج');if(c.invoiceDiscountReason)a.push('خصم الفاتورة: '+c.invoiceDiscountReason);return a;}

function cmNumber(v){const s=String(v).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٬/g,'').replace(/٫/g,'.');return /^-?(?:\d+\.?\d*|\.\d+)$/.test(s)?Number(s):NaN;}

/* Store pricing uses the same pure quote engine as owner sales. */
let storeOffers=[];
function cmStoreRefresh(){let changed=false;for(const p of products||[]){if(p.originalPrice==null)p.originalPrice=p.price;const q=cmQuote(storeOffers,p.id,p.originalPrice);if(p.price!==q.price)changed=true;p.price=q.price;p.offer=q.offer;}return changed;}
function cmStoreQty(id,value){const p=products.find(x=>x.id===id),q=cmNumber(value);if(!p||!Number.isFinite(q)||q<=0||q>p.stock){toast('راجع الكمية المتاحة');return;}try{cmQuantity({...p,unitConfig:p.unit_config},'base',q);}catch(e){toast(e.message);return;}cart[id]=q;saveCart();openCart();render();}

loadStore();
</script>
